name: Database Schema

on:
  pull_request:
    paths:
      - "apps/api/alembic/**"
      - "apps/api/alembic.ini"
      - "apps/api/src/lumi_api/persistence/**"
      - "apps/api/tests/integration/test_database_persistence.py"
      - "apps/api/tests/test_persistence_schema.py"
      - "apps/api/pyproject.toml"
      - "services/domain/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/db-local"
      - "infra/compose/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen Python install
        run: uv sync --all-packages --frozen
      - name: Prepare local infrastructure
        run: make infra-env
      - name: Start PostgreSQL infrastructure
        run: make infra-up
      - name: Empty database to Alembic head
        run: make db-upgrade
      - name: Seed deterministic fixtures
        run: make db-seed
      - name: Verify current revision
        run: make db-current
      - name: Recent downgrade then re-upgrade
        run: bash scripts/db-local downgrade-smoke
      - name: Live persistence acceptance tests
        run: bash scripts/db-local integration-test
      - name: Capture database diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/database
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml ps > reports/database/compose-ps.txt 2>&1 || true
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml logs --no-color --tail=300 postgres > reports/database/postgres.log 2>&1 || true
      - name: Upload database diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: database-schema-${{ github.run_id }}
          path: reports/database
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true
