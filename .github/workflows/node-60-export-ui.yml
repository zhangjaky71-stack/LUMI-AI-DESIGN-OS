name: NODE-60 Export UI

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/api/v1/export_product_*.py"
      - "apps/api/src/lumi_api/api/v1/app.py"
      - "apps/api/tests/test_node60_export_product_contracts.py"
      - "apps/web/src/lib/exports/**"
      - "apps/web/src/components/exports/**"
      - "apps/web/src/components/workspace/ai-workspace.tsx"
      - "apps/web/src/app/(shell)/workspace/export.css"
      - "apps/web/src/app/(shell)/workspace/layout.tsx"
      - "services/export-engine/**"
      - "tools/node60/**"
      - "docs/runtime/EXPORT-PRODUCT-UI-V1.md"
      - "docs/nodes/NODE-60-EXPORT-UI.md"
      - "reports/nodes/NODE-60/**"
      - ".github/workflows/node-60-export-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.4.0"
  NEXT_TELEMETRY_DISABLED: "1"
  LUMI_API_ORIGIN: "http://127.0.0.1:8000"

jobs:
  export-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Compile NODE-60 contracts
        run: |
          uv run python -m compileall -q \
            apps/api/src/lumi_api/api/v1/export_product_dependencies.py \
            apps/api/src/lumi_api/api/v1/export_product_schemas.py \
            apps/api/src/lumi_api/api/v1/export_product_routes.py \
            apps/api/tests/test_node60_export_product_contracts.py \
            tools/node60
      - name: Static Export UI acceptance
        run: uv run python tools/node60/validate_export_ui.py
      - name: NODE-60 product and NODE-49 engine tests
        run: |
          uv run pytest -q \
            apps/api/tests/test_node60_export_product_contracts.py \
            services/export-engine/tests/test_export_codec.py \
            services/export-engine/tests/test_export_engine.py \
            services/export-engine/tests/test_export_renderer.py \
            services/export-engine/tests/test_export_snapshot_adapter.py
      - name: Ruff NODE-60 backend
        run: |
          uv run ruff check --ignore E501,I001 \
            apps/api/src/lumi_api/api/v1/export_product_dependencies.py \
            apps/api/src/lumi_api/api/v1/export_product_schemas.py \
            apps/api/src/lumi_api/api/v1/export_product_routes.py \
            apps/api/tests/test_node60_export_product_contracts.py \
            tools/node60
      - name: Parse NODE-60 gap ledger
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path("reports/nodes/NODE-60/gap-ledger.json").read_text(encoding="utf-8"))
          assert ledger["node"] == "NODE-60"
          assert ledger["status"] == "CORE_IMPLEMENTED_VALIDATING_NOT_COMPLETE"
          assert any(gap["severity"] == "P0" and gap["status"] == "open" for gap in ledger["gaps"])
          print("NODE60_GAP_LEDGER_PARSE_PASS")
          PY

  export-web:
    needs: export-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version
      - name: Install frozen JS workspace
        run: pnpm install --frozen-lockfile
      - name: Export UI web contract tests
        run: pnpm --filter @lumi/web exec vitest run src/lib/exports/types.test.ts
      - name: Typecheck web application
        run: pnpm --filter @lumi/web typecheck
      - name: Lint NODE-60 web surface
        run: |
          pnpm --filter @lumi/web exec eslint \
            src/lib/exports \
            src/components/exports \
            src/components/workspace/ai-workspace.tsx \
            'src/app/(shell)/workspace/layout.tsx'
      - name: Production Next.js build
        run: pnpm --filter @lumi/web build
