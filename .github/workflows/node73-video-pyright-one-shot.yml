name: NODE-73 Video Pyright Closure

on:
  push:
    branches:
      - release-closure-p0
    paths:
      - .github/workflows/node73-video-pyright-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-video-pyright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 1

      - name: Apply strict typing boundary fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          path = root / 'services/video-generation/src/lumi_video_generation/model.py'
          text = path.read_text()
          old = 'from typing import Any, Literal\n'
          new = 'from typing import Any, Literal, cast\n'
          assert text.count(old) == 1, 'model typing import drifted'
          text = text.replace(old, new, 1)
          old = '''    if isinstance(value, Mapping):\n        return {str(key): _jsonable(item) for key, item in sorted(value.items(), key=lambda pair: str(pair[0]))}\n    if isinstance(value, (tuple, list)):\n        return [_jsonable(item) for item in value]\n'''
          new = '''    if isinstance(value, Mapping):\n        mapping = cast(Mapping[object, object], value)\n        normalized = ((str(key), _jsonable(item)) for key, item in mapping.items())\n        return dict(sorted(normalized, key=lambda pair: pair[0]))\n    if isinstance(value, (tuple, list)):\n        sequence = cast(tuple[object, ...] | list[object], value)\n        return [_jsonable(item) for item in sequence]\n'''
          assert text.count(old) == 1, 'model jsonable boundary drifted'
          path.write_text(text.replace(old, new, 1))

          path = root / 'services/video-generation/src/lumi_video_generation/spec_codec.py'
          text = path.read_text()
          old = '''def _object(value: object, error: str) -> dict[str, Any]:\n    if not isinstance(value, dict) or not all(isinstance(key, str) for key in value):\n        raise ValueError(error)\n    return value\n'''
          new = '''def _object(value: object, error: str) -> dict[str, Any]:\n    if not isinstance(value, dict):\n        raise ValueError(error)\n    raw = cast(dict[object, object], value)\n    payload: dict[str, Any] = {}\n    for key, item in raw.items():\n        if not isinstance(key, str):\n            raise ValueError(error)\n        payload[key] = item\n    return payload\n'''
          assert text.count(old) == 1, 'spec _object boundary drifted'
          text = text.replace(old, new, 1)
          old = '''def _list(value: object, error: str) -> list[object]:\n    if not isinstance(value, list):\n        raise ValueError(error)\n    return value\n'''
          new = '''def _list(value: object, error: str) -> list[object]:\n    if not isinstance(value, list):\n        raise ValueError(error)\n    return cast(list[object], value)\n'''
          assert text.count(old) == 1, 'spec _list boundary drifted'
          text = text.replace(old, new, 1)
          old = '''def _json_object(value: object, *, label: str, depth: int = 0) -> dict[str, Any]:\n    if not isinstance(value, dict) or not all(isinstance(key, str) for key in value):\n        raise ValueError(f"{label}_OBJECT_REQUIRED")\n    if depth > 12:\n        raise ValueError(f"{label}_TOO_DEEP")\n    return {key: _json_value(item, label=label, depth=depth + 1) for key, item in value.items()}\n'''
          new = '''def _json_object(value: object, *, label: str, depth: int = 0) -> dict[str, Any]:\n    if not isinstance(value, dict):\n        raise ValueError(f"{label}_OBJECT_REQUIRED")\n    raw = cast(dict[object, object], value)\n    if depth > 12:\n        raise ValueError(f"{label}_TOO_DEEP")\n    payload: dict[str, Any] = {}\n    for key, item in raw.items():\n        if not isinstance(key, str):\n            raise ValueError(f"{label}_OBJECT_REQUIRED")\n        payload[key] = _json_value(item, label=label, depth=depth + 1)\n    return payload\n'''
          assert text.count(old) == 1, 'spec _json_object boundary drifted'
          text = text.replace(old, new, 1)
          old = '''    if isinstance(value, list):\n        return [_json_value(item, label=label, depth=depth + 1) for item in value]\n    if isinstance(value, tuple):\n        return [_json_value(item, label=label, depth=depth + 1) for item in value]\n    if isinstance(value, dict):\n        return _json_object(value, label=label, depth=depth + 1)\n'''
          new = '''    if isinstance(value, list):\n        items = cast(list[object], value)\n        return [_json_value(item, label=label, depth=depth + 1) for item in items]\n    if isinstance(value, tuple):\n        items = cast(tuple[object, ...], value)\n        return [_json_value(item, label=label, depth=depth + 1) for item in items]\n    if isinstance(value, dict):\n        return _json_object(cast(dict[object, object], value), label=label, depth=depth + 1)\n'''
          assert text.count(old) == 1, 'spec _json_value container boundary drifted'
          path.write_text(text.replace(old, new, 1))

          path = root / 'services/video-generation/pyrightconfig.json'
          text = path.read_text()
          old = '    "../model-gateway/src",\n    "../artifact-history/src"\n'
          new = '    "../model-gateway/src",\n    "../artifact-history/src",\n    "../domain/src"\n'
          assert text.count(old) == 1, 'pyright extraPaths drifted'
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Enforce exact diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat <<'EOF'
          services/video-generation/pyrightconfig.json
          services/video-generation/src/lumi_video_generation/model.py
          services/video-generation/src/lumi_video_generation/spec_codec.py
          EOF
          )"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
          python3 -m py_compile \
            services/video-generation/src/lumi_video_generation/model.py \
            services/video-generation/src/lumi_video_generation/spec_codec.py
          python3 -m json.tool services/video-generation/pyrightconfig.json >/dev/null

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Frozen Python workspace install
        run: uv sync --all-packages --frozen

      - name: Require scoped Ruff PASS
        shell: bash
        run: >-
          uv run ruff check --ignore E501
          services/video-generation/src
          services/video-generation/tests

      - name: Require Video service strict Pyright PASS
        run: uv run pyright -p services/video-generation/pyrightconfig.json

      - name: Require NODE-48 domain tests PASS
        env:
          PYTHONPATH: services/video-generation/src:services/model-gateway/src:services/artifact-history/src:services/identity-engine/src:services/brand-rules/src
        run: uv run pytest services/video-generation/tests -q

      - name: Commit only verified changes on unchanged branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-closure-p0 --depth=1
          test "$(git rev-parse origin/release-closure-p0)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/video-generation/pyrightconfig.json \
            services/video-generation/src/lumi_video_generation/model.py \
            services/video-generation/src/lumi_video_generation/spec_codec.py
          git commit -m "fix(video): close strict pyright boundaries"
          git push origin HEAD:release-closure-p0
