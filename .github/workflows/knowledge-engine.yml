name: Knowledge Engine

on:
  pull_request:
    paths:
      - "apps/agent-runtime/src/lumi_agent_runtime/knowledge_engine/**"
      - "apps/agent-runtime/src/lumi_agent_runtime/context_engine/contracts.py"
      - "apps/agent-runtime/tests/test_knowledge_*.py"
      - "apps/api/alembic/versions/0017_knowledge_engine.py"
      - "apps/api/src/lumi_api/persistence/models/knowledge.py"
      - "apps/api/src/lumi_api/persistence/models/__init__.py"
      - "scripts/integration_knowledge_engine.py"
      - "scripts/validate_knowledge_engine_contract.py"
      - "docs/runtime/KNOWLEDGE-ENGINE-V1.md"
      - "reports/nodes/NODE-36/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile NODE-36 runtime and acceptance
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src:scripts
          python -m compileall -q
          apps/agent-runtime/src/lumi_agent_runtime/knowledge_engine
          apps/agent-runtime/src/lumi_agent_runtime/context_engine/contracts.py
          apps/agent-runtime/tests/test_knowledge_engine.py
          apps/agent-runtime/tests/test_knowledge_boundaries.py
          apps/agent-runtime/tests/test_knowledge_scope_identity.py
          apps/agent-runtime/tests/test_knowledge_postgres_contract.py
          scripts/integration_knowledge_engine.py
          scripts/validate_knowledge_engine_contract.py
          apps/api/alembic/versions/0017_knowledge_engine.py
          apps/api/src/lumi_api/persistence/models/knowledge.py
      - name: Revalidate NODE-34 Context boundary
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python scripts/validate_context_engine_contract.py
      - name: Revalidate NODE-35 Memory boundary
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python scripts/validate_memory_engine_contract.py
      - name: Validate NODE-36 Knowledge contract
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python scripts/validate_knowledge_engine_contract.py
      - name: NODE-36 dependency-light unit tests
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python -m unittest discover
          -s apps/agent-runtime/tests
          -p 'test_knowledge_*.py'

  knowledge-quality:
    needs: knowledge-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: NODE-36 pytest
        run: >-
          uv run pytest
          apps/agent-runtime/tests/test_knowledge_engine.py
          apps/agent-runtime/tests/test_knowledge_boundaries.py
          apps/agent-runtime/tests/test_knowledge_scope_identity.py
          apps/agent-runtime/tests/test_knowledge_postgres_contract.py
          -q
      - name: NODE-36 Ruff gate
        run: >-
          uv run ruff check
          apps/agent-runtime/src/lumi_agent_runtime/knowledge_engine
          apps/agent-runtime/tests/test_knowledge_engine.py
          apps/agent-runtime/tests/test_knowledge_boundaries.py
          apps/agent-runtime/tests/test_knowledge_scope_identity.py
          apps/agent-runtime/tests/test_knowledge_postgres_contract.py
          scripts/integration_knowledge_engine.py
          scripts/validate_knowledge_engine_contract.py
          apps/api/alembic/versions/0017_knowledge_engine.py
          apps/api/src/lumi_api/persistence/models/knowledge.py
      - name: NODE-36 Pyright gate
        run: >-
          uv run pyright
          apps/agent-runtime/src/lumi_agent_runtime/knowledge_engine
          apps/agent-runtime/tests/test_knowledge_engine.py
          apps/agent-runtime/tests/test_knowledge_boundaries.py
          apps/agent-runtime/tests/test_knowledge_scope_identity.py
          apps/agent-runtime/tests/test_knowledge_postgres_contract.py

  knowledge-postgres:
    needs: knowledge-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Start local infrastructure
        run: |
          make infra-env
          make infra-up
      - name: Upgrade database to NODE-36 head
        run: make db-upgrade
      - name: Verify Alembic ORM metadata has no drift
        run: bash scripts/db-local schema-check
      - name: Verify NODE-36 ORM tables and FTS column
        run: >-
          uv run --package lumi-api python -c
          "from lumi_api.persistence.base import Base; import lumi_api.persistence.models;
          assert 'knowledge_documents' in Base.metadata.tables;
          assert 'knowledge_chunks' in Base.metadata.tables;
          assert 'scope_key' in Base.metadata.tables['knowledge_documents'].c;
          assert 'search_tsv' in Base.metadata.tables['knowledge_chunks'].c;
          assert 'embedding_space_id' in Base.metadata.tables['knowledge_chunks'].c"
      - name: Seed deterministic project fixtures
        run: make db-seed
      - name: NODE-36 durable ingestion and hybrid retrieval integration
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src:scripts
          uv run python scripts/integration_knowledge_engine.py
      - name: Migration downgrade upgrade smoke
        run: bash scripts/db-local downgrade-smoke
      - name: Reset infrastructure
        if: always()
        run: CONFIRM=1 make infra-reset || true

  release-closure-ruff-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Apply targeted Ruff fixes in runner only
        run: |
          uv run ruff check --fix --select I001 \
            apps/api/src/lumi_api/persistence/models/knowledge.py \
            apps/api/src/lumi_api/api/v1/services.py \
            apps/api/src/lumi_api/costs/gateway.py \
            scripts/integration_platform_provider_cost_guard.py || true
          uv run ruff check --fix --unsafe-fixes --select UP046,F401 \
            apps/api/src/lumi_api/api/v1/contracts.py || true
          uv run ruff check --fix --select UP012 \
            services/tool-gateway/src/lumi_tool_gateway/http_transport.py \
            services/tool-gateway/src/lumi_tool_gateway/sandbox_transport.py || true
          uv run ruff check --fix --select SIM102 \
            services/tool-gateway/src/lumi_tool_gateway/contracts.py || true
      - name: Print canonical Ruff diff
        run: |
          echo '=== RELEASE_CLOSURE_RUFF_DIFF_BEGIN ==='
          git diff -- \
            apps/api/src/lumi_api/persistence/models/knowledge.py \
            apps/api/src/lumi_api/api/v1/services.py \
            apps/api/src/lumi_api/costs/gateway.py \
            scripts/integration_platform_provider_cost_guard.py \
            apps/api/src/lumi_api/api/v1/contracts.py \
            services/tool-gateway/src/lumi_tool_gateway/http_transport.py \
            services/tool-gateway/src/lumi_tool_gateway/sandbox_transport.py \
            services/tool-gateway/src/lumi_tool_gateway/contracts.py
          echo '=== RELEASE_CLOSURE_RUFF_DIFF_END ==='

  release-closure-apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release-closure-p0'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 8
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Apply deterministic release-closure fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          knowledge = Path("apps/api/src/lumi_api/persistence/models/knowledge.py")
          text = knowledge.read_text(encoding="utf-8")
          text = text.replace("\n# release-closure read-only Ruff diagnostic trigger\n", "\n")
          knowledge.write_text(text, encoding="utf-8")

          replace_exact(
              "scripts/validate_tool_approval_provenance.py",
              '                f"{path.relative_to(ROOT)} must inject approval secret only into API and Tool Gateway"\n',
              '                f"{path.relative_to(ROOT)} must inject approval secret only into "\n'
              '                "API and Tool Gateway"\n',
          )
          replace_exact(
              "services/tool-gateway/src/lumi_tool_gateway/contracts.py",
              '        if self.idempotency_key is not None:\n'
              '            if not self.idempotency_key or len(self.idempotency_key) > 512:\n'
              '                raise ValueError("TOOL_IDEMPOTENCY_KEY_INVALID")\n',
              '        if self.idempotency_key is not None and (\n'
              '            not self.idempotency_key or len(self.idempotency_key) > 512\n'
              '        ):\n'
              '            raise ValueError("TOOL_IDEMPOTENCY_KEY_INVALID")\n',
          )
          replace_exact(
              "services/tool-gateway/src/lumi_tool_gateway/native.py",
              '            content_type = _header(response.headers, "content-type").split(";", 1)[0].strip().lower()\n',
              '            content_type = (\n'
              '                _header(response.headers, "content-type")\n'
              '                .split(";", 1)[0]\n'
              '                .strip()\n'
              '                .lower()\n'
              '            )\n',
          )
          replace_exact(
              "services/tool-gateway/tests/test_mcp_modern.py",
              'from lumi_tool_gateway.gateway import ToolGateway\n',
              'from lumi_tool_gateway.errors import ToolSSRFBlockedError\n'
              'from lumi_tool_gateway.gateway import ToolGateway\n',
          )
          replace_exact(
              "services/tool-gateway/tests/test_mcp_modern.py",
              '        with self.assertRaises(Exception):\n            MCPServerRegistry(\n',
              '        with self.assertRaises(ToolSSRFBlockedError):\n            MCPServerRegistry(\n',
          )

          replace_exact(
              "apps/api/alembic/versions/0011_cost_ledger_budget_quota.py",
              '        "(organization_id, scope_type, COALESCE(scope_id, \'00000000-0000-0000-0000-000000000000\'::uuid), period_key, currency)"\n',
              '        "(organization_id, scope_type, COALESCE(scope_id, "\n'
              '        "\'00000000-0000-0000-0000-000000000000\'::uuid), period_key, currency)"\n',
          )
          replace_exact(
              "apps/api/alembic/versions/0011_cost_ledger_budget_quota.py",
              "            CONSTRAINT ck_cost_reservations_actual CHECK (actual_amount IS NULL OR actual_amount >= 0),\n",
              "            CONSTRAINT ck_cost_reservations_actual CHECK (\n"
              "                actual_amount IS NULL OR actual_amount >= 0\n"
              "            ),\n",
          )
          replace_exact(
              "apps/api/alembic/versions/0011_cost_ledger_budget_quota.py",
              '        "(organization_id, scope_type, COALESCE(scope_id, \'00000000-0000-0000-0000-000000000000\'::uuid), metric, period_key)"\n',
              '        "(organization_id, scope_type, COALESCE(scope_id, "\n'
              '        "\'00000000-0000-0000-0000-000000000000\'::uuid), metric, period_key)"\n',
          )
          replace_exact(
              "scripts/integration_cost_ledger.py",
              '            "SELECT id FROM tasks WHERE organization_id=$1 AND project_id=$2 ORDER BY created_at LIMIT 1",\n',
              '            "SELECT id FROM tasks WHERE organization_id=$1 AND project_id=$2 "\n'
              '            "ORDER BY created_at LIMIT 1",\n',
          )
          replace_exact(
              "scripts/integration_platform_provider_cost_guard.py",
              '                f"of pre-existing guarded usage; observed baseline={baseline_spent + baseline_active}"\n',
              '                "of pre-existing guarded usage; observed "\n'
              '                f"baseline={baseline_spent + baseline_active}"\n',
          )

          old_benchmark = '''      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run planning/mask benchmark
        env:
          PYTHONPATH: services/image-edit/src
        run: python scripts/benchmark_image_edit.py
'''
          new_benchmark = '''      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - name: Run planning/mask benchmark
        env:
          PYTHONPATH: services/image-edit/src:services/image-generation/src:services/model-gateway/src:services/artifact-history/src:services/identity-engine/src:services/brand-rules/src
        run: uv run python scripts/benchmark_image_edit.py
'''
          replace_exact(".github/workflows/image-edit.yml", old_benchmark, new_benchmark)
          PY
      - name: Apply Ruff canonical fixes
        run: |
          uv run ruff check --fix --select I001 \
            apps/api/src/lumi_api/persistence/models/knowledge.py \
            apps/api/src/lumi_api/api/v1/services.py \
            apps/api/src/lumi_api/costs/gateway.py \
            scripts/integration_platform_provider_cost_guard.py
          uv run ruff check --fix --unsafe-fixes --select UP046,F401 \
            apps/api/src/lumi_api/api/v1/contracts.py
          uv run ruff check --fix --select UP012 \
            services/tool-gateway/src/lumi_tool_gateway/http_transport.py \
            services/tool-gateway/src/lumi_tool_gateway/sandbox_transport.py
          uv run ruff check --fix --select I001 \
            services/tool-gateway/tests/test_mcp_modern.py
      - name: Verify targeted Ruff gates
        run: |
          uv run ruff check \
            apps/api/src/lumi_api/persistence/models/knowledge.py \
            apps/api/src/lumi_api/api/v1/contracts.py \
            apps/api/src/lumi_api/api/v1/services.py \
            apps/api/src/lumi_api/costs/gateway.py \
            apps/api/alembic/versions/0011_cost_ledger_budget_quota.py \
            scripts/integration_cost_ledger.py \
            scripts/integration_platform_provider_cost_guard.py \
            scripts/validate_tool_approval_provenance.py \
            services/tool-gateway/src/lumi_tool_gateway/contracts.py \
            services/tool-gateway/src/lumi_tool_gateway/http_transport.py \
            services/tool-gateway/src/lumi_tool_gateway/native.py \
            services/tool-gateway/src/lumi_tool_gateway/sandbox_transport.py \
            services/tool-gateway/tests/test_mcp_modern.py
      - name: Knowledge regression
        run: >-
          uv run pytest
          apps/agent-runtime/tests/test_knowledge_engine.py
          apps/agent-runtime/tests/test_knowledge_boundaries.py
          apps/agent-runtime/tests/test_knowledge_scope_identity.py
          apps/agent-runtime/tests/test_knowledge_postgres_contract.py
          -q
      - name: Tool Gateway targeted regression
        run: uv run pytest services/tool-gateway/tests/test_tool_gateway.py services/tool-gateway/tests/test_mcp_modern.py -q
      - name: Cost regression
        run: uv run pytest apps/api/tests/test_cost_contracts.py apps/api/tests/test_cost_api_contract.py services/model-gateway/tests/test_cost_accounting.py -q
      - name: API contract regression
        run: uv run pytest apps/api/tests/test_api_v1_contract.py -q
      - name: Image Edit planning benchmark
        env:
          PYTHONPATH: services/image-edit/src:services/image-generation/src:services/model-gateway/src:services/artifact-history/src:services/identity-engine/src:services/brand-rules/src
        run: uv run python scripts/benchmark_image_edit.py
      - name: Restore permanent read-only workflow and verify diff
        run: |
          git show cf755ca1074ef3bd2ee4d8343715b5448aff7f64:.github/workflows/knowledge-engine.yml > .github/workflows/knowledge-engine.yml
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/image-edit.yml",
              ".github/workflows/knowledge-engine.yml",
              "apps/api/alembic/versions/0011_cost_ledger_budget_quota.py",
              "apps/api/src/lumi_api/api/v1/contracts.py",
              "apps/api/src/lumi_api/api/v1/services.py",
              "apps/api/src/lumi_api/costs/gateway.py",
              "apps/api/src/lumi_api/persistence/models/knowledge.py",
              "scripts/integration_cost_ledger.py",
              "scripts/integration_platform_provider_cost_guard.py",
              "scripts/validate_tool_approval_provenance.py",
              "services/tool-gateway/src/lumi_tool_gateway/contracts.py",
              "services/tool-gateway/src/lumi_tool_gateway/http_transport.py",
              "services/tool-gateway/src/lumi_tool_gateway/native.py",
              "services/tool-gateway/src/lumi_tool_gateway/sandbox_transport.py",
              "services/tool-gateway/tests/test_mcp_modern.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected release-closure changes: {sorted(unexpected)}")
          if ".github/workflows/knowledge-engine.yml" not in changed:
              raise SystemExit("permanent Knowledge workflow restore was not staged relative to diagnostic head")
          print("release-closure allowed changed paths:", *sorted(changed), sep="\n- ")
          PY
      - name: Commit and push deterministic fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): close deterministic quality and benchmark gates"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
