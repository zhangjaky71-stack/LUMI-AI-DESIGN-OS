name: NODE-24 Provider Health

on:
  pull_request:
    paths:
      - "services/model-gateway/src/lumi_model_gateway/provider_health*.py"
      - "services/model-gateway/src/lumi_model_gateway/synthetic_probe.py"
      - "services/model-gateway/src/lumi_model_gateway/gateway.py"
      - "services/model-gateway/src/lumi_model_gateway/routing.py"
      - "services/model-gateway/src/lumi_model_gateway/ports.py"
      - "services/model-gateway/src/lumi_model_gateway/memory.py"
      - "services/model-gateway/src/lumi_model_gateway/errors.py"
      - "services/model-gateway/src/lumi_model_gateway/__init__.py"
      - "services/model-gateway/tests/test_provider_health*.py"
      - "services/model-gateway/tests/test_synthetic_probe.py"
      - "apps/api/src/lumi_api/persistence/models.py"
      - "apps/api/src/lumi_api/persistence/models_provider_health.py"
      - "apps/api/migrations/versions/20260816_0008_provider_health.py"
      - "apps/api/migrations/versions/20260816_0008_sql/**"
      - "tools/node24/**"
      - "docs/runtime/PROVIDER-HEALTH-*.md"
      - "reports/nodes/NODE-24/**"
      - ".github/workflows/node-24-provider-health.yml"
  push:
    branches: [main]
    paths:
      - "services/model-gateway/src/lumi_model_gateway/provider_health*.py"
      - "services/model-gateway/src/lumi_model_gateway/synthetic_probe.py"
      - "services/model-gateway/src/lumi_model_gateway/gateway.py"
      - "services/model-gateway/src/lumi_model_gateway/routing.py"
      - "apps/api/src/lumi_api/persistence/models_provider_health.py"
      - "apps/api/migrations/versions/20260816_0008_provider_health.py"
      - "apps/api/migrations/versions/20260816_0008_sql/**"
      - "tools/node24/**"
      - "docs/runtime/PROVIDER-HEALTH-*.md"
      - "reports/nodes/NODE-24/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"
  SQLALCHEMY_VERSION: "2.0.51"
  ALEMBIC_VERSION: "1.18.5"
  ASYNCPG_VERSION: "0.31.0"
  REDIS_PY_VERSION: "5.2.1"
  LUMI_DATABASE_MIGRATION_URL: >-
    postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
  LUMI_DATABASE_MIGRATION_URL_ASYNCPG: >-
    postgresql://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
  LUMI_REDIS_URL: >-
    redis://:lumi_redis_local_only@127.0.0.1:6379/0

jobs:
  provider-health:
    name: provider-health
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Validate Provider Health architecture
        run: |
          PYTHONPATH=services/model-gateway/src:apps/api/src \
            uv run python tools/node24/validate_provider_health.py

      - name: Run Provider Health and Model Gateway regression tests
        run: |
          PYTHONPATH=services/model-gateway/src:apps/api/src \
            uv run pytest -q services/model-gateway/tests

      - name: Export and validate Provider Health schemas
        run: |
          rm -rf reports/nodes/NODE-24/generated-schemas
          uv run python tools/node24/export_health_schemas.py
          count="$(find reports/nodes/NODE-24/generated-schemas \
            -name '*.schema.json' | wc -l)"
          test "$count" -eq 5
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("reports/nodes/NODE-24")
          schemas = sorted((root / "generated-schemas").glob("*.schema.json"))
          assert len(schemas) == 5
          for path in schemas:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload["$schema"].endswith("2020-12/schema")
          ledger = json.loads((root / "gap-ledger.json").read_text(encoding="utf-8"))
          assert len(ledger["gaps"]) == 7
          print("NODE-24 schemas and gap ledger valid")
          PY

      - name: Ruff NODE-24 affected scope
        run: |
          uv run ruff check \
            services/model-gateway/src/lumi_model_gateway/provider_health.py \
            services/model-gateway/src/lumi_model_gateway/provider_health_store.py \
            services/model-gateway/src/lumi_model_gateway/provider_health_postgres.py \
            services/model-gateway/src/lumi_model_gateway/synthetic_probe.py \
            services/model-gateway/src/lumi_model_gateway/gateway.py \
            services/model-gateway/src/lumi_model_gateway/routing.py \
            services/model-gateway/src/lumi_model_gateway/ports.py \
            services/model-gateway/src/lumi_model_gateway/memory.py \
            services/model-gateway/src/lumi_model_gateway/errors.py \
            services/model-gateway/src/lumi_model_gateway/__init__.py \
            services/model-gateway/tests/test_provider_health.py \
            services/model-gateway/tests/test_provider_health_gateway.py \
            services/model-gateway/tests/test_synthetic_probe.py \
            apps/api/src/lumi_api/persistence/models.py \
            apps/api/src/lumi_api/persistence/models_provider_health.py \
            tools/node24

      - name: Pyright NODE-24 affected scope
        run: |
          uv run pyright \
            services/model-gateway/src/lumi_model_gateway/provider_health.py \
            services/model-gateway/src/lumi_model_gateway/provider_health_store.py \
            services/model-gateway/src/lumi_model_gateway/provider_health_postgres.py \
            services/model-gateway/src/lumi_model_gateway/synthetic_probe.py \
            services/model-gateway/src/lumi_model_gateway/gateway.py \
            services/model-gateway/src/lumi_model_gateway/routing.py \
            services/model-gateway/src/lumi_model_gateway/ports.py \
            services/model-gateway/src/lumi_model_gateway/memory.py \
            services/model-gateway/src/lumi_model_gateway/errors.py \
            services/model-gateway/src/lumi_model_gateway/__init__.py \
            services/model-gateway/tests/test_provider_health.py \
            services/model-gateway/tests/test_provider_health_gateway.py \
            services/model-gateway/tests/test_synthetic_probe.py \
            apps/api/src/lumi_api/persistence/models.py \
            apps/api/src/lumi_api/persistence/models_provider_health.py \
            tools/node24

      - name: Start PostgreSQL and Redis
        run: |
          cp infra/compose/env.local.example infra/compose/.env
          docker compose --env-file infra/compose/.env \
            -f infra/compose/docker-compose.yml \
            up -d --wait --wait-timeout 180 postgres redis

      - name: Upgrade through NODE-23 baseline
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade 20260816_0007

      - name: Upgrade PostgreSQL to NODE-24 head
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade head

      - name: Validate current ORM metadata
        run: |
          PYTHONPATH=apps/api/src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            python tools/node10/validate_schema.py

      - name: Run real Redis shared-state invariants
        run: |
          PYTHONPATH=services/model-gateway/src \
            uv run --no-project \
            --with "redis==${REDIS_PY_VERSION}" \
            python tools/node24/test_provider_health_redis.py \
            --url "${LUMI_REDIS_URL}"

      - name: Run PostgreSQL health persistence invariants
        run: |
          PYTHONPATH=services/model-gateway/src:apps/api/src \
            uv run --no-project \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            python tools/node24/test_provider_health_database.py \
            --dsn "${LUMI_DATABASE_MIGRATION_URL_ASYNCPG}"

      - name: Downgrade NODE-24 migration only
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic downgrade 20260816_0007

      - name: Verify rollback preserves NODE-23 baseline
        run: |
          registry_kept="$(docker compose --env-file infra/compose/.env \
            -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c \
            "SELECT to_regclass('public.model_registry_versions') IS NOT NULL")"
          summaries_gone="$(docker compose --env-file infra/compose/.env \
            -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c \
            "SELECT to_regclass('public.provider_health_summaries') IS NULL")"
          audit_gone="$(docker compose --env-file infra/compose/.env \
            -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c \
            "SELECT to_regclass('public.provider_health_override_audit') IS NULL")"
          test "$registry_kept" = "t"
          test "$summaries_gone" = "t"
          test "$audit_gone" = "t"

      - name: Reapply NODE-24 and rerun persistence invariants
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade head
          cd ../..
          PYTHONPATH=services/model-gateway/src:apps/api/src \
            uv run --no-project \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            python tools/node24/test_provider_health_database.py \
            --dsn "${LUMI_DATABASE_MIGRATION_URL_ASYNCPG}"

      - name: Capture infrastructure diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file infra/compose/.env \
            -f infra/compose/docker-compose.yml ps || true
          docker compose --env-file infra/compose/.env \
            -f infra/compose/docker-compose.yml logs --no-color postgres redis || true

      - name: Upload NODE-24 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-24-provider-health-${{ github.run_id }}
          path: |
            reports/nodes/NODE-24/generated-schemas
            reports/nodes/NODE-24/gap-ledger.json
            reports/nodes/NODE-24/acceptance.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file infra/compose/.env \
            -f infra/compose/docker-compose.yml down -v --remove-orphans || true
