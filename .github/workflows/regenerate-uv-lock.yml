name: Regenerate Canonical UV Lock

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact release-closure-p0 SHA to regenerate from"
        required: true
        type: string
      confirm:
        description: "Type REGENERATE_NODE73_UV_LOCK"
        required: true
        type: string

permissions:
  contents: read

jobs:
  registry-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Default-branch registry only
        run: |
          echo "This default-branch file only registers workflow_dispatch."
          echo "Dispatch this workflow with ref=release-closure-p0 so GitHub executes the hardened workflow from that exact ref."
          exit 1
