name: Skill Registry

on:
  pull_request:
    paths:
      - "skills/**"
      - "schemas/skill-io/**"
      - "evals/profiles/skills/**"
      - "apps/agent-runtime/src/lumi_agent_runtime/skill_registry/**"
      - "apps/agent-runtime/src/lumi_agent_runtime/agent_registry/validator.py"
      - "apps/agent-runtime/tests/test_skill*.py"
      - "scripts/validate_skill_registry_contract.py"
      - "scripts/integration_skill_registry_*.py"
      - "docs/runtime/SKILL-REGISTRY-V1.md"
      - "reports/nodes/NODE-31/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-registry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile NODE-31 runtime and acceptance
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python -m compileall -q
          apps/agent-runtime/src/lumi_agent_runtime/skill_registry
          apps/agent-runtime/tests/test_skill_registry.py
          apps/agent-runtime/tests/test_skill_deep_bundle.py
          apps/agent-runtime/tests/test_skill_release.py
          scripts/validate_skill_registry_contract.py
          scripts/integration_skill_registry_agent.py
          scripts/integration_skill_registry_deep_agents.py
          scripts/integration_skill_registry_pack.py
      - name: Revalidate NODE-25 Tool Gateway
        run: >-
          PYTHONPATH=services/tool-gateway/src
          python scripts/validate_tool_gateway_contract.py
      - name: Revalidate NODE-29 Deep Agents Runtime
        run: >-
          PYTHONPATH=apps/agent-runtime/src
          python scripts/validate_deep_agents_runtime_contract_v2.py
      - name: Revalidate NODE-30 Agent Registry
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python scripts/validate_agent_registry_contract.py
      - name: NODE-31 static Skill Registry contract
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python scripts/validate_skill_registry_contract.py
      - name: NODE-31 deterministic unit tests
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python -m unittest discover
          -s apps/agent-runtime/tests
          -p 'test_skill*.py'

  skill-registry-quality:
    needs: skill-registry-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: NODE-31 pytest
        run: >-
          uv run pytest
          apps/agent-runtime/tests/test_skill_registry.py
          apps/agent-runtime/tests/test_skill_deep_bundle.py
          apps/agent-runtime/tests/test_skill_release.py
          -q
      - name: NODE-30 Agent Registry -> NODE-31 integration
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          uv run python scripts/integration_skill_registry_agent.py
      - name: Current Deep Agents Skill integration
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          uv run python scripts/integration_skill_registry_deep_agents.py
      - name: NODE-31 Ruff gate
        run: >-
          uv run ruff check
          apps/agent-runtime/src/lumi_agent_runtime/skill_registry
          apps/agent-runtime/src/lumi_agent_runtime/agent_registry/validator.py
          apps/agent-runtime/tests/test_skill_registry.py
          apps/agent-runtime/tests/test_skill_deep_bundle.py
          apps/agent-runtime/tests/test_skill_release.py
          scripts/validate_skill_registry_contract.py
          scripts/integration_skill_registry_agent.py
          scripts/integration_skill_registry_deep_agents.py
          scripts/integration_skill_registry_pack.py
      - name: NODE-31 Pyright gate
        run: >-
          uv run pyright
          apps/agent-runtime/src/lumi_agent_runtime/skill_registry
          apps/agent-runtime/src/lumi_agent_runtime/agent_registry/validator.py
          apps/agent-runtime/tests/test_skill_registry.py
          apps/agent-runtime/tests/test_skill_deep_bundle.py
          apps/agent-runtime/tests/test_skill_release.py

  skill-registry-pack:
    needs: skill-registry-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Resolve every production Skill pack twice
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          uv run python scripts/integration_skill_registry_pack.py
