name: Tool Gateway Web Search

on:
  pull_request:
    paths:
      - "services/tool-gateway/Dockerfile"
      - "services/tool-gateway/pyproject.toml"
      - "services/tool-gateway/src/lumi_tool_gateway/catalog.py"
      - "services/tool-gateway/src/lumi_tool_gateway/errors.py"
      - "services/tool-gateway/src/lumi_tool_gateway/native.py"
      - "services/tool-gateway/src/lumi_tool_gateway/search_backend.py"
      - "services/tool-gateway/src/lumi_tool_gateway/service.py"
      - "services/tool-gateway/tests/test_search_backend.py"
      - "services/tool-gateway/tests/test_hosted_adapter_coverage.py"
      - "infra/iac/environments/staging/core/main.tf"
      - "infra/iac/environments/staging/app/main.tf"
      - "infra/iac/environments/production/core/main.tf"
      - "infra/iac/environments/production/app/main.tf"
      - "infra/iac/modules/network/main.tf"
      - "infra/iac/modules/compute/main.tf"
      - "scripts/validate_web_search_provenance.py"
      - "staging/acceptance/evidence-template.json"
      - ".github/workflows/tool-web-search.yml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-search-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile hosted search contracts
        run: |
          python -m compileall -q \
            services/tool-gateway/src/lumi_tool_gateway/search_backend.py \
            services/tool-gateway/src/lumi_tool_gateway/service.py \
            services/tool-gateway/tests/test_search_backend.py \
            services/tool-gateway/tests/test_hosted_adapter_coverage.py \
            scripts/validate_web_search_provenance.py
      - name: Require hosted search source and deployment provenance
        run: python scripts/validate_web_search_provenance.py --self-test

  web-search-quality:
    needs: web-search-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Require canonical frozen workspace
        run: uv sync --all-packages --frozen
      - name: Ruff hosted search boundary
        run: >-
          uv run ruff check
          services/tool-gateway/src/lumi_tool_gateway/search_backend.py
          services/tool-gateway/src/lumi_tool_gateway/catalog.py
          services/tool-gateway/src/lumi_tool_gateway/service.py
          services/tool-gateway/tests/test_search_backend.py
          services/tool-gateway/tests/test_hosted_adapter_coverage.py
          scripts/validate_web_search_provenance.py
      - name: Pyright hosted search boundary
        run: >-
          uv run pyright
          services/tool-gateway/src/lumi_tool_gateway/search_backend.py
          services/tool-gateway/src/lumi_tool_gateway/service.py
      - name: Hosted search and exact adapter coverage tests
        run: >-
          uv run pytest
          services/tool-gateway/tests/test_search_backend.py
          services/tool-gateway/tests/test_hosted_adapter_coverage.py
          -q

  web-search-image:
    needs: web-search-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build canonical Tool Gateway image
        run: docker build --file services/tool-gateway/Dockerfile --tag lumi-tool-gateway:web-search .
      - name: Verify immutable image identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect lumi-tool-gateway:web-search --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect lumi-tool-gateway:web-search --format '{{json .Config.Cmd}}')" = '["lumi-tool-gateway"]'
      - name: Start Tool Gateway with all hosted production bindings
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name lumi-tool-gateway-search --network host \
            -e LUMI_ENV=test \
            -e LUMI_TOOL_GATEWAY_AUTH_SECRET=$(printf 'g%.0s' {1..64}) \
            -e LUMI_SANDBOX_RUNTIME_URL=http://sandbox.test.internal:8080 \
            -e LUMI_SANDBOX_RUNTIME_AUTH_SECRET=$(printf 's%.0s' {1..64}) \
            -e LUMI_SIDE_EFFECT_CONTROL_URL=http://api.test.internal:8000 \
            -e LUMI_SIDE_EFFECT_CONTROL_AUTH_SECRET=$(printf 'e%.0s' {1..64}) \
            -e LUMI_TOOL_AUDIT_URL=http://api.test.internal:8000 \
            -e LUMI_TOOL_AUDIT_AUTH_SECRET=$(printf 'a%.0s' {1..64}) \
            -e LUMI_TOOL_APPROVAL_URL=http://api.test.internal:8000 \
            -e LUMI_TOOL_APPROVAL_AUTH_SECRET=$(printf 'p%.0s' {1..64}) \
            -e LUMI_TOOL_DATA_URL=http://api.test.internal:8000 \
            -e LUMI_TOOL_DATA_AUTH_SECRET=$(printf 'd%.0s' {1..64}) \
            -e LUMI_TOOL_RESULT_BUCKET=lumi-test-exports \
            -e LUMI_S3_REGION=us-east-1 \
            -e LUMI_BRAVE_SEARCH_API_KEY=provider-contract-key \
            -e AWS_EC2_METADATA_DISABLED=true \
            lumi-tool-gateway:web-search
      - name: Require exact 8/8 adapters and 4/4 runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if ! docker ps --format '{{.Names}}' | grep -qx lumi-tool-gateway-search; then
              docker logs lumi-tool-gateway-search
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready >/tmp/ready.json; then
              jq -e '
                .service == "tool-gateway"
                and .status == "ok"
                and .adapter_count == 8
                and .runtime_binding_count == 4
                and .missing_adapters == []
                and .missing_runtime_bindings == []
              ' /tmp/ready.json >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs lumi-tool-gateway-search
          exit 1
      - name: Diagnostics
        if: failure()
        run: docker logs lumi-tool-gateway-search || true
      - name: Cleanup
        if: always()
        run: docker rm --force lumi-tool-gateway-search >/dev/null 2>&1 || true
