name: Agent Team API Drift Repair

on:
  push:
    branches: [release-closure-p0]
    paths:
      - .github/workflows/agent-team-api-drift-repair.yml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Patch NODE-37 to current AgentDefinition API
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected patch marker in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          contracts = "apps/agent-runtime/src/lumi_agent_runtime/agent_team/contracts.py"
          replace(
              contracts,
              "def team_profile(definition: AgentDefinition) -> AgentTeamProfile:\n",
              "def definition_tool_names(definition: AgentDefinition) -> frozenset[str]:\n"
              "    return frozenset(item.name for item in definition.tools)\n\n\n"
              "def definition_permission_names(definition: AgentDefinition) -> frozenset[str]:\n"
              "    return frozenset(\n"
              "        key for key, enabled in definition.permissions.items() if enabled\n"
              "    )\n\n\n"
              "def team_profile(definition: AgentDefinition) -> AgentTeamProfile:\n",
          )
          replace(
              contracts,
              "    if set(definition.allowed_tools) - profile.delegation_tool_ceiling:\n",
              "    if definition_tool_names(definition) - profile.delegation_tool_ceiling:\n",
          )
          replace(
              contracts,
              "    if set(definition.permissions) - profile.delegation_permission_ceiling:\n",
              "    if definition_permission_names(definition) - profile.delegation_permission_ceiling:\n",
          )

          delegation = "apps/agent-runtime/src/lumi_agent_runtime/agent_team/delegation.py"
          replace(
              delegation,
              "from .contracts import DelegationGrant, team_profile\n",
              "from .contracts import (\n"
              "    DelegationGrant,\n"
              "    definition_permission_names,\n"
              "    definition_tool_names,\n"
              "    team_profile,\n"
              ")\n",
          )
          replace(delegation, "    child_tools = frozenset(child.allowed_tools)\n", "    child_tools = definition_tool_names(child)\n")
          replace(delegation, "    child_permissions = frozenset(child.permissions)\n", "    child_permissions = definition_permission_names(child)\n")
          replace(
              delegation,
              "            if not set(child.allowed_tools) <= profile.delegation_tool_ceiling:\n",
              "            if not definition_tool_names(child) <= profile.delegation_tool_ceiling:\n",
          )
          replace(
              delegation,
              "            if not set(child.permissions) <= profile.delegation_permission_ceiling:\n",
              "            if not definition_permission_names(child) <= profile.delegation_permission_ceiling:\n",
          )

          evals = "apps/agent-runtime/src/lumi_agent_runtime/agent_team/evals.py"
          replace(
              evals,
              "from lumi_agent_runtime.agent_registry.definition import AgentDefinition\n\nfrom .registry import CANONICAL_AGENT_IDS, CompiledAgentTeam\n",
              "from lumi_agent_runtime.agent_registry.definition import AgentDefinition\n\n"
              "from .contracts import definition_permission_names, definition_tool_names\n"
              "from .registry import CANONICAL_AGENT_IDS, CompiledAgentTeam\n",
          )
          replace(evals, "            definition.prompt.text,\n", "            definition.system_prompt,\n")
          replace(evals, '            " ".join(definition.allowed_tools),\n', '            " ".join(sorted(definition_tool_names(definition))),\n')
          replace(evals, '            " ".join(definition.permissions),\n', '            " ".join(sorted(definition_permission_names(definition))),\n')

          registry = "apps/agent-runtime/src/lumi_agent_runtime/agent_team/registry.py"
          replace(
              registry,
              "from .contracts import AgentArchetype, AgentTeamProfile, team_profile\n",
              "from .contracts import (\n"
              "    AgentArchetype,\n"
              "    AgentTeamProfile,\n"
              "    definition_permission_names,\n"
              "    definition_tool_names,\n"
              "    team_profile,\n"
              ")\n",
          )
          replace(registry, "    if write_tools & set(critic.allowed_tools):\n", "    if write_tools & definition_tool_names(critic):\n")
          replace(
              registry,
              '    if any("write" in permission for permission in critic.permissions):\n',
              '    if any("write" in permission for permission in definition_permission_names(critic)):\n',
          )

          validator = "scripts/validate_agent_team_contract.py"
          replace(
              validator,
              "from lumi_agent_runtime.agent_team.evals import (\n",
              "from lumi_agent_runtime.agent_team.contracts import (\n"
              "    definition_permission_names,\n"
              "    definition_tool_names,\n"
              ")\n"
              "from lumi_agent_runtime.agent_team.evals import (\n",
          )
          replace(validator, "            if skill.id not in skills:\n", "            if skill.skill_id not in skills:\n")
          replace(validator, "                raise SystemExit(f\"NODE-37 unknown skill: {agent_id}:{skill.id}\")\n", "                raise SystemExit(f\"NODE-37 unknown skill: {agent_id}:{skill.skill_id}\")\n")
          replace(validator, "        unknown_tools = set(definition.allowed_tools) - TOOL_NAMES\n", "        unknown_tools = definition_tool_names(definition) - TOOL_NAMES\n")
          replace(validator, '    if {"asset.write-derived", "sandbox.execute"} & set(critic.allowed_tools):\n', '    if {"asset.write-derived", "sandbox.execute"} & definition_tool_names(critic):\n')
          replace(
              validator,
              '    if any("write" in permission for permission in critic.permissions):\n',
              '    if any(\n        "write" in permission for permission in definition_permission_names(critic)\n    ):\n',
          )

          tests = "apps/agent-runtime/tests/test_agent_team.py"
          replace(
              tests,
              "    TeamTaskStatus,\n    team_profile,\n",
              "    TeamTaskStatus,\n"
              "    definition_permission_names,\n"
              "    definition_tool_names,\n"
              "    team_profile,\n",
          )
          replace(tests, "            self.assertTrue(definition.prompt.text.strip())\n", "            self.assertTrue(definition.system_prompt.strip())\n")
          replace(tests, '            self.assertFalse(definition.memory_policy.get("write", []), agent_id)\n', "            self.assertFalse(definition.memory_policy.write, agent_id)\n")
          replace(tests, '        self.assertNotIn("asset.write-derived", critic.allowed_tools)\n', '        self.assertNotIn("asset.write-derived", definition_tool_names(critic))\n')
          replace(tests, '        self.assertNotIn("sandbox.execute", critic.allowed_tools)\n', '        self.assertNotIn("sandbox.execute", definition_tool_names(critic))\n')
          replace(tests, '        self.assertFalse(any("write" in permission for permission in critic.permissions))\n', '        self.assertFalse(\n            any("write" in permission for permission in definition_permission_names(critic))\n        )\n')
          replace(tests, "        self.assertEqual(grant.allowed_tools, frozenset(child.allowed_tools))\n", "        self.assertEqual(grant.allowed_tools, definition_tool_names(child))\n")
          replace(tests, "        self.assertEqual(grant.granted_permissions, frozenset(child.permissions))\n", "        self.assertEqual(grant.granted_permissions, definition_permission_names(child))\n")
          PY
      - name: Compile NODE-37 API compatibility patch
        run: >-
          python -m compileall -q
          apps/agent-runtime/src/lumi_agent_runtime/agent_team
          apps/agent-runtime/tests/test_agent_team.py
          scripts/validate_agent_team_contract.py
      - name: NODE-37 Ruff gate
        run: >-
          uv run ruff check
          apps/agent-runtime/src/lumi_agent_runtime/agent_team
          apps/agent-runtime/tests/test_agent_team.py
          apps/agent-runtime/tests/test_agent_team_flow.py
          apps/agent-runtime/tests/test_agent_team_task_graph.py
          scripts/integration_agent_team.py
          scripts/validate_agent_team_contract.py
      - name: NODE-37 Pyright gate
        run: >-
          uv run pyright
          apps/agent-runtime/src/lumi_agent_runtime/agent_team
          apps/agent-runtime/tests/test_agent_team.py
          apps/agent-runtime/tests/test_agent_team_flow.py
          apps/agent-runtime/tests/test_agent_team_task_graph.py
      - name: Patch sanity
        run: git diff --check
      - name: Commit validated API drift repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/agent-runtime/src/lumi_agent_runtime/agent_team/contracts.py \
            apps/agent-runtime/src/lumi_agent_runtime/agent_team/delegation.py \
            apps/agent-runtime/src/lumi_agent_runtime/agent_team/evals.py \
            apps/agent-runtime/src/lumi_agent_runtime/agent_team/registry.py \
            apps/agent-runtime/tests/test_agent_team.py \
            scripts/validate_agent_team_contract.py
          git commit -m "fix: align NODE-37 with current AgentDefinition API [skip ci]"
          git fetch origin release-closure-p0
          git rebase origin/release-closure-p0
          git push origin HEAD:release-closure-p0
