name: Format Canvas Spike

on:
  push:
    branches: [node-08-canvas-technology-spike]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: node-08-canvas-technology-spike
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: pnpm exec prettier --write .github/workflows/ci.yml docs/adr/ADR-0001-CANVAS-RENDERER-SPIKE.md apps/web/e2e/canvas-spike.spec.ts apps/web/src/app/canvas-spike packages/canvas-sdk/src
      - name: Commit formatted spike files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml docs/adr/ADR-0001-CANVAS-RENDERER-SPIKE.md apps/web/e2e/canvas-spike.spec.ts apps/web/src/app/canvas-spike packages/canvas-sdk/src
          git commit -m 'style(canvas): apply repository formatter (NODE-08)'
          git push origin HEAD:node-08-canvas-technology-spike
