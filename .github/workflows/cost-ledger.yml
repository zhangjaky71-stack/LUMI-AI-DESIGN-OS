name: Cost Ledger Budget Quota

on:
  pull_request:
    paths:
      - "apps/api/alembic/**"
      - "apps/api/src/lumi_api/costs/**"
      - "apps/api/src/lumi_api/idempotency/ledger.py"
      - "apps/api/src/lumi_api/persistence/models/**"
      - "apps/api/src/lumi_api/api/**"
      - "apps/api/tests/test_cost_*.py"
      - "services/model-gateway/**"
      - "scripts/validate_idempotency_contract.py"
      - "scripts/validate_cost_ledger_contract.py"
      - "scripts/integration_cost_ledger.py"
      - "docs/runtime/COST-LEDGER-BUDGET-QUOTA-V1.md"
      - "reports/nodes/NODE-27/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile cost runtime and contracts
        run: >-
          PYTHONPATH=apps/api/src:services/model-gateway/src
          python -m compileall -q
          apps/api/src/lumi_api/costs
          apps/api/src/lumi_api/api/v1/cost_router.py
          apps/api/src/lumi_api/idempotency/ledger.py
          services/model-gateway/src/lumi_model_gateway
          apps/api/tests/test_cost_contracts.py
          apps/api/tests/test_cost_api_contract.py
          services/model-gateway/tests/test_cost_accounting.py
          scripts/validate_cost_ledger_contract.py
          scripts/integration_cost_ledger.py
      - name: Revalidate NODE-20 idempotency boundary
        run: >-
          PYTHONPATH=apps/api/src:services/model-gateway/src
          python scripts/validate_idempotency_contract.py
      - name: Revalidate NODE-22 Model Gateway boundary
        run: >-
          PYTHONPATH=services/model-gateway/src
          python scripts/validate_model_gateway_contract.py
      - name: NODE-27 static financial contract
        run: >-
          PYTHONPATH=apps/api/src:services/model-gateway/src
          python scripts/validate_cost_ledger_contract.py
      - name: Decimal and domain unit tests
        run: >-
          PYTHONPATH=apps/api/src:services/model-gateway/src
          python -m unittest discover
          -s apps/api/tests
          -p 'test_cost_contracts.py'
      - name: Model Gateway accounting unit tests
        run: >-
          PYTHONPATH=apps/api/src:services/model-gateway/src
          python -m unittest discover
          -s services/model-gateway/tests
          -p 'test_cost_accounting.py'

  cost-quality:
    needs: cost-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Cost API contract tests
        run: >-
          uv run pytest
          apps/api/tests/test_cost_contracts.py
          apps/api/tests/test_cost_api_contract.py
          services/model-gateway/tests/test_cost_accounting.py
          -q
      - name: NODE-27 Ruff gate
        run: >-
          uv run ruff check
          apps/api/src/lumi_api/costs
          apps/api/src/lumi_api/idempotency/ledger.py
          apps/api/src/lumi_api/persistence/models/platform.py
          apps/api/src/lumi_api/persistence/models/__init__.py
          apps/api/src/lumi_api/api/contract_app.py
          apps/api/src/lumi_api/api/v1/contracts.py
          apps/api/src/lumi_api/api/v1/cost_router.py
          apps/api/src/lumi_api/api/v1/services.py
          apps/api/alembic/versions/0011_cost_ledger_budget_quota.py
          apps/api/tests/test_cost_contracts.py
          apps/api/tests/test_cost_api_contract.py
          services/model-gateway/src/lumi_model_gateway/models.py
          services/model-gateway/src/lumi_model_gateway/ports.py
          services/model-gateway/src/lumi_model_gateway/budget.py
          services/model-gateway/src/lumi_model_gateway/cost_accounting.py
          services/model-gateway/src/lumi_model_gateway/gateway.py
          services/model-gateway/tests/test_cost_accounting.py
          scripts/validate_cost_ledger_contract.py
          scripts/integration_cost_ledger.py
      - name: NODE-27 Pyright gate
        run: >-
          uv run pyright
          apps/api/src/lumi_api/costs
          apps/api/src/lumi_api/api/v1/cost_router.py
          apps/api/tests/test_cost_contracts.py
          apps/api/tests/test_cost_api_contract.py
          services/model-gateway/src/lumi_model_gateway/models.py
          services/model-gateway/src/lumi_model_gateway/ports.py
          services/model-gateway/src/lumi_model_gateway/budget.py
          services/model-gateway/src/lumi_model_gateway/cost_accounting.py
          services/model-gateway/src/lumi_model_gateway/gateway.py
          services/model-gateway/tests/test_cost_accounting.py

  cost-postgres:
    needs: cost-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Start PostgreSQL and dependencies
        run: |
          make infra-env
          make infra-up
      - name: Upgrade database and verify ORM drift
        run: |
          make db-upgrade
          bash scripts/db-local schema-check
          make db-seed
      - name: PostgreSQL budget/concurrency/accounting acceptance
        run: >-
          PYTHONPATH=apps/api/src:services/model-gateway/src
          uv run python scripts/integration_cost_ledger.py
      - name: Migration downgrade/upgrade smoke
        run: bash scripts/db-local downgrade-smoke
      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true
