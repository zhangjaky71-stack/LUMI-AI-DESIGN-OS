name: Event Contract

on:
  pull_request:
    paths:
      - "contracts/events/**"
      - "services/event-contract/**"
      - "scripts/validate_event_contracts.py"
      - ".github/workflows/event-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile reference runtime
        run: python -m compileall -q services/event-contract/src
      - name: Validate registry and JSON schemas
        run: python scripts/validate_event_contracts.py
      - name: Run stdlib event contract tests
        env:
          PYTHONPATH: services/event-contract/src
        run: python -m unittest discover -s services/event-contract/tests -p 'test_*.py' -v
