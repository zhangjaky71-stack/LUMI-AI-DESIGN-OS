name: Auth Integration V2

on:
  pull_request:
    paths:
      - "services/auth/**"
      - "apps/api/src/lumi_api/auth/**"
      - "apps/api/src/lumi_api/persistence/models/identity.py"
      - "apps/api/src/lumi_api/persistence/models/auth_security.py"
      - "apps/api/src/lumi_api/persistence/models/__init__.py"
      - "apps/api/alembic/**"
      - "apps/api/tests/integration/test_auth_*.py"
      - "apps/api/tests/test_persistence_schema.py"
      - "apps/api/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/validate_auth_contracts_v2.py"
      - ".github/workflows/auth-integration-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-integration-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen Python install
        run: uv sync --all-packages --frozen
      - name: Static Auth security contract
        run: uv run python scripts/validate_auth_contracts_v2.py
      - name: Standalone Auth policy tests
        run: |
          PYTHONPATH=services/auth/src \
            python -m unittest discover -s services/auth/tests -p 'test_*.py' -v
      - name: Prepare local infrastructure
        run: make infra-env
      - name: Start infrastructure
        run: make infra-up
      - name: Upgrade empty database to current head
        run: make db-upgrade
      - name: Check ORM / Alembic drift
        run: bash scripts/db-local check
      - name: Complete Auth/Tenant PostgreSQL suite
        env:
          LUMI_AUTH_INTEGRATION: "1"
        run: uv run pytest apps/api/tests/integration/test_auth_tenant.py apps/api/tests/integration/test_auth_privilege_escalation.py -q
      - name: Static persistence schema contract
        run: uv run pytest apps/api/tests/test_persistence_schema.py -q
      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/auth
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml ps > reports/auth/compose-ps.txt 2>&1 || true
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml logs --no-color --tail=300 postgres > reports/auth/postgres.log 2>&1 || true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: auth-integration-v2-${{ github.run_id }}
          path: reports/auth
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true
