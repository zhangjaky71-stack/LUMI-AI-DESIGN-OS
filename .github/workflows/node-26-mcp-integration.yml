name: NODE-26 MCP Integration

on:
  pull_request:
    paths:
      - "services/tool-gateway/src/lumi_tool_gateway/mcp/**"
      - "services/tool-gateway/tests/test_mcp_*.py"
      - "tools/node26/**"
      - "scripts/integration_mcp_tool_gateway.py"
      - "docs/runtime/MCP-*.md"
      - "reports/nodes/NODE-26/**"
      - ".github/workflows/node-26-mcp-integration.yml"
  push:
    branches: [main]
    paths:
      - "services/tool-gateway/src/lumi_tool_gateway/mcp/**"
      - "services/tool-gateway/tests/test_mcp_*.py"
      - "tools/node26/**"
      - "scripts/integration_mcp_tool_gateway.py"
      - "docs/runtime/MCP-*.md"
      - "reports/nodes/NODE-26/**"
      - ".github/workflows/node-26-mcp-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  mcp-integration:
    name: mcp-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Compile NODE-26 scope
        run: |
          PYTHONPATH=services/tool-gateway/src uv run python -m compileall -q \
            services/tool-gateway/src/lumi_tool_gateway/mcp \
            services/tool-gateway/tests \
            tools/node26 \
            scripts/integration_mcp_tool_gateway.py

      - name: Revalidate NODE-25 Tool Gateway boundary
        run: |
          PYTHONPATH=services/tool-gateway/src \
            uv run python tools/node25/validate_tool_gateway.py

      - name: Validate MCP architecture and security contract
        run: |
          PYTHONPATH=services/tool-gateway/src \
            uv run python tools/node26/validate_mcp.py

      - name: Run Tool Gateway and MCP security tests
        run: |
          PYTHONPATH=services/tool-gateway/src \
            uv run pytest -q services/tool-gateway/tests

      - name: Run deterministic MCP to Tool Gateway integration
        run: |
          PYTHONPATH=services/tool-gateway/src \
            uv run python scripts/integration_mcp_tool_gateway.py

      - name: Export and validate MCP schemas and gap ledger
        run: |
          rm -rf reports/nodes/NODE-26/generated-schemas
          uv run python tools/node26/export_mcp_schemas.py
          test "$(find reports/nodes/NODE-26/generated-schemas -name '*.schema.json' | wc -l)" -eq 6
          python - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("reports/nodes/NODE-26/generated-schemas").glob("*.schema.json"))
          assert len(schemas) == 6
          for path in schemas:
              json.loads(path.read_text(encoding="utf-8"))
          ledger = json.loads(Path("reports/nodes/NODE-26/gap-ledger.json").read_text(encoding="utf-8"))
          assert len(ledger["gaps"]) == 7
          assert len({item["id"] for item in ledger["gaps"]}) == 7
          print("NODE26_MCP_SCHEMAS_AND_GAPS_VALID")
          PY

      - name: Ruff NODE-26 scope
        run: |
          uv run ruff check \
            services/tool-gateway/src/lumi_tool_gateway/mcp \
            services/tool-gateway/tests/test_mcp_error_sanitization.py \
            services/tool-gateway/tests/test_mcp_legacy.py \
            services/tool-gateway/tests/test_mcp_mapping_cache.py \
            services/tool-gateway/tests/test_mcp_modern.py \
            tools/node26 \
            scripts/integration_mcp_tool_gateway.py

      - name: Pyright NODE-26 scope
        run: |
          uv run pyright \
            services/tool-gateway/src/lumi_tool_gateway/mcp \
            services/tool-gateway/tests/test_mcp_error_sanitization.py \
            services/tool-gateway/tests/test_mcp_legacy.py \
            services/tool-gateway/tests/test_mcp_mapping_cache.py \
            services/tool-gateway/tests/test_mcp_modern.py \
            tools/node26 \
            scripts/integration_mcp_tool_gateway.py
