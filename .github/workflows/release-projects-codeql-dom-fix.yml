name: Release Projects CodeQL DOM Fix

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-projects-codeql-dom-fix.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-projects-codeql-dom-fix
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install JS workspace
        run: pnpm install --frozen-lockfile
      - name: Apply exact CodeQL DOM boundary patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/components/projects/projects-dashboard.tsx")
          source = path.read_text(encoding="utf-8")
          old = '                  aria-label={`打开项目 ${project.name}`}\n'
          new = '                  aria-label="打开项目详情"\n'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one Projects aria-label sink, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Validate Projects architecture boundaries
        run: |
          python scripts/validate_app_shell.py
          python scripts/validate_projects_ui.py
      - name: Validate Web type and lint gates
        run: |
          pnpm --filter @lumi/web typecheck
          pnpm --filter @lumi/web lint
      - name: Validate Projects and App Shell regressions
        run: |
          pnpm --filter @lumi/web exec vitest run src/lib/projects
          pnpm --filter @lumi/web exec vitest run src/lib/app-shell/api-client.test.ts src/lib/app-shell/query-cache.test.ts
      - name: Validate Projects formatting
        run: pnpm exec prettier --check "apps/web/src/components/projects/projects-dashboard.tsx"
      - name: Commit verified CodeQL DOM boundary fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/projects/projects-dashboard.tsx
          git diff --cached --quiet && { echo 'No verified Projects DOM change to commit' >&2; exit 1; }
          git commit -m "fix(projects): remove dynamic DOM aria label sink"
          git push origin HEAD:release-closure-p0
