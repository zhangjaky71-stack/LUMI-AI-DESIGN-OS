name: NODE-37 Agent Team

on:
  pull_request:
    paths:
      - "apps/agent-runtime/src/lumi_agent_runtime/agent_team/**"
      - "apps/agent-runtime/tests/test_agent_team_node37.py"
      - "docs/runtime/AGENT-TEAM-V1.md"
      - "reports/nodes/NODE-37/**"
      - "tools/node37/**"
      - ".github/workflows/node-37-agent-team.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  agent-team:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Validate NODE-37 static contract
        run: uv run python tools/node37/validate_agent_team.py

      - name: Run NODE-37 contract tests
        run: |
          PYTHONPATH=apps/agent-runtime/src \
            uv run pytest -q apps/agent-runtime/tests/test_agent_team_node37.py

      - name: Parse gap ledger
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          ledger = json.loads(
              Path("reports/nodes/NODE-37/gap-ledger.json").read_text(encoding="utf-8")
          )
          assert ledger["node"] == "NODE-37"
          assert len(ledger["gaps"]) == 5
          print("NODE37_GAP_LEDGER_PARSE_PASS")
          PY

      - name: Ruff
        run: |
          uv run ruff check \
            apps/agent-runtime/src/lumi_agent_runtime/agent_team \
            apps/agent-runtime/tests/test_agent_team_node37.py \
            tools/node37

      - name: Pyright
        run: |
          uv run pyright \
            apps/agent-runtime/src/lumi_agent_runtime/agent_team \
            apps/agent-runtime/tests/test_agent_team_node37.py \
            tools/node37
