name: Tool Gateway P0 Evidence Assembler Self-Test

on:
  pull_request:
    paths:
      - "scripts/assemble_tool_gateway_p0_e2e_evidence.py"
      - "scripts/self_test_tool_gateway_p0_evidence_assembly.py"
      - "scripts/merge_tool_gateway_e2e_into_staging_evidence.py"
      - "scripts/validate_tool_gateway_e2e_evidence.py"
      - "staging/acceptance/tool-gateway-e2e-v1.json"
      - ".github/workflows/tool-gateway-p0-evidence-assembler-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembler-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile evidence assembler sources
        run: |
          python3 -m py_compile \
            scripts/assemble_tool_gateway_p0_e2e_evidence.py \
            scripts/self_test_tool_gateway_p0_evidence_assembly.py \
            scripts/merge_tool_gateway_e2e_into_staging_evidence.py \
            scripts/validate_tool_gateway_e2e_evidence.py
      - name: Execute fail-closed evidence assembler self-test
        run: python3 scripts/self_test_tool_gateway_p0_evidence_assembly.py
