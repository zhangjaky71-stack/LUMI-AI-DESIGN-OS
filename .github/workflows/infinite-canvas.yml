name: Infinite Canvas

on:
  pull_request:
    paths:
      - "apps/web/src/app/app/projects/**"
      - "apps/web/src/components/ai-workspace/**"
      - "apps/web/src/components/infinite-canvas/**"
      - "apps/web/src/lib/infinite-canvas/**"
      - "apps/web/e2e/ai-workspace.spec.ts"
      - "apps/web/e2e/infinite-canvas.spec.ts"
      - "apps/web/tsconfig.json"
      - "scripts/validate_infinite_canvas.py"
      - "docs/nodes/NODE-55-INFINITE-CANVAS-UI.md"
      - "docs/runtime/INFINITE-CANVAS-V1.md"
      - "reports/nodes/NODE-55/**"
      - ".github/workflows/infinite-canvas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infinite-canvas-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Validate frontend chain
        run: |
          python scripts/validate_app_shell.py
          python scripts/validate_projects_ui.py
          python scripts/validate_ai_workspace.py
          python scripts/validate_infinite_canvas.py
      - name: Typecheck Design IR and Canvas SDK
        run: |
          pnpm --filter @lumi/design-ir typecheck
          pnpm --filter @lumi/canvas-sdk typecheck
      - name: Typecheck web product
        run: pnpm --filter @lumi/web typecheck

  infinite-canvas-quality:
    needs: infinite-canvas-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Lint web product
        run: pnpm --filter @lumi/web lint
      - name: Run Canvas SDK regression tests
        run: pnpm --filter @lumi/canvas-sdk test
      - name: Run Infinite Canvas unit tests
        run: pnpm --filter @lumi/web exec vitest run src/lib/infinite-canvas
      - name: Run AI Workspace regression units
        run: pnpm --filter @lumi/web exec vitest run src/lib/ai-workspace
      - name: Check NODE-55 formatting
        run: pnpm exec prettier --check "apps/web/src/components/infinite-canvas/**/*.{ts,tsx,css}" "apps/web/src/lib/infinite-canvas/**/*.{ts,tsx}" "apps/web/e2e/infinite-canvas.spec.ts" "apps/web/src/components/ai-workspace/ai-workspace.tsx"

  infinite-canvas-build:
    needs: infinite-canvas-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      LUMI_SHELL_E2E_AUTH: "0"
      LUMI_PROJECTS_E2E: "0"
      LUMI_AI_WORKSPACE_E2E: "0"
      LUMI_INFINITE_CANVAS_E2E: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build production Next.js app
        run: pnpm --filter @lumi/web build
      - name: Assert Canvas E2E control is absent from client chunks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -F "LUMI_INFINITE_CANVAS_E2E" apps/web/.next/static; then
            echo "Infinite Canvas E2E environment flag leaked into client chunks"
            exit 1
          fi

  infinite-canvas-browser-e2e:
    needs: [infinite-canvas-quality, infinite-canvas-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      LUMI_SHELL_E2E_AUTH: "1"
      LUMI_PROJECTS_E2E: "1"
      LUMI_AI_WORKSPACE_E2E: "1"
      LUMI_INFINITE_CANVAS_E2E: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run NODE-55 browser scenarios
        run: pnpm exec playwright test apps/web/e2e/infinite-canvas.spec.ts
      - name: Re-run NODE-54 browser regressions
        run: pnpm exec playwright test apps/web/e2e/ai-workspace.spec.ts
