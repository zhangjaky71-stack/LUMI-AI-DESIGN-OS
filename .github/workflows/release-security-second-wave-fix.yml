name: Release Security Second Wave Fix

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-security-second-wave-fix.yml"
      - "scripts/release_security_second_wave_patch.py"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-security-second-wave-fix
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Apply auditable security second-wave patch
        run: python3 scripts/release_security_second_wave_patch.py

      - name: Verify patch syntax and durable contracts
        run: |
          python3 -m py_compile \
            scripts/release_security_second_wave_patch.py \
            scripts/validate_production_iac_contract.py \
            scripts/validate_recovery_contract.py
          python3 scripts/validate_production_iac_contract.py
          python3 scripts/validate_recovery_contract.py
          terraform fmt -check -recursive infra/iac
          git diff --check

      - name: Validate Terraform roots without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          roots=(
            infra/iac/bootstrap
            infra/iac/environments/staging/core
            infra/iac/environments/staging/migration
            infra/iac/environments/staging/app
            infra/iac/environments/production/core
            infra/iac/environments/production/migration
            infra/iac/environments/production/app
          )
          for root in "${roots[@]}"; do
            echo "==> $root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - name: Verify frozen Python workspace
        run: |
          uv lock --check
          uv sync --all-packages --frozen

      - name: Run canonical security regression corpus
        run: |
          uv run pytest \
            apps/api/tests/test_security_hardening.py \
            apps/api/tests/integration/test_auth_tenant.py \
            apps/api/tests/integration/test_auth_privilege_escalation.py \
            apps/api/tests/integration/test_project_security.py \
            services/tool-gateway/tests/test_ssrf.py \
            services/tool-gateway/tests/test_mcp_error_sanitization.py \
            services/sandbox-runtime/tests/test_sandbox_contracts.py \
            apps/agent-runtime/tests/test_context_engine.py \
            apps/agent-runtime/tests/test_approval_bridge.py \
            services/asset-storage/tests/test_asset_storage_security.py \
            apps/worker-media/tests/test_asset_validation_security.py

      - name: Verify strict Python dependency audit without local editable packages
        shell: bash
        run: |
          set -euo pipefail
          uv export --all-packages --frozen --no-dev --no-emit-workspace --format requirements-txt > /tmp/requirements.txt
          if grep -E '(^-e[[:space:]]|file://.*/LUMI-AI-DESIGN-OS/)' /tmp/requirements.txt; then
            echo 'workspace-local requirement leaked into third-party audit input' >&2
            exit 1
          fi
          uvx --from pip-audit pip-audit -r /tmp/requirements.txt --strict

      - name: Verify Python high-severity SAST
        run: uvx --from bandit bandit -q -lll -r apps services packages -x '*/tests/*'

      - name: Verify IaC and filesystem security with scoped exceptions
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml

      - name: Verify exception scope and least-privilege markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ignore = Path('.trivyignore.yaml').read_text(encoding='utf-8')
          assert 'AVD-DS-0002' in ignore
          assert 'infra/docker/postgres-recovery/Dockerfile' in ignore
          assert 'infra/iac/' not in ignore

          bootstrap = Path('infra/iac/bootstrap/main.tf').read_text(encoding='utf-8')
          policy_marker = 'data "aws_iam_policy_document" "github_platform_provisioner" {'
          role_marker = 'resource "aws_iam_role_policy" "github_platform_provisioner" {'
          assert policy_marker in bootstrap and role_marker in bootstrap
          provisioner = bootstrap.split(policy_marker, 1)[1].split(role_marker, 1)[0]
          assert '"s3:*"' not in provisioner

          network = Path('infra/iac/modules/network/main.tf').read_text(encoding='utf-8')
          assert '#trivy:ignore:AVD-AWS-0104' in network
          assert 'protocol    = "tcp"' in network
          assert 'from_port   = 443' in network
          assert 'to_port     = 443' in network

          compute = Path('infra/iac/modules/compute/main.tf').read_text(encoding='utf-8')
          assert '#trivy:ignore:AVD-AWS-0053' in compute
          PY

      - name: Commit verified security closure and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/release-security-second-wave-fix.yml
          rm scripts/release_security_second_wave_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/release-security-second-wave-fix.yml \
            .github/workflows/security-release-gate.yml \
            .trivyignore.yaml \
            infra/iac/bootstrap/main.tf \
            infra/iac/modules/network/main.tf \
            infra/iac/modules/compute/main.tf \
            scripts/release_security_second_wave_patch.py \
            scripts/validate_production_iac_contract.py \
            scripts/validate_recovery_contract.py
          git diff --cached --quiet && { echo 'No verified security changes to commit' >&2; exit 1; }
          git commit -m "fix(security): close second-wave code-addressable gates"
          git push origin HEAD:release-closure-p0
