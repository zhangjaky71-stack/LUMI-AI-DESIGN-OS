name: NODE-73 Correctness Closure One-Shot

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - .github/workflows/node73-correctness-closure-one-shot.yml

permissions:
  contents: write

jobs:
  closure:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release-closure-p0'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release closure branch
        uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.11.28

      - name: Apply bounded correctness fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          local = Path('services/sandbox-runtime/src/lumi_sandbox_runtime/local_backend.py')
          text = local.read_text()
          text = text.replace(
              'from typing import BinaryIO\n',
              'from typing import BinaryIO, cast\n',
              1,
          )
          old = '''            log_cap = min(record.spec.max_output_bytes * 8, 64 * 1024 * 1024)
            stdout_thread = _stream_to_file(process.stdout, stdout_path, log_cap)
            stderr_thread = _stream_to_file(process.stderr, stderr_path, log_cap)
'''
          new = '''            log_cap = min(record.spec.max_output_bytes * 8, 64 * 1024 * 1024)
            if process.stdout is None or process.stderr is None:
                process.kill()
                raise SandboxError("SANDBOX_EXEC_PIPE_MISSING")
            stdout_thread = _stream_to_file(
                cast(BinaryIO, process.stdout), stdout_path, log_cap
            )
            stderr_thread = _stream_to_file(
                cast(BinaryIO, process.stderr), stderr_path, log_cap
            )
'''
          if old not in text:
              raise SystemExit('local sandbox pipe block not found')
          local.write_text(text.replace(old, new, 1))

          for raw_path in (
              'services/model-gateway/src/lumi_model_gateway/openai_image_adapter.py',
              'services/model-gateway/src/lumi_model_gateway/openai_video_adapter.py',
          ):
              path = Path(raw_path)
              source = path.read_text()
              needle = '        async def unsupported() -> AsyncIterator[StreamChunk]:\n            del request\n'
              replacement = '        async def unsupported() -> AsyncIterator[StreamChunk]:\n'
              if needle not in source:
                  raise SystemExit(f'{raw_path}: unsupported stream block not found')
              path.write_text(source.replace(needle, replacement, 1))
          PY

      - name: Frozen workspace install
        run: uv sync --all-packages --frozen

      - name: Apply safe Model Gateway Ruff fixes
        run: |
          uv run ruff check --fix \
            services/model-gateway \
            services/asset-storage/src/lumi_asset_storage/s3.py \
            services/asset-storage/tests/test_s3_bounded_bytes.py \
            apps/api/src/lumi_api/model_gateway_runtime.py \
            apps/api/src/lumi_api/model_gateway_bootstrap.py \
            apps/api/src/lumi_api/model_gateway_service.py \
            apps/api/src/lumi_api/model_gateway_cli.py \
            apps/api/src/lumi_api/model_paid_guard.py \
            apps/api/src/lumi_api/provider_output_store.py \
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/model_gateway_chat.py \
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/runtime_factory.py \
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py \
            apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_gateway_runtime.py \
            apps/worker-media/tests/test_image_gateway_runtime.py \
            apps/api/tests/test_model_gateway_media_bootstrap.py \
            apps/api/tests/test_model_paid_guard.py \
            apps/api/tests/test_provider_output_store.py \
            apps/api/tests/integration/test_model_paid_guard_postgres.py \
            scripts/validate_model_gateway_contract.py \
            scripts/validate_deep_agents_model_gateway_contract.py \
            scripts/validate_private_model_gateway_deployment_contract.py \
            scripts/integration_model_gateway.py || true

      - name: Verify Sandbox Ruff and Pyright
        run: |
          uv run ruff check services/sandbox-runtime scripts/validate_sandbox_runtime_contract.py scripts/integration_sandbox_runtime.py scripts/integration_sandbox_docker_config.py
          uv run pyright services/sandbox-runtime/src services/sandbox-runtime/tests

      - name: Verify Model Gateway F821 closure
        run: |
          uv run ruff check --select F821 \
            services/model-gateway \
            apps/api/src/lumi_api \
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/model_gateway_chat.py \
            apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_gateway_runtime.py

      - name: Validate diff
        run: git diff --check

      - name: Commit fixes and self-delete
        run: |
          git rm .github/workflows/node73-correctness-closure-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): close sandbox and model correctness gates'
          git push origin HEAD:release-closure-p0
