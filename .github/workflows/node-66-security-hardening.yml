name: NODE-66 Security Hardening

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/security/**"
      - "apps/api/src/lumi_api/api/v1/app.py"
      - "apps/api/tests/test_security_node66.py"
      - "apps/api/tests/test_security_context_node66.py"
      - "apps/api/tests/test_asset_security_contract.py"
      - "apps/api/tests/test_auth_tenant_contract.py"
      - "apps/api/tests/test_project_core_contract.py"
      - "apps/api/tests/test_asset_storage_contract.py"
      - "apps/api/tests/test_admin_node64.py"
      - "apps/web/**"
      - "services/tool-gateway/**"
      - "services/sandbox-runtime/**"
      - "tools/node66/**"
      - "docs/security/**"
      - "docs/nodes/NODE-66-SECURITY-HARDENING.md"
      - "reports/nodes/NODE-66/**"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/secret-scan.yml"
      - ".github/workflows/node-66-security-hardening.yml"
      - ".github/workflows/node-66-security-dast.yml"
      - "uv.lock"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.4.0"
  PIP_AUDIT_VERSION: "2.10.1"
  BANDIT_VERSION: "1.9.4"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_LUMI_ENV: "production"

jobs:
  security-contract:
    name: security-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Verify Python lock is current
        run: uv lock --check

      - name: Install frozen Python workspace
        run: uv sync --all-packages --frozen

      - name: Compile NODE-66 security scope
        run: |
          uv run python -m compileall -q \
            apps/api/src/lumi_api/security \
            apps/api/src/lumi_api/api/v1/app.py \
            apps/api/tests/test_security_node66.py \
            apps/api/tests/test_security_context_node66.py \
            tools/node66

      - name: Static NODE-66 security acceptance
        run: uv run python tools/node66/validate_security.py

      - name: Run NODE-66 API BOLA and trust/release-gate tests
        run: |
          PYTHONPATH=apps/api/src:services/tool-gateway/src:services/sandbox-runtime/src \
            uv run pytest -q \
              apps/api/tests/test_security_node66.py \
              apps/api/tests/test_security_context_node66.py \
              apps/api/tests/test_api_v1_contract.py \
              apps/api/tests/test_asset_security_contract.py \
              apps/api/tests/test_auth_tenant_contract.py \
              apps/api/tests/test_project_core_contract.py \
              apps/api/tests/test_asset_storage_contract.py \
              apps/api/tests/test_admin_node64.py

      - name: Run Tool Gateway SSRF security corpus
        run: |
          PYTHONPATH=services/tool-gateway/src:apps/api/src \
            uv run pytest -q services/tool-gateway/tests/test_ssrf.py

      - name: Run Sandbox source security corpus
        run: |
          PYTHONPATH=services/sandbox-runtime/src \
            uv run pytest -q \
              services/sandbox-runtime/tests/test_sandbox_contract.py \
              services/sandbox-runtime/tests/test_archive_links.py \
              services/sandbox-runtime/tests/test_artifact_limits.py

      - name: Revalidate Tool Gateway and Sandbox architecture gates
        run: |
          PYTHONPATH=services/tool-gateway/src:apps/api/src \
            uv run python tools/node25/validate_tool_gateway.py
          PYTHONPATH=services/sandbox-runtime/src \
            uv run python tools/node21/validate_sandbox_runtime.py
          PYTHONPATH=services/sandbox-runtime/src \
            uv run python tools/node21/validate_deepagents_protocol.py

      - name: Ruff NODE-66 changed Python scope
        run: |
          uv run ruff check --ignore E501,I001 \
            apps/api/src/lumi_api/security \
            apps/api/src/lumi_api/api/v1/app.py \
            apps/api/tests/test_security_node66.py \
            apps/api/tests/test_security_context_node66.py \
            tools/node66

      - name: Pyright NODE-66 security core
        run: |
          uv run pyright \
            apps/api/src/lumi_api/security \
            apps/api/src/lumi_api/api/v1/app.py

      - name: Verify NODE-66 gap ledger remains fail-closed
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path("reports/nodes/NODE-66/gap-ledger.json").read_text(encoding="utf-8"))
          assert ledger["node"] == "NODE-66"
          assert ledger["status"] == "CORE_IMPLEMENTED_VALIDATING_NOT_COMPLETE"
          assert any(gap["severity"] == "P0" and gap["status"] == "open" for gap in ledger["gaps"])
          assert any(gap["id"] == "NODE66-GAP-201" and gap["status"] == "closed" for gap in ledger["gaps"])
          assert any(gap["id"] == "NODE66-GAP-207" and gap["status"] == "closed" for gap in ledger["gaps"])
          print("NODE66_GAP_LEDGER_PARSE_PASS")
          PY

      - name: Upload NODE-66 policy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-66-security-policy-${{ github.run_id }}
          path: |
            docs/security/THREAT-MODEL.md
            reports/nodes/NODE-66/gap-ledger.json
            reports/nodes/NODE-66/implementation.md
            reports/nodes/NODE-66/bola-corpus.json
          if-no-files-found: error
          retention-days: 30

  security-sca:
    name: security-sca
    needs: security-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Create security evidence directory
        run: mkdir -p reports/nodes/NODE-66/security

      - name: Verify dependency locks
        run: |
          uv lock --check
          pnpm install --frozen-lockfile

      - name: Export frozen third-party Python dependency graph
        run: |
          uv export --all-packages --no-emit-workspace --frozen --format requirements.txt --no-hashes \
            > reports/nodes/NODE-66/security/python-requirements.txt

      - name: Blocking Python dependency audit
        run: |
          uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit \
            -r reports/nodes/NODE-66/security/python-requirements.txt \
            --format json \
            --output reports/nodes/NODE-66/security/pip-audit.json

      - name: Blocking Python high-severity SAST
        run: |
          uvx --from "bandit==${BANDIT_VERSION}" bandit \
            -r apps/api/src services \
            --severity-level high \
            --confidence-level medium \
            --format json \
            --output reports/nodes/NODE-66/security/bandit.json

      - name: Blocking Node high-severity dependency audit
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --audit-level high --json \
            | tee reports/nodes/NODE-66/security/pnpm-audit.json

      - name: Blocking filesystem vulnerability secret and IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: json
          output: reports/nodes/NODE-66/security/trivy-fs.json

      - name: Generate CycloneDX filesystem SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "0"
          format: cyclonedx
          output: reports/nodes/NODE-66/security/sbom.cdx.json

      - name: Upload SCA SAST IaC and SBOM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-66-supply-chain-${{ github.run_id }}
          path: reports/nodes/NODE-66/security
          if-no-files-found: error
          retention-days: 30

  security-sandbox:
    name: security-sandbox
    needs: security-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SANDBOX_IMAGE: "lumi-sandbox:node21"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Verify and install frozen Python workspace
        run: |
          uv lock --check
          uv sync --all-packages --frozen

      - name: Build exact Sandbox image
        run: |
          docker build \
            --file services/sandbox-runtime/docker/Dockerfile \
            --tag "${SANDBOX_IMAGE}" \
            .
          mkdir -p reports/nodes/NODE-66/runtime
          docker image inspect "${SANDBOX_IMAGE}" > reports/nodes/NODE-66/runtime/sandbox-image.json

      - name: Verify Sandbox image has no ambient secret configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("reports/nodes/NODE-66/runtime/sandbox-image.json").read_text())[0]
          config = data["Config"]
          assert config["User"] == "65532:65532", config["User"]
          env = config.get("Env") or []
          forbidden = (
              "OPENAI_API_KEY=", "ANTHROPIC_API_KEY=", "DATABASE_URL=",
              "PGPASSWORD=", "AWS_SECRET_ACCESS_KEY=", "DOCKER_HOST="
          )
          assert not any(item.startswith(forbidden) for item in env), env
          PY

      - name: Blocking Sandbox image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SANDBOX_IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          vuln-type: os,library
          format: json
          output: reports/nodes/NODE-66/runtime/trivy-sandbox-image.json

      - name: Run real Docker Sandbox attack/functional suite
        run: |
          PYTHONPATH=services/sandbox-runtime/src \
            uv run python tools/node21/test_docker_sandbox.py

      - name: Verify no Sandbox container leaked after suite
        run: |
          leftovers="$(docker ps -aq --filter label=lumi.sandbox=true)"
          if [ -n "$leftovers" ]; then
            echo "leftover LUMI sandbox containers: $leftovers" >&2
            docker inspect $leftovers || true
            exit 1
          fi

      - name: Capture Sandbox diagnostics
        if: failure()
        run: |
          mkdir -p reports/nodes/NODE-66/runtime
          docker version > reports/nodes/NODE-66/runtime/docker-version.txt 2>&1 || true
          docker info > reports/nodes/NODE-66/runtime/docker-info.txt 2>&1 || true
          docker ps -a --filter label=lumi.sandbox=true > reports/nodes/NODE-66/runtime/sandbox-containers.txt 2>&1 || true

      - name: Upload Sandbox evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-66-sandbox-${{ github.run_id }}
          path: reports/nodes/NODE-66/runtime
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup Sandbox containers and image
        if: always()
        run: |
          ids="$(docker ps -aq --filter label=lumi.sandbox=true)"
          if [ -n "$ids" ]; then docker rm -f $ids || true; fi
          docker image rm -f "${SANDBOX_IMAGE}" || true

  security-web:
    name: security-web
    needs: security-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install frozen JS workspace
        run: pnpm install --frozen-lockfile

      - name: Run Web unit tests
        run: pnpm --filter @lumi/web test

      - name: Typecheck Web
        run: pnpm --filter @lumi/web typecheck

      - name: Lint Web
        run: pnpm --filter @lumi/web lint

      - name: Production Web build with security headers
        run: pnpm --filter @lumi/web build
