name: NODE-36 Knowledge Engine

on:
  pull_request:
    paths:
      - "apps/agent-runtime/src/lumi_agent_runtime/knowledge_engine/**"
      - "apps/agent-runtime/tests/test_knowledge_*node36.py"
      - "benchmarks/knowledge/**"
      - "docs/runtime/KNOWLEDGE-ENGINE-V1.md"
      - "reports/nodes/NODE-36/**"
      - "tools/node36/**"
      - ".github/workflows/node-36-knowledge-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  knowledge-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Validate NODE-36 static contract
        run: uv run python tools/node36/validate_knowledge_engine.py

      - name: Run NODE-36 contract tests
        run: |
          PYTHONPATH=apps/agent-runtime/src \
            uv run pytest -q apps/agent-runtime/tests/test_knowledge_*node36.py

      - name: Parse benchmark and gap ledger
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          json.loads(
              Path("reports/nodes/NODE-36/gap-ledger.json").read_text(encoding="utf-8")
          )
          for line in Path("benchmarks/knowledge/hybrid-retrieval-v1.jsonl").read_text(
              encoding="utf-8"
          ).splitlines():
              if line.strip():
                  json.loads(line)
          print("NODE36_JSON_PARSE_PASS")
          PY

      - name: Ruff
        run: |
          uv run ruff check \
            apps/agent-runtime/src/lumi_agent_runtime/knowledge_engine \
            apps/agent-runtime/tests/test_knowledge_*node36.py \
            tools/node36

      - name: Pyright
        run: |
          uv run pyright \
            apps/agent-runtime/src/lumi_agent_runtime/knowledge_engine \
            apps/agent-runtime/tests/test_knowledge_*node36.py \
            tools/node36
