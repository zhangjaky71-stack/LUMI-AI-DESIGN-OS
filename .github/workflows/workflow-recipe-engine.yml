name: Workflow / Recipe Engine

on:
  pull_request:
    paths:
      - "recipes/**"
      - "schemas/recipe/**"
      - "evals/profiles/recipes/**"
      - "apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/**"
      - "apps/agent-runtime/src/lumi_agent_runtime/agent_registry/validator.py"
      - "apps/agent-runtime/tests/test_recipe_*.py"
      - "scripts/validate_recipe_engine_contract.py"
      - "scripts/integration_recipe_engine*.py"
      - "docs/runtime/WORKFLOW-RECIPE-ENGINE-V1.md"
      - "reports/nodes/NODE-32/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile NODE-32 runtime and acceptance
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python -m compileall -q
          apps/agent-runtime/src/lumi_agent_runtime/recipe_engine
          apps/agent-runtime/tests/test_recipe_expression.py
          apps/agent-runtime/tests/test_recipe_dag.py
          apps/agent-runtime/tests/test_recipe_release.py
          scripts/validate_recipe_engine_contract.py
          scripts/integration_recipe_engine.py
          scripts/integration_recipe_engine_mock.py
      - name: Revalidate NODE-31 Skill Registry
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python scripts/validate_skill_registry_contract.py
      - name: NODE-32 static Recipe contract
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python scripts/validate_recipe_engine_contract.py
      - name: NODE-32 dependency-light unit tests
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python -m unittest discover
          -s apps/agent-runtime/tests
          -p 'test_recipe_*.py'

  recipe-quality:
    needs: recipe-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: NODE-32 pytest
        run: >-
          uv run pytest
          apps/agent-runtime/tests/test_recipe_expression.py
          apps/agent-runtime/tests/test_recipe_dag.py
          apps/agent-runtime/tests/test_recipe_release.py
          -q
      - name: NODE-23/25/30/31 Recipe compiler integration
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          uv run python scripts/integration_recipe_engine.py
      - name: NODE-32 Ruff gate
        run: >-
          uv run ruff check
          apps/agent-runtime/src/lumi_agent_runtime/recipe_engine
          apps/agent-runtime/tests/test_recipe_expression.py
          apps/agent-runtime/tests/test_recipe_dag.py
          apps/agent-runtime/tests/test_recipe_release.py
          scripts/validate_recipe_engine_contract.py
          scripts/integration_recipe_engine.py
          scripts/integration_recipe_engine_mock.py
      - name: NODE-32 Pyright gate
        run: >-
          uv run pyright
          apps/agent-runtime/src/lumi_agent_runtime/recipe_engine
          apps/agent-runtime/tests/test_recipe_expression.py
          apps/agent-runtime/tests/test_recipe_dag.py
          apps/agent-runtime/tests/test_recipe_release.py

  recipe-mock:
    needs: recipe-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Recompile all production Recipes
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          uv run python scripts/integration_recipe_engine.py
      - name: Deterministic Recipe E2E
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src:scripts
          uv run python scripts/integration_recipe_engine_mock.py
