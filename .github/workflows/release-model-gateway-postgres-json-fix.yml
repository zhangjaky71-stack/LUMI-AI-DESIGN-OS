name: Release Model Gateway PostgreSQL JSON Fix

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-model-gateway-postgres-json-fix.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-model-gateway-postgres-json-fix
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
      LUMI_DB_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Patch fail-closed PostgreSQL paid-guard boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/lumi_api/idempotency/gateway.py")
          source = path.read_text(encoding="utf-8")

          import_anchor = "from __future__ import annotations\n\n"
          if import_anchor not in source:
              raise SystemExit("gateway import anchor missing")
          if "\nimport json\n" in source:
              raise SystemExit("json import already present unexpectedly")
          source = source.replace(import_anchor, import_anchor + "import json\n", 1)

          old_snapshot = '        result_json=dict(row["result_json"] or {}),\n'
          new_snapshot = '        result_json=_json_object(row["result_json"]),\n'
          if source.count(old_snapshot) != 1:
              raise SystemExit("expected exactly one legacy result_json snapshot decode")
          source = source.replace(old_snapshot, new_snapshot, 1)

          old_failure_status = (
              "                SET status = $3, error_category = $4, error_code = $5,\n"
              "                    completed_at = CASE WHEN $3 = 'failed_final' THEN now() ELSE NULL END,\n"
          )
          new_failure_status = (
              "                SET status = $3::varchar(32), error_category = $4, error_code = $5,\n"
              "                    completed_at = CASE WHEN $3::varchar(32) = 'failed_final' THEN now() ELSE NULL END,\n"
          )
          if source.count(old_failure_status) != 1:
              raise SystemExit("expected exactly one ambiguous failure-status SQL boundary")
          source = source.replace(old_failure_status, new_failure_status, 1)

          old_json = '''def _json(value: dict[str, Any]) -> str:\n    import json\n\n    return json.dumps(value, ensure_ascii=False, separators=(",", ":"))\n'''
          new_json = '''def _json_object(value: Any) -> dict[str, Any]:\n    if value is None:\n        return {}\n    if isinstance(value, dict):\n        return dict(value)\n    if isinstance(value, (str, bytes, bytearray)):\n        try:\n            decoded = json.loads(value)\n        except (json.JSONDecodeError, UnicodeDecodeError, TypeError) as exc:\n            raise ValueError("IDEMPOTENCY_RESULT_JSON_INVALID") from exc\n        if not isinstance(decoded, dict):\n            raise ValueError("IDEMPOTENCY_RESULT_JSON_INVALID")\n        return decoded\n    raise ValueError("IDEMPOTENCY_RESULT_JSON_INVALID")\n\n\ndef _json(value: dict[str, Any]) -> str:\n    return json.dumps(value, ensure_ascii=False, separators=(",", ":"))\n'''
          if source.count(old_json) != 1:
              raise SystemExit("legacy _json helper boundary missing")
          source = source.replace(old_json, new_json, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Frozen install and static verification
        run: |
          uv sync --all-packages --frozen
          uv run ruff check --fix --select I apps/api/src/lumi_api/idempotency/gateway.py
          uv run ruff check apps/api/src/lumi_api/idempotency/gateway.py apps/api/tests/integration/test_model_paid_guard_postgres.py
          uv run pyright apps/api/src/lumi_api/idempotency/gateway.py
          uv run python - <<'PY'
          from pathlib import Path

          from lumi_api.idempotency.gateway import _json_object

          assert _json_object(None) == {}
          assert _json_object({"ok": True}) == {"ok": True}
          assert _json_object('{"ok":true}') == {"ok": True}
          assert _json_object(b'{"count":2}') == {"count": 2}
          for invalid in ('[]', '"scalar"', b'not-json', 7):
              try:
                  _json_object(invalid)
              except ValueError as exc:
                  assert str(exc) == "IDEMPOTENCY_RESULT_JSON_INVALID"
              else:
                  raise AssertionError(f"invalid JSON boundary accepted: {invalid!r}")

          source = Path("apps/api/src/lumi_api/idempotency/gateway.py").read_text(encoding="utf-8")
          assert "SET status = $3::varchar(32)" in source
          assert "CASE WHEN $3::varchar(32) = 'failed_final'" in source
          print("idempotency PostgreSQL paid-guard boundaries: PASS")
          PY

      - name: Prepare PostgreSQL acceptance environment
        run: |
          make infra-env
          make infra-up
          make db-upgrade
          bash scripts/db-local schema-check
          make db-seed

      - name: Durable paid invocation PostgreSQL acceptance
        run: uv run pytest apps/api/tests/integration/test_model_paid_guard_postgres.py -q

      - name: Migration downgrade and re-upgrade smoke
        run: bash scripts/db-local downgrade-smoke

      - name: Self-remove and commit verified fix
        run: |
          rm .github/workflows/release-model-gateway-postgres-json-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/release-model-gateway-postgres-json-fix.yml \
            apps/api/src/lumi_api/idempotency/gateway.py
          if git diff --cached --quiet; then
            echo "No verified PostgreSQL paid-guard changes were produced" >&2
            exit 1
          fi
          git commit -m "fix(model-gateway): harden durable paid guard postgres boundary"
          git push origin HEAD:release-closure-p0

      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true
