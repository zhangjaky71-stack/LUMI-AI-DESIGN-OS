name: NODE-11 API Contract

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/api/**"
      - "apps/api/tests/test_api_v1_contract.py"
      - "tools/node11/**"
      - "docs/api/**"
      - "docs/nodes/NODE-11-API-CONTRACT.md"
      - "reports/nodes/NODE-11/**"
      - ".github/workflows/node-11-api-contract.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/lumi_api/api/**"
      - "apps/api/tests/test_api_v1_contract.py"
      - "tools/node11/**"
      - "docs/api/**"
      - "reports/nodes/NODE-11/**"
      - ".github/workflows/node-11-api-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  api-contract:
    name: api-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Validate API architecture and OpenAPI contract
        run: |
          PYTHONPATH=apps/api/src uv run python tools/node11/validate_api_contract.py

      - name: Run executable HTTP contract tests
        run: |
          PYTHONPATH=apps/api/src uv run pytest -q apps/api/tests/test_api_v1_contract.py
