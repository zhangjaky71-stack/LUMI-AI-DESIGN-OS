name: Release App Shell Lint Fix

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-app-shell-lint-fix.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-app-shell-lint-fix
  cancel-in-progress: true

jobs:
  fix-project-lifecycle:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install JS workspace
        run: pnpm install --frozen-lockfile
      - name: Apply safe App Shell lifecycle fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/web/e2e/canvas-renderer-fallback.spec.ts": [
                  ("      interface FabricObject {}\n", "      type FabricObject = object;\n"),
              ],
              "apps/web/src/components/projects/new-project-dialog.tsx": [
                  (
                      'import { useEffect, useRef, useState } from "react";\n',
                      'import { useRef, useState } from "react";\n',
                  ),
                  (
                      "interface NewProjectDialogProps {\n"
                      "  readonly open: boolean;\n"
                      "  readonly organizationId: string;\n",
                      "interface NewProjectDialogProps {\n"
                      "  readonly organizationId: string;\n",
                  ),
                  (
                      "export function NewProjectDialog({\n"
                      "  open,\n"
                      "  organizationId,\n",
                      "export function NewProjectDialog({\n"
                      "  organizationId,\n",
                  ),
                  (
                      "\n  useEffect(() => {\n"
                      "    if (!open) return;\n"
                      "    setStep(1);\n"
                      "    setIntent(\"\");\n"
                      "    setName(\"\");\n"
                      "    setBrandId(\"\");\n"
                      "    setDeliverables([]);\n"
                      "    setLocale(\"zh-CN\");\n"
                      "    setQualityProfile(\"\");\n"
                      "    setBudget(\"\");\n"
                      "    setReferences([]);\n"
                      "    setError(null);\n"
                      "    setBusy(false);\n"
                      "    setCreated(null);\n"
                      "  }, [open, organizationId]);\n\n"
                      "  if (!open) return null;\n",
                      "\n",
                  ),
              ],
              "apps/web/src/components/projects/projects-dashboard.tsx": [
                  (
                      "  useEffect(() => {\n"
                      "    void load();\n"
                      "  }, [load]);\n",
                      "  useEffect(() => {\n"
                      "    queueMicrotask(() => {\n"
                      "      void load();\n"
                      "    });\n"
                      "  }, [load]);\n",
                  ),
                  (
                      "      <NewProjectDialog\n"
                      "        open={newProjectOpen}\n"
                      "        organizationId={activeOrganization.id}\n"
                      "        bootstrap={bootstrap}\n"
                      "        gateway={gateway}\n"
                      "        onClose={() => setNewProjectOpen(false)}\n"
                      "        onCreated={handleCreated}\n"
                      "      />\n",
                      "      {newProjectOpen ? (\n"
                      "        <NewProjectDialog\n"
                      "          key={activeOrganization.id}\n"
                      "          organizationId={activeOrganization.id}\n"
                      "          bootstrap={bootstrap}\n"
                      "          gateway={gateway}\n"
                      "          onClose={() => setNewProjectOpen(false)}\n"
                      "          onCreated={handleCreated}\n"
                      "        />\n"
                      "      ) : null}\n",
                  ),
              ],
              "apps/web/src/components/projects/project-detail.tsx": [
                  (
                      "  useEffect(() => {\n"
                      "    void load();\n"
                      "  }, [load]);\n",
                      "  useEffect(() => {\n"
                      "    queueMicrotask(() => {\n"
                      "      void load();\n"
                      "    });\n"
                      "  }, [load]);\n",
                  ),
              ],
          }

          for raw_path, edits in replacements.items():
              path = Path(raw_path)
              source = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in source:
                      raise SystemExit(f"expected App Shell target not found: {raw_path}: {old}")
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          PY
      - name: Verify targeted ESLint
        run: |
          pnpm --filter @lumi/web exec eslint \
            e2e/canvas-renderer-fallback.spec.ts \
            src/components/projects/new-project-dialog.tsx \
            src/components/projects/projects-dashboard.tsx \
            src/components/projects/project-detail.tsx \
            --max-warnings=0
      - name: Verify web typecheck
        run: pnpm --filter @lumi/web typecheck
      - name: Self-remove and commit verified App Shell fixes
        run: |
          rm .github/workflows/release-app-shell-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/release-app-shell-lint-fix.yml \
            apps/web/e2e/canvas-renderer-fallback.spec.ts \
            apps/web/src/components/projects/new-project-dialog.tsx \
            apps/web/src/components/projects/projects-dashboard.tsx \
            apps/web/src/components/projects/project-detail.tsx
          git commit -m "fix(app-shell): clean project lifecycle lint boundaries"
          git push origin HEAD:release-closure-p0
