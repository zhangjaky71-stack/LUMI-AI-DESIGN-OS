name: Deploy Staging Infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Staging infrastructure operation"
        required: true
        type: choice
        options:
          - plan-core
          - apply-core
          - plan-migration
          - apply-migration
          - run-migration
          - plan-app
          - apply-app
      apply_ack:
        description: "Required for apply/run operations: APPLY_STAGING"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  OPERATION: ${{ inputs.operation }}
  APPLY_ACK: ${{ inputs.apply_ack }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
  TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_availability_zones: ${{ vars.AWS_AVAILABILITY_ZONES_JSON }}
  TF_VAR_postgres_engine_version: ${{ vars.POSTGRES_ENGINE_VERSION }}
  TF_VAR_redis_engine_version: ${{ vars.REDIS_ENGINE_VERSION }}
  TF_VAR_rabbitmq_engine_version: ${{ vars.RABBITMQ_ENGINE_VERSION }}
  TF_VAR_rabbitmq_instance_type: ${{ vars.RABBITMQ_INSTANCE_TYPE }}
  TF_VAR_redis_auth_token: ${{ secrets.REDIS_AUTH_TOKEN }}
  TF_VAR_rabbitmq_username: ${{ secrets.RABBITMQ_USERNAME }}
  TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
  TF_VAR_core_state_bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
  TF_VAR_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
  TF_VAR_domain_name: ${{ vars.API_DOMAIN_NAME }}
  TF_VAR_hosted_zone_id: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
  TF_VAR_api_image: ${{ vars.API_IMAGE_DIGEST }}
  TF_VAR_agent_runtime_image: ${{ vars.AGENT_RUNTIME_IMAGE_DIGEST }}
  TF_VAR_model_gateway_image: ${{ vars.MODEL_GATEWAY_IMAGE_DIGEST }}
  TF_VAR_tool_gateway_image: ${{ vars.TOOL_GATEWAY_IMAGE_DIGEST }}
  TF_VAR_worker_media_image: ${{ vars.WORKER_MEDIA_IMAGE_DIGEST }}
  TF_VAR_sandbox_runtime_image: ${{ vars.SANDBOX_RUNTIME_IMAGE_DIGEST }}

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: lumi-staging-${{ github.run_id }}
      - name: Require explicit acknowledgement for mutations
        if: contains(inputs.operation, 'apply-') || inputs.operation == 'run-migration'
        run: test "$APPLY_ACK" = "APPLY_STAGING"
      - name: Select Terraform root and state key
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            *-core) ROOT="infra/iac/environments/staging/core"; STATE_KEY="lumi/staging/core/terraform.tfstate" ;;
            *-migration|run-migration) ROOT="infra/iac/environments/staging/migration"; STATE_KEY="lumi/staging/migration/terraform.tfstate" ;;
            *-app) ROOT="infra/iac/environments/staging/app"; STATE_KEY="lumi/staging/app/terraform.tfstate" ;;
            *) echo "unsupported operation" >&2; exit 64 ;;
          esac
          printf 'ROOT=%s\nSTATE_KEY=%s\n' "$ROOT" "$STATE_KEY" >> "$GITHUB_ENV"
      - name: Initialize encrypted remote state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET"
          cat > /tmp/backend.hcl <<EOF
          bucket       = "$TF_STATE_BUCKET"
          key          = "$STATE_KEY"
          region       = "$AWS_REGION"
          encrypt      = true
          use_lockfile = true
          EOF
          terraform -chdir="$ROOT" init -input=false -backend-config=/tmp/backend.hcl
      - name: Terraform plan
        if: startsWith(inputs.operation, 'plan-') || startsWith(inputs.operation, 'apply-')
        run: terraform -chdir="$ROOT" plan -input=false -out=tfplan
      - name: Terraform apply reviewed plan
        if: startsWith(inputs.operation, 'apply-')
        run: terraform -chdir="$ROOT" apply -input=false -auto-approve tfplan
      - name: Run one-shot migration and require exit zero
        if: inputs.operation == 'run-migration'
        run: |
          mkdir -p reports/production-deployments/runtime
          bash scripts/ecs-run-one-shot-task.sh "$ROOT" "staging-${GITHUB_RUN_ID}" reports/production-deployments/runtime/staging-migration.json
      - name: Upload operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-infrastructure-${{ github.run_id }}
          path: reports/production-deployments/runtime/
          if-no-files-found: warn
          retention-days: 30
