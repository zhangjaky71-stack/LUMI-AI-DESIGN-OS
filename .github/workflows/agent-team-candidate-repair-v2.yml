name: Agent Team Candidate Repair V2

on:
  push:
    branches: [release-closure-p0]
    paths:
      - .github/workflows/agent-team-candidate-repair-v2.yml
  pull_request:
    paths:
      - .github/workflows/agent-team-candidate-repair-v2.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"
  PYTHONPATH: apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src:scripts

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Frozen workspace install
        run: uv sync --all-packages --frozen

      - name: Materialize canonical NODE-37 candidate definitions from existing source step
        run: |
          uv run python - <<'PY'
          import subprocess
          from pathlib import Path

          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/agent-team-candidate-repair.yml').read_text(encoding='utf-8')
          )
          jobs = workflow.get('jobs', {})
          steps = jobs.get('repair', {}).get('steps', [])
          matches = [
              step
              for step in steps
              if step.get('name') == 'Materialize canonical NODE-37 candidate definitions'
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f'expected exactly one canonical materialize step, found {len(matches)}'
              )
          script = matches[0].get('run')
          if not isinstance(script, str) or not script.strip():
              raise SystemExit('canonical materialize step has no executable run body')
          subprocess.run(['bash', '-euc', script], check=True)
          PY

      - name: Verify complete candidate file set
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          manifest = json.loads(
              (root / 'config/agent-team/team.v1.json').read_text(encoding='utf-8')
          )
          members = manifest['members']
          if len(members) != 16:
              raise SystemExit(f'expected 16 NODE-37 members, found {len(members)}')
          missing = []
          for member in members:
              agent_id = member['agent_id']
              version = member['version']
              if version != '2.0.0':
                  raise SystemExit(f'unexpected NODE-37 candidate version: {agent_id}={version}')
              for filename in ('agent.yaml', 'system.md'):
                  path = root / 'agents' / agent_id / version / filename
                  if not path.is_file():
                      missing.append(str(path.relative_to(root)))
          if missing:
              raise SystemExit('missing NODE-37 candidate files: ' + ', '.join(missing))
          print('NODE-37 candidate file set: PASS (16 agents / 32 files)')
          PY

      - name: Revalidate upstream Agent runtime contracts
        run: |
          uv run python scripts/validate_agent_registry_contract.py
          uv run python scripts/validate_deep_agents_runtime_contract_v2.py
          uv run python scripts/validate_skill_registry_contract.py
          uv run python scripts/validate_task_graph_contract.py

      - name: Validate NODE-37 static contract
        run: uv run python scripts/validate_agent_team_contract.py

      - name: NODE-37 unit and TaskGraph tests
        run: >-
          uv run pytest
          apps/agent-runtime/tests/test_agent_team.py
          apps/agent-runtime/tests/test_agent_team_flow.py
          apps/agent-runtime/tests/test_agent_team_task_graph.py
          -q

      - name: NODE-37 deterministic E2E
        run: uv run python scripts/integration_agent_team.py

      - name: NODE-37 Ruff gate
        run: >-
          uv run ruff check
          apps/agent-runtime/src/lumi_agent_runtime/agent_team
          apps/agent-runtime/tests/test_agent_team.py
          apps/agent-runtime/tests/test_agent_team_flow.py
          apps/agent-runtime/tests/test_agent_team_task_graph.py
          scripts/integration_agent_team.py
          scripts/validate_agent_team_contract.py

      - name: NODE-37 Pyright gate
        run: >-
          uv run pyright
          apps/agent-runtime/src/lumi_agent_runtime/agent_team
          apps/agent-runtime/tests/test_agent_team.py
          apps/agent-runtime/tests/test_agent_team_flow.py
          apps/agent-runtime/tests/test_agent_team_task_graph.py

      - name: Verify repair diff scope
        run: |
          git status --short
          uv run python - <<'PY'
          import re
          import subprocess

          changed = subprocess.run(
              ['git', 'status', '--porcelain=v1'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          paths = [line[3:] for line in changed if line.strip()]
          pattern = re.compile(r'^agents/[^/]+/2\.0\.0/(agent\.yaml|system\.md)$')
          unexpected = [path for path in paths if not pattern.fullmatch(path)]
          if unexpected:
              raise SystemExit('unexpected repair diff paths: ' + ', '.join(unexpected))
          if len(paths) != 32:
              raise SystemExit(f'expected exactly 32 candidate files, found {len(paths)} changes')
          print('NODE-37 repair diff scope: PASS')
          PY

      - name: Commit validated candidate definitions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/*/2.0.0/agent.yaml agents/*/2.0.0/system.md
          git diff --cached --quiet && { echo "No candidate definitions to commit"; exit 0; }
          git commit -m "feat: materialize NODE-37 candidate definitions [skip ci]"
          git push origin HEAD:release-closure-p0
