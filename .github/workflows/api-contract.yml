name: API Contract

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/api/**"
      - "apps/api/src/lumi_api/app_v1.py"
      - "apps/api/tests/test_api_v1_contract.py"
      - "services/domain/**"
      - "scripts/export_api_v1_contract.py"
      - "scripts/generate_api_v1_client.py"
      - "contracts/api/**"
      - "packages/api-client-v1/**"
      - "apps/api/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen Python install
        run: uv sync --all-packages --frozen
      - name: API v1 contract tests
        run: uv run pytest apps/api/tests/test_api_v1_contract.py -q
      - name: Regenerate canonical OpenAPI
        run: uv run python scripts/export_api_v1_contract.py
      - name: Regenerate TypeScript operation map
        run: uv run python scripts/generate_api_v1_client.py
      - name: Commit canonical generated contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/api/openapi-v1.json packages/api-client-v1/src/generated.ts
          if git diff --cached --quiet; then
            echo "Canonical API contract is already current."
          else
            git commit -m "chore(api): commit canonical v1 contract"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Generated contract must be committed and current
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/api/openapi-v1.json packages/api-client-v1/src/generated.ts
          test -z "$(git status --porcelain -- contracts/api/openapi-v1.json packages/api-client-v1/src/generated.ts)"
