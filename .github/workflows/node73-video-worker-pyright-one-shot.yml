name: NODE-73 Worker Video Pyright Closure

on:
  push:
    branches:
      - release-closure-p0
    paths:
      - .github/workflows/node73-video-worker-pyright-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-worker-video-pyright:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 1

      - name: Apply reviewed test-only typing fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          # Keep separate protocol-shaped publishers: JobPublisher names its argument
          # `dispatch`, while DomainPublisher names it `record`.
          path = root / 'apps/worker-media/tests/test_job_dispatch_observability.py'
          text = path.read_text()
          old = '''class _Publisher:\n    def publish(self, dispatch: object) -> None:\n        del dispatch\n\n\n'''
          new = '''class _Publisher:\n    def publish(self, dispatch: object) -> None:\n        del dispatch\n\n\nclass _DomainPublisher:\n    def publish(self, record: OutboxRecord) -> None:\n        del record\n\n\n'''
          assert text.count(old) == 1, 'publisher fake declaration drifted'
          text = text.replace(old, new, 1)
          old = '        OutboxDispatcher("postgresql://test", _Publisher()).health_snapshot()\n'
          new = '        OutboxDispatcher("postgresql://test", _DomainPublisher()).health_snapshot()\n'
          assert text.count(old) == 1, 'domain publisher fake injection drifted'
          text = text.replace(old, new, 1)
          old = '''    class FailingPublisher:\n        def publish(self, outbox_record: OutboxRecord) -> None:\n            assert outbox_record.event_id == record.event_id\n            raise RuntimeError("broker unavailable")\n'''
          new = '''    expected_event_id = record.event_id\n\n    class FailingPublisher:\n        def publish(self, record: OutboxRecord) -> None:\n            assert record.event_id == expected_event_id\n            raise RuntimeError("broker unavailable")\n'''
          assert text.count(old) == 1, 'failing publisher fake drifted'
          path.write_text(text.replace(old, new, 1))

          # The conflict-guard tests intentionally pass a minimal asyncpg connection
          # fake to private helpers typed against asyncpg.Connection. Make the test
          # boundary explicit without weakening production signatures.
          path = root / 'apps/worker-media/tests/test_video_artifact_conflict_guards.py'
          text = path.read_text()
          old = 'import asyncio\nfrom uuid import uuid4\n\nimport pytest\n'
          new = 'import asyncio\nfrom typing import cast\nfrom uuid import uuid4\n\nimport asyncpg\nimport pytest\n'
          assert text.count(old) == 1, 'artifact imports drifted'
          text = text.replace(old, new, 1)
          for function in ('_ensure_branch', '_ensure_file', '_ensure_provenance', '_ensure_edge'):
              old = f'            await {function}(  # type: ignore[arg-type]\n                connection,\n'
              new = f'            await {function}(\n                cast(asyncpg.Connection, connection),\n'
              assert text.count(old) == 1, f'{function} fake connection call drifted'
              text = text.replace(old, new, 1)
          path.write_text(text)

          # This subclass is deliberately a behavioral fake for cancellation
          # reconciliation; the runtime method body under test never consumes the
          # concrete pipeline/event/output-store types returned by this override.
          path = root / 'apps/worker-media/tests/test_video_cancellation_runtime.py'
          text = path.read_text()
          old = '    def _build_pipeline(self, spec: VideoTaskSpec, repository):\n'
          new = '    def _build_pipeline(self, spec: VideoTaskSpec, repository):  # pyright: ignore[reportIncompatibleMethodOverride]\n'
          assert text.count(old) == 1, 'cancellation fake override drifted'
          path.write_text(text.replace(old, new, 1))

          # Prevent list invariance from narrowing this fake row collection to UUID.
          path = root / 'apps/worker-media/tests/test_video_cost_runtime.py'
          text = path.read_text()
          old = '            rows = [{"organization_id": self.organization_id}]\n'
          new = '            rows: list[dict[str, object]] = [{"organization_id": self.organization_id}]\n'
          assert text.count(old) == 1, 'video cost rows inference drifted'
          path.write_text(text.replace(old, new, 1))

          # execute_video_job intentionally owns the concrete PostgreSQL TaskJobStore
          # production boundary. These unit tests substitute a behavioral in-memory
          # fake, so cast only at the explicit test injection points.
          path = root / 'apps/worker-media/tests/test_video_job_runtime.py'
          text = path.read_text()
          old = 'import asyncio\nfrom datetime import UTC, datetime, timedelta\n'
          new = 'import asyncio\nfrom datetime import UTC, datetime, timedelta\nfrom typing import cast\n'
          assert text.count(old) == 1, 'video job typing import drifted'
          text = text.replace(old, new, 1)
          old = 'from lumi_worker_media.job_runtime import ExternalWait\n'
          new = 'from lumi_worker_media.job_runtime import ExternalWait, TaskJobStore\n'
          assert text.count(old) == 1, 'video job store import drifted'
          text = text.replace(old, new, 1)
          old = '        outcome = await execute_video_job(  # type: ignore[arg-type]\n            store=store,\n'
          new = '        outcome = await execute_video_job(\n            store=cast(TaskJobStore, store),\n'
          assert text.count(old) == 4, 'video job fake store call count drifted'
          path.write_text(text.replace(old, new))
          PY

      - name: Enforce exact diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat <<'EOF'
          apps/worker-media/tests/test_job_dispatch_observability.py
          apps/worker-media/tests/test_video_artifact_conflict_guards.py
          apps/worker-media/tests/test_video_cancellation_runtime.py
          apps/worker-media/tests/test_video_cost_runtime.py
          apps/worker-media/tests/test_video_job_runtime.py
          EOF
          )"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
          python3 -m py_compile \
            apps/worker-media/tests/test_job_dispatch_observability.py \
            apps/worker-media/tests/test_video_artifact_conflict_guards.py \
            apps/worker-media/tests/test_video_cancellation_runtime.py \
            apps/worker-media/tests/test_video_cost_runtime.py \
            apps/worker-media/tests/test_video_job_runtime.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Frozen Python workspace install
        run: uv sync --all-packages --frozen

      - name: Require exact Worker Video Pyright PASS
        shell: bash
        run: |
          uv run pyright \
            apps/worker-media/src/lumi_worker_media/video_*.py \
            apps/worker-media/src/lumi_worker_media/job_dispatch_runtime.py \
            apps/worker-media/tests/test_video_*.py \
            apps/worker-media/tests/test_job_dispatch_observability.py

      - name: Require scoped Ruff PASS
        shell: bash
        run: |
          uv run ruff check --ignore E501 \
            apps/worker-media/tests/test_job_dispatch_observability.py \
            apps/worker-media/tests/test_video_artifact_conflict_guards.py \
            apps/worker-media/tests/test_video_cancellation_runtime.py \
            apps/worker-media/tests/test_video_cost_runtime.py \
            apps/worker-media/tests/test_video_job_runtime.py

      - name: Require Hosted Worker video boundary tests PASS
        shell: bash
        run: >-
          uv run pytest
          apps/worker-media/tests/test_video_*.py
          apps/worker-media/tests/test_job_dispatch_observability.py
          apps/api/tests/test_provider_output_store.py
          -q

      - name: Commit only verified changes on unchanged branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-closure-p0 --depth=1
          test "$(git rev-parse origin/release-closure-p0)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/worker-media/tests/test_job_dispatch_observability.py \
            apps/worker-media/tests/test_video_artifact_conflict_guards.py \
            apps/worker-media/tests/test_video_cancellation_runtime.py \
            apps/worker-media/tests/test_video_cost_runtime.py \
            apps/worker-media/tests/test_video_job_runtime.py
          git commit -m "test(video): close worker strict pyright fakes"
          git push origin HEAD:release-closure-p0
