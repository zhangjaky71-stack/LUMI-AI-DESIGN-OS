name: Production IaC Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-iac-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node73-iac-schema-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 135 && github.event.pull_request.head.ref == 'release-closure-p0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_REF: release-closure-p0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Apply exact four-file NODE-73 schema repair
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "zhangjaky71-stack/LUMI-AI-DESIGN-OS"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test -f docs/release-evidence/NODE-73-IAC-SCHEMA-FIX-TRIGGER.md

          python3 - <<'PY'
          from pathlib import Path
          import re

          def block_span(source: str, marker: str, start_at: int = 0) -> tuple[int, int]:
              start = source.find(marker, start_at)
              if start < 0:
                  raise SystemExit(f"missing marker: {marker}")
              brace = source.find("{", start)
              if brace < 0:
                  raise SystemExit(f"missing opening brace: {marker}")
              depth = 0
              for index in range(brace, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, index + 1
              raise SystemExit(f"unterminated block: {marker}")

          compute_path = Path("infra/iac/modules/compute/main.tf")
          compute = compute_path.read_text(encoding="utf-8")
          deploy_start, deploy_end = block_span(compute, '  dynamic "deployment_configuration" {')
          deploy = compute[deploy_start:deploy_end]
          if deploy.count("alarms {") != 1 or 'dynamic "alarms"' in compute:
              raise SystemExit("compute deployment/alarms schema drift")
          alarms_start, alarms_end = block_span(deploy, "      alarms {")
          deploy_clean = deploy[:alarms_start].rstrip() + "\n" + deploy[alarms_end:]
          dynamic_alarms = '''

  dynamic "alarms" {
    for_each = each.value.publicly_routed ? [1] : []
    content {
      alarm_names = [
        aws_cloudwatch_metric_alarm.public_canary_5xx[each.key].alarm_name,
        aws_cloudwatch_metric_alarm.public_canary_unhealthy[each.key].alarm_name,
      ]
      enable   = true
      rollback = true
    }
  }'''
          compute_path.write_text(
              compute[:deploy_start] + deploy_clean + dynamic_alarms + compute[deploy_end:],
              encoding="utf-8",
          )

          outputs_path = Path("infra/iac/modules/compute/outputs.tf")
          outputs = outputs_path.read_text(encoding="utf-8")
          if 'output "https_listener_arn"' in outputs:
              raise SystemExit("https_listener_arn already exists")
          anchor = '''output "alb_zone_id" {
  value = aws_lb.this.zone_id
}'''
          if outputs.count(anchor) != 1:
              raise SystemExit("alb_zone_id output anchor drift")
          outputs_path.write_text(
              outputs.replace(
                  anchor,
                  anchor + '''

output "https_listener_arn" {
  value = aws_lb_listener.https.arn
}''',
                  1,
              ),
              encoding="utf-8",
          )

          deny_path = Path("infra/iac/modules/platform-app/internal-path-deny.tf")
          deny = deny_path.read_text(encoding="utf-8")
          old_listener = "  listener_arn = aws_lb_listener.https.arn\n"
          if deny.count(old_listener) != 1:
              raise SystemExit("internal listener reference drift")
          deny_path.write_text(
              deny.replace(old_listener, "  listener_arn = module.compute.https_listener_arn\n", 1),
              encoding="utf-8",
          )

          validator_path = Path("scripts/validate_production_iac_contract.py")
          validator = validator_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'''    require_hcl_assignment\(\n        dispatcher,\n        "LUMI_ROLE",\n        '\"outbox-dispatcher\"',\n        f"\{environment\} outbox dispatcher must bind its explicit runtime identity",\n    \)\n'''
          )
          replacement = '''    require(
        re.search(r'\\bLUMI_ROLE\\s*=\\s*"outbox-dispatcher"', dispatcher) is not None,
        f"{environment} outbox dispatcher must bind its explicit runtime identity",
    )
'''
          validator, count = pattern.subn(replacement, validator, count=1)
          if count != 1:
              raise SystemExit(f"outbox role validator drift: replacements={count}")
          validator_path.write_text(validator, encoding="utf-8")
          PY

          terraform fmt \
            infra/iac/modules/compute/main.tf \
            infra/iac/modules/compute/outputs.tf \
            infra/iac/modules/platform-app/internal-path-deny.tf
          terraform fmt -check \
            infra/iac/modules/compute/main.tf \
            infra/iac/modules/compute/outputs.tf \
            infra/iac/modules/platform-app/internal-path-deny.tf
          python3 -m py_compile scripts/validate_production_iac_contract.py
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          expected=(
            infra/iac/modules/compute/main.tf
            infra/iac/modules/compute/outputs.tf
            infra/iac/modules/platform-app/internal-path-deny.tf
            scripts/validate_production_iac_contract.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Commit exact repair if branch head did not move
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          auth_header="AUTHORIZATION: basic $basic"
          git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags origin "+refs/heads/${TARGET_REF}:refs/remotes/origin/${TARGET_REF}"
          test "$(git rev-parse "origin/${TARGET_REF}")" = "$SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            infra/iac/modules/compute/main.tf \
            infra/iac/modules/compute/outputs.tf \
            infra/iac/modules/platform-app/internal-path-deny.tf \
            scripts/validate_production_iac_contract.py
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "fix(iac): bind ECS canary and listener schema"
          git -c http.https://github.com/.extraheader="$auth_header" push origin "HEAD:${TARGET_REF}"

  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate deployment and infrastructure contracts
        run: |
          python3 scripts/validate_node71_decision_artifact.py --self-test
          python3 scripts/validate_production_node71_workflow_contract.py
          python3 scripts/validate_production_deployment_contract.py
          python3 scripts/validate_production_iac_contract.py
          python3 scripts/validate_private_model_gateway_deployment_contract.py
          python3 scripts/validate_outbox_dispatcher_observability.py
          python3 scripts/validate_production_readiness_contract.py
          python3 scripts/validate_capacity_decision_fail_closed.py
          python3 scripts/validate_production_evidence_freezer_contract.py
          python3 scripts/validate_hosted_media_runtime_contract.py
          python3 scripts/validate_capacity_autoscaling_contract.py --self-test
          python3 scripts/validate_release_action_pins.py
          python3 scripts/validate_release_workflow_permissions.py
      - name: Python syntax
        run: |
          python3 -m py_compile \
            scripts/validate_node71_decision_artifact.py \
            scripts/validate_production_node71_workflow_contract.py \
            scripts/production-deployment-gate.py \
            scripts/production-deployment-decision.py \
            scripts/production-rollback-gate.py \
            scripts/production-rollback-rehearsal-decision.py \
            scripts/production-read-only-smoke.py \
            scripts/validate_production_deployment_contract.py \
            scripts/validate_production_iac_contract.py \
            scripts/validate_private_model_gateway_deployment_contract.py \
            scripts/validate_outbox_dispatcher_observability.py \
            scripts/validate_production_readiness_contract.py \
            scripts/validate_capacity_decision_fail_closed.py \
            scripts/validate_production_evidence_freezer_contract.py \
            scripts/validate_hosted_media_runtime_contract.py \
            scripts/validate_capacity_autoscaling_contract.py \
            scripts/validate_release_action_pins.py \
            scripts/validate_release_workflow_permissions.py
      - name: Shell syntax
        run: |
          bash -n scripts/check-aws-secret-versions.sh
          bash -n scripts/create-predeploy-rds-snapshot.sh
          bash -n scripts/ecs-run-one-shot-task.sh
          bash -n scripts/capture-ecs-deployment-state.sh
          bash -n scripts/capture-production-runtime-identity.sh
          bash -n scripts/capture-production-rollout-evidence.sh
      - name: Deployment manifest JSON syntax
        run: |
          python3 -m json.tool production/deployment/manifest-template.json >/dev/null
          python3 -m json.tool production/release-actions/pins-v1.json >/dev/null

  terraform-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive infra/iac
      - name: Terraform validate roots without backend or AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          roots=(
            infra/iac/bootstrap
            infra/iac/environments/staging/core
            infra/iac/environments/staging/migration
            infra/iac/environments/staging/app
            infra/iac/environments/production/core
            infra/iac/environments/production/migration
            infra/iac/environments/production/app
          )
          for root in "${roots[@]}"; do
            echo "==> $root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  contract-gate:
    if: always()
    needs: [source-contract, terraform-static]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and Terraform validation
        run: |
          test "${{ needs.source-contract.result }}" = "success"
          test "${{ needs.terraform-static.result }}" = "success"
