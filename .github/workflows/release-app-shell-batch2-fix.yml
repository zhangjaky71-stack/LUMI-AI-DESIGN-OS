name: Release App Shell Batch 2 Fix

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-app-shell-batch2-fix.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-app-shell-batch2-fix
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install frozen JS workspace
        run: pnpm install --frozen-lockfile
      - name: Apply auditable batch 2 patch
        run: |
          python3 scripts/release_app_shell_batch2_fix.py
          python3 - <<'PY'
          from pathlib import Path

          export_ui = Path("apps/web/src/components/export-ui/export-ui.tsx")
          source = export_ui.read_text(encoding="utf-8")
          residue = "  ExportSourceOption,\n"
          if source.count(residue) != 1:
              raise SystemExit(
                  f"expected exactly one ExportSourceOption import residue, found {source.count(residue)}"
              )
          export_ui.write_text(source.replace(residue, "", 1), encoding="utf-8")

          versions = Path("apps/web/src/components/versions-ui/versions-ui.tsx")
          source = versions.read_text(encoding="utf-8")
          nullable_head_calls = (
              "      chooseCompareTo(next.head_version_id);\n"
              "      chooseProvenance(next.head_version_id);\n"
          )
          guarded_head_calls = (
              "      if (next.head_version_id) {\n"
              "        chooseCompareTo(next.head_version_id);\n"
              "        chooseProvenance(next.head_version_id);\n"
              "      }\n"
          )
          if source.count(nullable_head_calls) != 1:
              raise SystemExit(
                  "expected exactly one nullable head-version call pair, "
                  f"found {source.count(nullable_head_calls)}"
              )
          versions.write_text(
              source.replace(nullable_head_calls, guarded_head_calls, 1),
              encoding="utf-8",
          )

          vitest = Path("apps/web/vitest.config.ts")
          expected = '''import { defineConfig } from "vitest/config";\n\nexport default defineConfig({\n  test: {\n    include: ["src/**/*.{test,spec}.{ts,tsx}"],\n  },\n});\n'''
          replacement = '''import { fileURLToPath, URL } from "node:url";\nimport { defineConfig } from "vitest/config";\n\nexport default defineConfig({\n  resolve: {\n    alias: {\n      "@": fileURLToPath(new URL("./src", import.meta.url)),\n      "@lumi/artifact-sdk": fileURLToPath(\n        new URL("../../packages/artifact-sdk/src/index.ts", import.meta.url),\n      ),\n      "@lumi/brand-rules": fileURLToPath(\n        new URL("../../packages/brand-rules/src/index.ts", import.meta.url),\n      ),\n      "@lumi/canvas-sdk": fileURLToPath(\n        new URL("../../packages/canvas-sdk/src/index.ts", import.meta.url),\n      ),\n      "@lumi/design-ir": fileURLToPath(\n        new URL("../../packages/design-ir/src/index.ts", import.meta.url),\n      ),\n    },\n  },\n  test: {\n    include: ["src/**/*.{test,spec}.{ts,tsx}"],\n  },\n});\n'''
          source = vitest.read_text(encoding="utf-8")
          if source != expected:
              raise SystemExit("unexpected apps/web/vitest.config.ts baseline")
          vitest.write_text(replacement, encoding="utf-8")
          PY
      - name: Verify targeted ESLint
        run: |
          pnpm --filter @lumi/web exec eslint \
            src/components/ai-workspace/ai-workspace.tsx \
            src/components/brand-kit/brand-kit.tsx \
            src/components/export-ui/export-ui.tsx \
            src/components/versions-ui/versions-ui.tsx \
            src/lib/admin-console/admin-gateway.ts \
            src/lib/approval-ui/contracts.test.ts \
            vitest.config.ts \
            --max-warnings=0
      - name: Verify Web typecheck
        run: pnpm --filter @lumi/web typecheck
      - name: Verify batch 2 regression units
        run: |
          pnpm --filter @lumi/web exec vitest run \
            src/lib/ai-workspace \
            src/lib/brand-kit \
            src/lib/export-ui \
            src/lib/versions-ui \
            src/lib/admin-console \
            src/lib/approval-ui \
            src/lib/app-shell/api-client.test.ts \
            src/lib/app-shell/query-cache.test.ts
      - name: Commit verified batch 2 and self-remove
        run: |
          rm .github/workflows/release-app-shell-batch2-fix.yml
          rm scripts/release_app_shell_batch2_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/release-app-shell-batch2-fix.yml \
            scripts/release_app_shell_batch2_fix.py \
            apps/web/vitest.config.ts \
            apps/web/src/components/ai-workspace/ai-workspace.tsx \
            apps/web/src/components/brand-kit/brand-kit.tsx \
            apps/web/src/components/export-ui/export-ui.tsx \
            apps/web/src/components/versions-ui/versions-ui.tsx \
            apps/web/src/lib/admin-console/admin-gateway.ts \
            apps/web/src/lib/approval-ui/contracts.test.ts
          git commit -m "fix(app-shell): close React 19 batch 2 lint backlog"
          git push origin HEAD:release-closure-p0
