name: MCP Integration Security

on:
  pull_request:
    paths:
      - "services/tool-gateway/src/lumi_tool_gateway/mcp/**"
      - "services/tool-gateway/tests/test_mcp_*.py"
      - "scripts/validate_mcp_integration_contract.py"
      - "scripts/integration_mcp_tool_gateway.py"
      - "docs/runtime/MCP-INTEGRATION-V1.md"
      - "reports/nodes/NODE-26/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile MCP integration
        run: |
          PYTHONPATH=services/tool-gateway/src python -m compileall -q \
            services/tool-gateway/src/lumi_tool_gateway/mcp \
            services/tool-gateway/tests \
            scripts/validate_mcp_integration_contract.py \
            scripts/integration_mcp_tool_gateway.py
      - name: MCP architecture and security contract
        run: >-
          PYTHONPATH=services/tool-gateway/src
          python scripts/validate_mcp_integration_contract.py

  mcp-security:
    needs: mcp-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Revalidate NODE-25 Tool Gateway boundary
        run: >-
          PYTHONPATH=services/tool-gateway/src
          python scripts/validate_tool_gateway_contract.py
      - name: Tool Gateway and MCP deterministic tests
        run: >-
          PYTHONPATH=services/tool-gateway/src
          python -m unittest discover
          -s services/tool-gateway/tests
          -p 'test_*.py'
      - name: MCP to Tool Gateway integration
        run: >-
          PYTHONPATH=services/tool-gateway/src
          python scripts/integration_mcp_tool_gateway.py

  mcp-quality:
    needs: mcp-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: MCP Ruff gate
        run: >-
          uv run ruff check
          services/tool-gateway/src/lumi_tool_gateway/mcp
          services/tool-gateway/tests/test_mcp_modern.py
          services/tool-gateway/tests/test_mcp_legacy.py
          services/tool-gateway/tests/test_mcp_mapping_cache.py
          services/tool-gateway/tests/test_mcp_error_sanitization.py
          scripts/validate_mcp_integration_contract.py
          scripts/integration_mcp_tool_gateway.py
      - name: MCP Pyright gate
        run: >-
          uv run pyright
          services/tool-gateway/src/lumi_tool_gateway/mcp
          services/tool-gateway/tests/test_mcp_modern.py
          services/tool-gateway/tests/test_mcp_legacy.py
          services/tool-gateway/tests/test_mcp_mapping_cache.py
          services/tool-gateway/tests/test_mcp_error_sanitization.py
          scripts/integration_mcp_tool_gateway.py
