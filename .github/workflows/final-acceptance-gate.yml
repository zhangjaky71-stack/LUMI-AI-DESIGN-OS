name: Final Product Acceptance Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_manifest_path:
        description: "Frozen release-manifest.json under reports/final-acceptance/<release>/"
        required: false
        type: string
      acceptance_evidence_path:
        description: "Frozen acceptance-evidence.json under reports/final-acceptance/<release>/"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: final-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_MANIFEST_INPUT: ${{ inputs.release_manifest_path }}
  ACCEPTANCE_EVIDENCE_INPUT: ${{ inputs.acceptance_evidence_path }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate final acceptance contracts
        run: |
          python3 scripts/validate_final_acceptance_contract.py
          python3 scripts/validate_security_release_decision_contract.py
          python3 scripts/validate_final_acceptance_assembler_contract.py
          python3 scripts/validate_repository_governance_contract.py
          python3 scripts/validate_api_provenance_source_manifest.py
          python3 scripts/validate_image_generation_producer_contract.py
          python3 scripts/runtime_image_set.py validate-manifest
          python3 scripts/verify_runtime_image_attestations.py --self-test
          python3 scripts/validate_runtime_image_build_pipeline.py
          python3 scripts/validate_runtime_image_set_contract.py
          python3 scripts/validate_staging_runtime_image_binding.py --self-test
          python3 scripts/validate_staging_runtime_image_workflow_contract.py
          python3 scripts/validate_node71_decision_artifact.py --self-test
          python3 scripts/validate_production_node71_workflow_contract.py
          python3 scripts/validate_production_deployment_contract.py
          python3 scripts/validate_release_action_pins.py
          python3 scripts/validate_release_workflow_permissions.py
          python3 scripts/validate_uv_lock_regeneration_contract.py
          python3 scripts/validate_side_effect_control_provenance.py --self-test
          python3 scripts/validate_tool_audit_provenance.py --self-test
          python3 scripts/validate_tool_approval_provenance.py --self-test
          python3 scripts/validate_tool_data_provenance.py --self-test
          python3 scripts/validate_tool_result_offload_provenance.py --self-test
      - name: Validate JSON and Python syntax
        run: |
          python3 -m json.tool final/acceptance/manifest-v1.json >/dev/null
          python3 -m json.tool final/acceptance/release-manifest-template.json >/dev/null
          python3 -m json.tool final/acceptance/upstream-decision-template.json >/dev/null
          python3 -m json.tool production/runtime-images/manifest-v1.json >/dev/null
          python3 -m json.tool production/deployment/manifest-template.json >/dev/null
          python3 -m json.tool production/release-actions/pins-v1.json >/dev/null
          python3 -m json.tool staging/acceptance/api-provenance-sources-v1.json >/dev/null
          python3 -m py_compile \
            scripts/final-acceptance-gate.py \
            scripts/create-final-acceptance-evidence.py \
            scripts/final-acceptance-assembler.py \
            scripts/validate_final_acceptance_package.py \
            scripts/capture_release_branch_protection.py \
            scripts/validate_repository_governance_contract.py \
            scripts/security-release-decision.py \
            scripts/validate_security_release_decision_contract.py \
            scripts/validate_final_acceptance_assembler_contract.py \
            scripts/validate_final_acceptance_contract.py \
            scripts/validate_api_provenance_source_manifest.py \
            scripts/validate_image_generation_producer_contract.py \
            scripts/runtime_image_set.py \
            scripts/verify_runtime_image_attestations.py \
            scripts/validate_runtime_image_build_pipeline.py \
            scripts/validate_runtime_image_set_contract.py \
            scripts/validate_staging_runtime_image_binding.py \
            scripts/validate_staging_runtime_image_workflow_contract.py \
            scripts/validate_node71_decision_artifact.py \
            scripts/validate_production_node71_workflow_contract.py \
            scripts/production-deployment-gate.py \
            scripts/validate_production_deployment_contract.py \
            scripts/validate_release_action_pins.py \
            scripts/validate_release_workflow_permissions.py \
            scripts/validate_uv_lock_regeneration_contract.py \
            scripts/validate_side_effect_control_provenance.py \
            scripts/validate_tool_audit_provenance.py \
            scripts/validate_tool_approval_provenance.py \
            scripts/validate_tool_data_provenance.py \
            scripts/validate_tool_result_offload_provenance.py \
            scripts/validate_uv_workspace_lock.py

  canonical-lock-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Require exact workspace membership in uv.lock
        run: python3 scripts/validate_uv_workspace_lock.py
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Require canonical lock freshness
        run: uv lock --check
      - name: Require canonical frozen dependency graph for every workspace package
        run: uv sync --all-packages --frozen

  final-decision:
    if: github.event_name == 'workflow_dispatch' && inputs.release_manifest_path != '' && inputs.acceptance_evidence_path != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_GOVERNANCE_TOKEN: ${{ secrets.RELEASE_GOVERNANCE_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Resolve and constrain frozen acceptance paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          allowed = (root / 'reports' / 'final-acceptance').resolve()
          release = (root / os.environ['RELEASE_MANIFEST_INPUT']).resolve()
          evidence = (root / os.environ['ACCEPTANCE_EVIDENCE_INPUT']).resolve()
          try:
              release.relative_to(allowed)
              evidence.relative_to(allowed)
          except ValueError as exc:
              raise SystemExit('final acceptance input escapes reports/final-acceptance/') from exc
          if release.name != 'release-manifest.json' or evidence.name != 'acceptance-evidence.json':
              raise SystemExit('expected release-manifest.json and acceptance-evidence.json')
          if not release.is_file() or not evidence.is_file():
              raise SystemExit('final acceptance input file is missing')
          if release.parent != evidence.parent:
              raise SystemExit('release manifest and acceptance evidence must be in the same release directory')
          output = release.parent / 'final-decision.json'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'FINAL_RELEASE={release.relative_to(root).as_posix()}\n')
              fh.write(f'FINAL_EVIDENCE={evidence.relative_to(root).as_posix()}\n')
              fh.write(f'FINAL_OUTPUT={output.relative_to(root).as_posix()}\n')
          PY
      - name: Require canonical assembled and frozen package
        run: python3 scripts/validate_final_acceptance_package.py --release "$FINAL_RELEASE"
      - name: Re-verify live strong repository governance for frozen RC
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_GOVERNANCE_TOKEN"
          rc_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["release_candidate"]["git_sha"])' "$FINAL_RELEASE")"
          mkdir -p reports/final-acceptance/runtime
          python3 scripts/capture_release_branch_protection.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-release-sha "$rc_sha" \
            --output reports/final-acceptance/runtime/repository-governance-live.json
      - name: Evaluate final product acceptance
        run: |
          python3 scripts/final-acceptance-gate.py \
            --release "$FINAL_RELEASE" \
            --evidence "$FINAL_EVIDENCE" \
            --output "$FINAL_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: final-acceptance-${{ github.run_id }}
          path: |
            reports/final-acceptance/**/final-decision.json
            reports/final-acceptance/runtime/repository-governance-live.json
          if-no-files-found: error
          retention-days: 180

  contract-gate:
    if: always()
    needs: [source-contract, canonical-lock-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source contract and canonical dependency graph
        run: |
          test "${{ needs.source-contract.result }}" = "success"
          test "${{ needs.canonical-lock-gate.result }}" = "success"
