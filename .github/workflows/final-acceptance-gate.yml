name: Final Product Acceptance Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_manifest_path:
        description: "Frozen release-manifest.json under reports/final-acceptance/<release>/"
        required: false
        type: string
      acceptance_evidence_path:
        description: "Frozen acceptance-evidence.json under reports/final-acceptance/<release>/"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: final-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_MANIFEST_INPUT: ${{ inputs.release_manifest_path }}
  ACCEPTANCE_EVIDENCE_INPUT: ${{ inputs.acceptance_evidence_path }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate final acceptance contract
        run: python3 scripts/validate_final_acceptance_contract.py
      - name: Validate structured manual evidence contract
        run: python3 scripts/validate_final_manual_evidence_contract.py
      - name: Validate final browser preflight contract
        run: python3 scripts/validate_final_browser_preflight.py
      - name: Validate upstream canonical lock contract
        run: python3 scripts/validate_final_upstream_lock_contract.py
      - name: Validate final runner checkout binding
        run: python3 scripts/validate_final_runner_checkout_binding.py
      - name: Validate canonical lock helper shell syntax
        run: bash -n scripts/regenerate-root-uv-lock.sh
      - name: Validate JSON and Python syntax
        run: |
          python3 -m json.tool final/acceptance/manifest-v1.json >/dev/null
          python3 -m json.tool final/acceptance/release-manifest-template.json >/dev/null
          python3 -m json.tool final/acceptance/signoff-record-template.json >/dev/null
          python3 -m json.tool final/acceptance/manual-evidence-record-template.json >/dev/null
          python3 -m json.tool final/acceptance/upstream-decision-template.json >/dev/null
          python3 -m py_compile \
            scripts/run-final-acceptance.py \
            scripts/final-acceptance-gate.py \
            scripts/final-manual-evidence-gate.py \
            scripts/create-final-acceptance-evidence.py \
            scripts/validate_final_acceptance_contract.py \
            scripts/validate_final_manual_evidence_contract.py \
            scripts/validate_final_browser_preflight.py \
            scripts/validate_final_upstream_lock_contract.py \
            scripts/validate_final_runner_checkout_binding.py

  lock-repair-artifact:
    # Repair assistance only. This job never mutates the branch and never satisfies
    # canonical-lock-gate by itself. It emits the exact uv.lock produced/validated
    # by canonical Python/uv tooling so the generated lock can be reviewed and committed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Detect stale root lock
        id: lock_state
        shell: bash
        run: |
          set -euo pipefail
          if uv lock --check; then
            echo "needs_repair=false" >> "$GITHUB_OUTPUT"
            echo "ROOT_UV_LOCK_ALREADY_CURRENT"
          else
            echo "needs_repair=true" >> "$GITHUB_OUTPUT"
            echo "ROOT_UV_LOCK_REPAIR_REQUIRED"
          fi
      - name: Regenerate stale root lock with canonical guard
        if: steps.lock_state.outputs.needs_repair == 'true'
        run: bash scripts/regenerate-root-uv-lock.sh
      - name: Validate current root lock
        if: steps.lock_state.outputs.needs_repair != 'true'
        run: |
          uv lock --check
          uv sync --all-packages --frozen
      - name: Build review artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/root-uv-lock
          cp uv.lock artifacts/root-uv-lock/uv.lock
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "python=$(python --version 2>&1)"
            echo "uv=$(uv --version 2>&1)"
            echo "repair_required=${{ steps.lock_state.outputs.needs_repair }}"
            echo "uv_lock_sha256=$(sha256sum uv.lock | awk '{print $1}')"
          } > artifacts/root-uv-lock/metadata.txt
          git diff --exit-code -- . ':!uv.lock'
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-root-uv-lock-${{ github.run_id }}
          path: artifacts/root-uv-lock/
          if-no-files-found: error
          retention-days: 30

  canonical-lock-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Require canonical frozen dependency graph
        run: uv sync --all-packages --frozen

  final-decision:
    if: github.event_name == 'workflow_dispatch' && inputs.release_manifest_path != '' && inputs.acceptance_evidence_path != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The canonical runner proves source-RC ancestry and inspects every path
          # changed from source RC to evidence checkout. A shallow clone cannot
          # establish that evidence-only descendant invariant.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve and constrain frozen acceptance paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          allowed = (root / 'reports' / 'final-acceptance').resolve()
          release = (root / os.environ['RELEASE_MANIFEST_INPUT']).resolve()
          evidence = (root / os.environ['ACCEPTANCE_EVIDENCE_INPUT']).resolve()
          try:
              release.relative_to(allowed)
              evidence.relative_to(allowed)
          except ValueError as exc:
              raise SystemExit('final acceptance input escapes reports/final-acceptance/') from exc
          if release.name != 'release-manifest.json' or evidence.name != 'acceptance-evidence.json':
              raise SystemExit('expected release-manifest.json and acceptance-evidence.json')
          if not release.is_file() or not evidence.is_file():
              raise SystemExit('final acceptance input file is missing')
          if release.parent != evidence.parent:
              raise SystemExit('release manifest and acceptance evidence must be in the same release directory')
          manual_output = release.parent / 'manual-evidence-decision.json'
          output = release.parent / 'final-decision.json'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'FINAL_RELEASE={release.relative_to(root).as_posix()}\n')
              fh.write(f'FINAL_EVIDENCE={evidence.relative_to(root).as_posix()}\n')
              fh.write(f'FINAL_MANUAL_OUTPUT={manual_output.relative_to(root).as_posix()}\n')
              fh.write(f'FINAL_OUTPUT={output.relative_to(root).as_posix()}\n')
          PY
      - name: Evaluate canonical final product acceptance
        run: |
          python3 scripts/run-final-acceptance.py \
            --release "$FINAL_RELEASE" \
            --evidence "$FINAL_EVIDENCE" \
            --manual-output "$FINAL_MANUAL_OUTPUT" \
            --output "$FINAL_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-acceptance-${{ github.run_id }}
          path: |
            reports/final-acceptance/**/manual-evidence-decision.json
            reports/final-acceptance/**/final-decision.json
          if-no-files-found: warn
          retention-days: 180

  contract-gate:
    if: always()
    needs: [source-contract, canonical-lock-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source contract and canonical dependency graph
        run: |
          test "${{ needs.source-contract.result }}" = "success"
          test "${{ needs.canonical-lock-gate.result }}" = "success"
