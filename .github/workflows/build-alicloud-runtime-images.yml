name: Build Alibaba Cloud Runtime Images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ALICLOUD_REGION: cn-hangzhou
  ALICLOUD_OIDC_PROVIDER_ARN: acs:ram::1153410507483251:oidc-provider/lumi-github-actions
  ALICLOUD_ACR_ROLE_ARN: acs:ram::1153410507483251:role/lumi-github-acr-push
  ACR_REGISTRY: crpi-5765pzu53bg0a9z6.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: lumistaging3251
  UV_BASE_TAG: ghcr.io/astral-sh/uv:0.11.28
  PYTHON_BASE_TAG: python:3.12-slim

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: agent-runtime
            dockerfile: apps/agent-runtime/Dockerfile
          - service: model-gateway
            dockerfile: services/model-gateway/Dockerfile
          - service: tool-gateway
            dockerfile: services/tool-gateway/Dockerfile
          - service: worker-media
            dockerfile: apps/worker-media/Dockerfile
          - service: sandbox-runtime
            dockerfile: services/sandbox-runtime/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Require exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Configure short-lived Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          oidc-provider-arn: ${{ env.ALICLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.ALICLOUD_ACR_ROLE_ARN }}
          role-session-name: lumi-acr-${{ github.run_id }}-${{ matrix.service }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Set up Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1
        with:
          version: 3.4.11

      - name: Log in to ACR with a temporary token
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t acr_credentials < <(
            aliyun --region "$ALICLOUD_REGION" \
              cr GET /tokens \
              --version 2016-06-07 \
              --force |
              python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; print(d["tempUserName"]); print(d["authorizationToken"])'
          )
          test "${#acr_credentials[@]}" -eq 2
          acr_username="${acr_credentials[0]}"
          acr_password="${acr_credentials[1]}"
          test -n "$acr_username"
          test -n "$acr_password"
          echo "::add-mask::$acr_username"
          echo "::add-mask::$acr_password"
          printf '%s' "$acr_password" | docker login "$ACR_REGISTRY" --username "$acr_username" --password-stdin
          unset acr_password acr_username acr_credentials

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve immutable base image digests
        shell: bash
        run: |
          set -euo pipefail
          resolve_digest() {
            local image="$1"
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' \
              | python3 -c 'import json,re,sys; d=json.load(sys.stdin).get("digest", ""); assert re.fullmatch(r"sha256:[0-9a-f]{64}", d), d; print(d)'
          }
          uv_digest="$(resolve_digest "$UV_BASE_TAG")"
          python_digest="$(resolve_digest "$PYTHON_BASE_TAG")"
          echo "UV_BASE_IMAGE=ghcr.io/astral-sh/uv@${uv_digest}" >> "$GITHUB_ENV"
          echo "PYTHON_BASE_IMAGE=python@${python_digest}" >> "$GITHUB_ENV"

      - name: Build and push immutable runtime
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.service }}:git-${{ github.sha }}
          build-args: |
            UV_BASE_IMAGE=${{ env.UV_BASE_IMAGE }}
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
          provenance: mode=max,version=v0.2
          sbom: true
          cache-from: type=gha,scope=lumi-alicloud-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=lumi-alicloud-${{ matrix.service }}

      - name: Freeze image digest fragment
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os,pathlib,re; d=os.environ["DIGEST"]; assert re.fullmatch(r"sha256:[0-9a-f]{64}", d), d; s=os.environ["SERVICE"]; registry=os.environ["ACR_REGISTRY"]; namespace=os.environ["ACR_NAMESPACE"]; image=f"{registry}/{namespace}/{s}@{d}"; pathlib.Path("image-fragment.json").write_text(json.dumps({"service":s,"image":image,"git_sha":os.environ["GITHUB_SHA"]},sort_keys=True)+"\n",encoding="utf-8")'

      - name: Upload image digest fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alicloud-image-${{ matrix.service }}-${{ github.sha }}
          path: image-fragment.json
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all digest fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: alicloud-image-*-${{ github.sha }}
          path: fragments

      - name: Assemble exact six-image manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json,pathlib,re,os; rows=[json.loads(p.read_text()) for p in pathlib.Path("fragments").rglob("image-fragment.json")]; images={r["service"]:r["image"] for r in rows}; expected={"api","agent-runtime","model-gateway","tool-gateway","worker-media","sandbox-runtime"}; assert set(images)==expected,(set(images),expected); assert all(re.fullmatch(r"[^@]+@sha256:[0-9a-f]{64}",v) for v in images.values()); pathlib.Path("alicloud-runtime-images.json").write_text(json.dumps({"schema_version":1,"git_sha":os.environ["GITHUB_SHA"],"images":images},indent=2,sort_keys=True)+"\n",encoding="utf-8")'
          python3 -m json.tool alicloud-runtime-images.json

      - name: Upload frozen Alibaba Cloud image set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alicloud-runtime-images-${{ github.sha }}
          path: alicloud-runtime-images.json
          if-no-files-found: error
          retention-days: 90
