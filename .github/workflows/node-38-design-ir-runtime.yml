name: NODE-38 Design IR Runtime

on:
  pull_request:
    paths:
      - "packages/design-ir/**"
      - "packages-py/design_ir/**"
      - "packages-py/tests/test_design_ir_node38.py"
      - "docs/runtime/DESIGN-IR-RUNTIME-V1.md"
      - "reports/nodes/NODE-38/**"
      - "tools/node38/**"
      - ".github/workflows/node-38-design-ir-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.4.0"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  design-ir-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install frozen JS workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck Design IR TypeScript runtime
        run: pnpm --filter @lumi/design-ir typecheck

      - name: Test Design IR TypeScript runtime
        run: pnpm --filter @lumi/design-ir test

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen Python workspace
        run: uv sync --all-packages --frozen

      - name: Validate NODE-38 static contract
        run: PYTHONPATH=packages-py uv run python tools/node38/validate_design_ir_runtime.py

      - name: Test Python conformance runtime
        run: PYTHONPATH=packages-py uv run pytest -q packages-py/tests/test_design_ir_node38.py

      - name: Parse gap ledger
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          ledger = json.loads(
              Path("reports/nodes/NODE-38/gap-ledger.json").read_text(encoding="utf-8")
          )
          assert ledger["node"] == "NODE-38"
          assert len(ledger["gaps"]) == 5
          print("NODE38_GAP_LEDGER_PARSE_PASS")
          PY

      - name: Ruff
        run: |
          uv run ruff check \
            packages-py/design_ir \
            packages-py/tests/test_design_ir_node38.py \
            tools/node38

      - name: Pyright
        run: |
          uv run pyright \
            packages-py/design_ir \
            packages-py/tests/test_design_ir_node38.py \
            tools/node38
