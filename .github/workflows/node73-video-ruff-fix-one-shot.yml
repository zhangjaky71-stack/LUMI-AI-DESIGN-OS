name: NODE-73 Video Ruff Residual Fix One Shot

on:
  push:
    branches:
      - release-closure-p0
    paths:
      - ".github/workflows/node73-video-ruff-fix-one-shot.yml"

permissions:
  contents: write

jobs:
  scoped-residual-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Apply reviewed residual Video Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --ignore E501 --select SIM105,SIM117 --fix --unsafe-fixes \
            apps/worker-media/src/lumi_worker_media/event_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_final_probe_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_generation_ports.py \
            apps/worker-media/src/lumi_worker_media/video_sandbox_runtime.py || true
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/worker-media/src/lumi_worker_media/app.py")
          text = path.read_text()
          old = "        raise retry(exc=exc, countdown=countdown)\n"
          new = "        raise retry(exc=exc, countdown=countdown) from exc\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Celery asset retry raise to patch")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          python - <<'PY'
          import subprocess

          allowed = {
              "apps/worker-media/src/lumi_worker_media/app.py",
              "apps/worker-media/src/lumi_worker_media/event_runtime.py",
              "apps/worker-media/src/lumi_worker_media/video_final_probe_runtime.py",
              "apps/worker-media/src/lumi_worker_media/video_generation_ports.py",
              "apps/worker-media/src/lumi_worker_media/video_sandbox_runtime.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected residual fix paths: {unexpected}")
          print(f"residual-fix changed {len(changed)} reviewed files")
          PY
      - name: Report full scoped Ruff result
        shell: bash
        run: |
          uv run ruff check --ignore E501 \
            services/video-generation/src \
            services/video-generation/tests \
            apps/worker-media/src/lumi_worker_media/app.py \
            apps/worker-media/src/lumi_worker_media/cli.py \
            apps/worker-media/src/lumi_worker_media/job_dispatch_runtime.py \
            apps/worker-media/src/lumi_worker_media/event_runtime.py \
            apps/worker-media/src/lumi_worker_media/external_wait_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_*.py \
            apps/worker-media/tests/test_video_*.py \
            apps/worker-media/tests/test_job_dispatch_observability.py \
            apps/worker-media/tests/integration/test_video_*.py \
            apps/api/src/lumi_api/generations/gateway.py \
            apps/api/src/lumi_api/generations/video_service.py \
            apps/api/src/lumi_api/media_dispatch.py \
            apps/api/src/lumi_api/provider_output_store.py \
            apps/api/tests/integration/test_video_generation_control_plane_postgres.py \
            apps/api/tests/integration/test_video_outbox_dispatch_postgres.py \
            apps/api/tests/test_provider_output_store.py \
            scripts/validate_video_generation.py \
            scripts/validate_video_generation_producer_binding.py \
            scripts/validate_video_worker_hosted_binding.py \
            scripts/validate_video_cancellation_contract.py \
            scripts/validate_video_final_probe_binding.py \
            scripts/validate_outbox_dispatcher_observability.py \
            scripts/benchmark_video_generation.py || true
      - name: Commit reviewed residual fixes if branch head is unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No residual changes to commit."
            exit 0
          fi
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_sha="$(git ls-remote "$remote_url" refs/heads/release-closure-p0 | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --update
          git commit -m "style(video): close scoped ruff residuals"
          git push "$remote_url" HEAD:release-closure-p0
