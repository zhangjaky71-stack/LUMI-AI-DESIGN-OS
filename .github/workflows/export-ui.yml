name: Export UI

on:
  pull_request:
    paths:
      - "apps/web/src/app/app/projects/**/export/**"
      - "apps/web/src/app/app/projects/**/page.tsx"
      - "apps/web/src/components/export-ui/**"
      - "apps/web/src/lib/export-ui/**"
      - "apps/web/e2e/export-ui.spec.ts"
      - "packages/artifact-sdk/src/export-**"
      - "scripts/validate_export_ui.py"
      - "scripts/validate_export_engine.py"
      - "docs/nodes/NODE-60-EXPORT-UI.md"
      - "docs/runtime/EXPORT-UI-V1.md"
      - "reports/nodes/NODE-60/**"
      - ".github/workflows/export-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-ui-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Validate architecture chain through NODE-60
        run: |
          python scripts/validate_app_shell.py
          python scripts/validate_projects_ui.py
          python scripts/validate_ai_workspace.py
          python scripts/validate_infinite_canvas.py
          python scripts/validate_layers_inspector.py
          python scripts/validate_agent_timeline.py
          python scripts/validate_brand_kit_ui.py
          python scripts/validate_versions_ui.py
          python scripts/validate_export_engine.py
          python scripts/validate_export_ui.py
      - name: Typecheck canonical stack
        run: |
          pnpm --filter @lumi/artifact-sdk typecheck
          pnpm --filter @lumi/design-ir typecheck
          pnpm --filter @lumi/canvas-sdk typecheck
          pnpm --filter @lumi/web typecheck

  export-ui-quality:
    needs: export-ui-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Run NODE-49 canonical Export Engine regressions
        run: pnpm --filter @lumi/artifact-sdk exec vitest run src/export-engine-v1.test.ts src/export-source-adapter.test.ts src/export-artifact-adapter.test.ts src/export-package.test.ts
      - name: Run NODE-60 units
        run: pnpm --filter @lumi/web exec vitest run src/lib/export-ui
      - name: Run frontend regression units
        run: |
          pnpm --filter @lumi/web exec vitest run src/lib/versions-ui
          pnpm --filter @lumi/web exec vitest run src/lib/brand-kit
          pnpm --filter @lumi/web exec vitest run src/lib/agent-timeline
      - name: Lint web product
        run: pnpm --filter @lumi/web lint

  export-ui-build:
    needs: export-ui-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      LUMI_SHELL_E2E_AUTH: "0"
      LUMI_PROJECTS_E2E: "0"
      LUMI_AI_WORKSPACE_E2E: "0"
      LUMI_INFINITE_CANVAS_E2E: "0"
      LUMI_BRAND_KIT_E2E: "0"
      LUMI_VERSIONS_E2E: "0"
      LUMI_EXPORT_UI_E2E: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build production Next.js app
        run: pnpm --filter @lumi/web build
      - name: Assert deterministic export fixture is absent from client chunks
        run: |
          if grep -R --line-number --fixed-strings 'export-e2e-ready-file' apps/web/.next/static 2>/dev/null; then
            echo 'NODE-60 deterministic fixture leaked into production client chunks.' >&2
            exit 1
          fi

  export-ui-browser-e2e:
    needs: [export-ui-quality, export-ui-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      LUMI_SHELL_E2E_AUTH: "1"
      LUMI_PROJECTS_E2E: "1"
      LUMI_AI_WORKSPACE_E2E: "1"
      LUMI_INFINITE_CANVAS_E2E: "1"
      LUMI_BRAND_KIT_E2E: "1"
      LUMI_VERSIONS_E2E: "1"
      LUMI_EXPORT_UI_E2E: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run NODE-60 browser scenarios
        run: pnpm exec playwright test apps/web/e2e/export-ui.spec.ts
      - name: Re-run NODE-59 through NODE-54 browser regressions
        run: pnpm exec playwright test apps/web/e2e/versions-ui.spec.ts apps/web/e2e/brand-kit.spec.ts apps/web/e2e/agent-timeline.spec.ts apps/web/e2e/layers-inspector.spec.ts apps/web/e2e/infinite-canvas.spec.ts apps/web/e2e/ai-workspace.spec.ts
