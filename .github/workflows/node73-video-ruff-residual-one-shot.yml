name: NODE-73 Video Ruff Residual Closure

on:
  push:
    branches:
      - release-closure-p0
    paths:
      - .github/workflows/node73-video-ruff-residual-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-video-ruff-residuals:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 1

      - name: Apply reviewed equivalent transformations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # SIM117: collapse the two nested Kombu context managers without changing scope.
          path = root / 'apps/worker-media/src/lumi_worker_media/event_runtime.py'
          text = path.read_text()
          start_marker = '        with Connection(self.broker_url) as connection:\n            with connection.SimpleQueue(queue) as simple_queue:\n'
          assert text.count(start_marker) == 1, 'event_runtime marker drifted'
          start = text.index(start_marker)
          end = text.index('\n\n\ndef validate_event_envelope', start)
          block = text[start:end]
          lines = block.splitlines()
          assert lines[0] == '        with Connection(self.broker_url) as connection:'
          assert lines[1] == '            with connection.SimpleQueue(queue) as simple_queue:'
          replacement = [
              '        with Connection(self.broker_url) as connection, connection.SimpleQueue(queue) as simple_queue:'
          ]
          replacement.extend(line[4:] if line.startswith('    ') else line for line in lines[2:])
          text = text[:start] + '\n'.join(replacement) + text[end:]
          path.write_text(text)

          # I001: contextlib belongs with stdlib imports.
          path = root / 'apps/worker-media/src/lumi_worker_media/video_final_probe_runtime.py'
          text = path.read_text()
          assert text.count('\nimport contextlib\n') == 1, 'final probe contextlib marker drifted'
          text = text.replace('\nimport contextlib\n', '\n', 1)
          anchor = 'import asyncio\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + 'import contextlib\n', 1)
          path.write_text(text)

          # I001: same stdlib import ordering in hosted video ports.
          path = root / 'apps/worker-media/src/lumi_worker_media/video_generation_ports.py'
          text = path.read_text()
          assert text.count('\nimport contextlib\n') == 1, 'video ports contextlib marker drifted'
          text = text.replace('\nimport contextlib\n', '\n', 1)
          anchor = 'import base64\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + 'import contextlib\n', 1)
          path.write_text(text)

          # SIM105: cleanup failures remain intentionally suppressed and cannot mask the primary result.
          path = root / 'apps/worker-media/src/lumi_worker_media/video_sandbox_runtime.py'
          text = path.read_text()
          assert 'import contextlib\n' not in text
          anchor = 'import base64\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + 'import contextlib\n', 1)
          old = '''        for key in keys:\n            try:\n                await self.object_store.delete_candidate(\n                    bucket=self.exchange_bucket,\n                    object_key=key,\n                )\n            except Exception:\n                # Cleanup failure must not overwrite the primary execution result.\n                pass\n'''
          new = '''        for key in keys:\n            # Cleanup failure must not overwrite the primary execution result.\n            with contextlib.suppress(Exception):\n                await self.object_store.delete_candidate(\n                    bucket=self.exchange_bucket,\n                    object_key=key,\n                )\n'''
          assert text.count(old) == 1, 'video sandbox cleanup marker drifted'
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Enforce exact diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat <<'EOF'
          apps/worker-media/src/lumi_worker_media/event_runtime.py
          apps/worker-media/src/lumi_worker_media/video_final_probe_runtime.py
          apps/worker-media/src/lumi_worker_media/video_generation_ports.py
          apps/worker-media/src/lumi_worker_media/video_sandbox_runtime.py
          EOF
          )"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          python -m py_compile \
            apps/worker-media/src/lumi_worker_media/event_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_final_probe_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_generation_ports.py \
            apps/worker-media/src/lumi_worker_media/video_sandbox_runtime.py
          git diff --check

      - name: Commit only if branch head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-closure-p0 --depth=1
          test "$(git rev-parse origin/release-closure-p0)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/worker-media/src/lumi_worker_media/event_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_final_probe_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_generation_ports.py \
            apps/worker-media/src/lumi_worker_media/video_sandbox_runtime.py
          git commit -m "style(video): close final scoped ruff residuals"
          git push origin HEAD:release-closure-p0
