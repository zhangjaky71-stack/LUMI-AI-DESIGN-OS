name: Assemble Final Acceptance Package

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Immutable final release identifier"
        required: true
        type: string
      production_manifest:
        description: "Frozen Production deployment manifest path"
        required: true
        type: string
      security_decision:
        description: "Frozen Security decision path"
        required: true
        type: string
      recovery_decision:
        description: "Frozen Recovery decision path"
        required: true
        type: string
      performance_decision:
        description: "Frozen Performance decision path"
        required: true
        type: string
      ai_regression_decision:
        description: "Frozen AI Regression decision path"
        required: true
        type: string
      staging_acceptance_decision:
        description: "Frozen Staging Acceptance decision path"
        required: true
        type: string
      production_deployment_decision:
        description: "Frozen Production Deployment decision path"
        required: true
        type: string
      authorization_request:
        description: "Frozen V2 authorization request path (Source RC + approval policy + handoff; no live approvals)"
        required: true
        type: string
      scenario_results:
        description: "Frozen 46-scenario results path"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_ID: ${{ inputs.release_id }}
  PRODUCTION_MANIFEST: ${{ inputs.production_manifest }}
  SECURITY_DECISION: ${{ inputs.security_decision }}
  RECOVERY_DECISION: ${{ inputs.recovery_decision }}
  PERFORMANCE_DECISION: ${{ inputs.performance_decision }}
  AI_REGRESSION_DECISION: ${{ inputs.ai_regression_decision }}
  STAGING_ACCEPTANCE_DECISION: ${{ inputs.staging_acceptance_decision }}
  PRODUCTION_DEPLOYMENT_DECISION: ${{ inputs.production_deployment_decision }}
  AUTHORIZATION_REQUEST: ${{ inputs.authorization_request }}
  SCENARIO_RESULTS: ${{ inputs.scenario_results }}
  GOVERNANCE_POLICY: final/acceptance/repository-governance-policy-template.json

jobs:
  assemble:
    if: github.ref == 'refs/heads/release-closure-p0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Refuse unsafe release identifiers and stale dispatches
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$RELEASE_ID" != "PENDING"
          test ! -e "reports/final-acceptance/${RELEASE_ID}/release-manifest-v2.json"
          test ! -e "reports/final-acceptance/${RELEASE_ID}/acceptance-evidence.json"
          git fetch origin "${GITHUB_REF_NAME}"
          remote_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "release branch moved since dispatch: expected $GITHUB_SHA got $remote_sha" >&2
            exit 64
          }
      - name: Validate V2 finalization source contracts
        run: |
          python3 scripts/validate_finalization_v2_contract.py
      - name: Require canonical frozen Production recovery bundle and producer provenance
        shell: bash
        run: |
          set -euo pipefail
          recovery_source_run="$(dirname "$RECOVERY_DECISION")/source-run.json"
          python3 scripts/validate_frozen_production_recovery_evidence.py --self-test
          python3 scripts/validate_frozen_production_recovery_evidence.py \
            --decision "$RECOVERY_DECISION" \
            --source-run "$recovery_source_run" \
            --manifest "$PRODUCTION_MANIFEST" \
            --expected-evidence-head "$GITHUB_SHA"
      - name: Assemble only from frozen Source-RC evidence and pre-final policies
        run: |
          python3 scripts/final-acceptance-assembler-v2.py \
            --release-id "$RELEASE_ID" \
            --production-manifest "$PRODUCTION_MANIFEST" \
            --governance-policy "$GOVERNANCE_POLICY" \
            --authorization-request "$AUTHORIZATION_REQUEST" \
            --security "$SECURITY_DECISION" \
            --recovery "$RECOVERY_DECISION" \
            --performance "$PERFORMANCE_DECISION" \
            --ai-regression "$AI_REGRESSION_DECISION" \
            --staging-acceptance "$STAGING_ACCEPTANCE_DECISION" \
            --production-deployment "$PRODUCTION_DEPLOYMENT_DECISION" \
            --scenario-results "$SCENARIO_RESULTS"
          test -f "reports/final-acceptance/${RELEASE_ID}/release-manifest-v2.json"
          test -f "reports/final-acceptance/${RELEASE_ID}/acceptance-evidence.json"
      - name: Validate assembled V2 package without declaring Final PASS
        run: |
          python3 scripts/validate_final_acceptance_package_v2.py \
            --release "reports/final-acceptance/${RELEASE_ID}/release-manifest-v2.json"
      - name: Require committed package to remain pre-approval and non-live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('reports/final-acceptance') / os.environ['RELEASE_ID'] / 'release-manifest-v2.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          approvals = payload.get('approvals', {})
          if set(approvals.values()) != {'PENDING'}:
              raise SystemExit('committed V2 package must keep every approval PENDING')
          if 'release_authorization' in payload or 'repository_governance' in payload:
              raise SystemExit('committed V2 package must not contain live release-control reports')
          PY
      - name: Refuse changes outside the final package boundary
        shell: bash
        run: |
          set -euo pipefail
          prefix="reports/final-acceptance/${RELEASE_ID}/"
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          [[ ${#changed[@]} -gt 0 ]] || { echo "no final package files produced" >&2; exit 65; }
          for path in "${changed[@]}"; do
            [[ "$path" == "$prefix"* ]] || { echo "unexpected change outside final package boundary: $path" >&2; exit 66; }
          done
      - name: Commit only the validated pre-final package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          remote_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "release branch moved during assembly: expected $GITHUB_SHA got $remote_sha" >&2
            exit 67
          }
          git config user.name "lumi-release-evidence-bot"
          git config user.email "lumi-release-evidence-bot@users.noreply.github.com"
          git add -- "reports/final-acceptance/${RELEASE_ID}"
          test "$(git diff --cached --name-only | wc -l)" -gt 0
          while IFS= read -r path; do
            [[ "$path" == "reports/final-acceptance/${RELEASE_ID}/"* ]] || { echo "unexpected staged path: $path" >&2; exit 66; }
          done < <(git diff --cached --name-only)
          git commit -m "release: assemble final acceptance V2 ${RELEASE_ID}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Explain Evidence Head freeze and next mandatory gate
        run: |
          echo "V2 package assembled only; NODE-73 is not accepted by this workflow."
          echo "The resulting branch commit becomes the Evidence Head only after all remaining non-live evidence is final."
          echo "Do not commit live governance, live authorization, or final-decision-v2.json back to this branch."
          echo "After strong branch protection and human reviews on the Evidence Head, run Final Product Acceptance Gate with:"
          echo "  reports/final-acceptance/${RELEASE_ID}/release-manifest-v2.json"
          echo "  reports/final-acceptance/${RELEASE_ID}/acceptance-evidence.json"
