name: Tool Gateway Approval Control

on:
  pull_request:
    paths:
      - "apps/api/alembic/versions/0021_tool_approval_scope.py"
      - "apps/api/src/lumi_api/persistence/models/workflow.py"
      - "apps/api/src/lumi_api/product_app.py"
      - "apps/api/src/lumi_api/tool_approval_control.py"
      - "apps/api/tests/test_tool_approval_control.py"
      - "apps/api/tests/integration/test_tool_approval_postgres.py"
      - "services/tool-gateway/src/lumi_tool_gateway/approval_control.py"
      - "services/tool-gateway/src/lumi_tool_gateway/errors.py"
      - "services/tool-gateway/src/lumi_tool_gateway/service.py"
      - "services/tool-gateway/tests/test_approval_control.py"
      - "infra/iac/environments/staging/core/main.tf"
      - "infra/iac/environments/staging/app/main.tf"
      - "infra/iac/environments/production/core/main.tf"
      - "infra/iac/environments/production/app/main.tf"
      - "infra/iac/modules/platform-app/internal-path-deny.tf"
      - "scripts/validate_tool_approval_provenance.py"
      - ".github/workflows/tool-approval-control.yml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile durable approval control sources
        run: |
          python -m compileall -q \
            apps/api/alembic/versions/0021_tool_approval_scope.py \
            apps/api/src/lumi_api/tool_approval_control.py \
            apps/api/tests/test_tool_approval_control.py \
            apps/api/tests/integration/test_tool_approval_postgres.py \
            services/tool-gateway/src/lumi_tool_gateway/approval_control.py \
            services/tool-gateway/tests/test_approval_control.py \
            scripts/validate_tool_approval_provenance.py
      - name: Require approval source, identity, and provenance closure
        run: python scripts/validate_tool_approval_provenance.py --self-test

  approval-quality:
    needs: approval-source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Require canonical frozen workspace
        run: uv sync --all-packages --frozen
      - name: Ruff durable approval boundary
        run: >-
          uv run ruff check
          apps/api/src/lumi_api/tool_approval_control.py
          apps/api/tests/test_tool_approval_control.py
          apps/api/tests/integration/test_tool_approval_postgres.py
          services/tool-gateway/src/lumi_tool_gateway/approval_control.py
          services/tool-gateway/tests/test_approval_control.py
      - name: Pyright durable approval boundary
        run: >-
          uv run pyright
          apps/api/src/lumi_api/tool_approval_control.py
          services/tool-gateway/src/lumi_tool_gateway/approval_control.py
      - name: Unit acceptance
        run: >-
          uv run pytest
          apps/api/tests/test_tool_approval_control.py
          services/tool-gateway/tests/test_approval_control.py
          -q

  approval-postgres:
    needs: approval-source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Require canonical frozen workspace
        run: uv sync --all-packages --frozen
      - name: Start canonical local infrastructure
        run: |
          make infra-env
          make infra-up
      - name: Migrate through exact tool approval scope
        run: make db-upgrade
      - name: Require ORM to migration parity
        run: bash scripts/db-local schema-check
      - name: Seed deterministic tenant fixtures
        run: make db-seed
      - name: Real PostgreSQL exact-scope approval acceptance
        env:
          LUMI_DB_INTEGRATION: "1"
        run: uv run pytest apps/api/tests/integration/test_tool_approval_postgres.py -q
      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true
