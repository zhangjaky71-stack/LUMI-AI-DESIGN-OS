name: NODE-73 Deep Runtime Lazy Export One-Shot

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - .github/workflows/node73-auth-parent-flush-one-shot.yml

permissions:
  contents: write

jobs:
  patch-validator:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release-closure-p0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Auth repair is present
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('apps/api/src/lumi_api/auth/service.py').read_text()
          test = Path('apps/api/tests/integration/test_auth_tenant.py').read_text()
          if service.count('await self.session.flush()') < 2:
              raise SystemExit('Auth parent flush repair missing')
          if 'ScriptDirectory.from_config(Config("apps/api/alembic.ini")).get_current_head()' not in test:
              raise SystemExit('Auth canonical Alembic head assertion missing')
          PY
      - name: Make Deep Runtime export validator lazy-aware
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_deep_agents_runtime_contract_v2.py')
          text = path.read_text()
          start = text.index('def assert_public_exports_are_bounded() -> None:\n')
          end = text.index('\ndef assert_hosted_model_provider_is_fixed() -> None:\n', start)
          replacement = '''def assert_public_exports_are_bounded() -> None:\n    path = ROOT / "apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/__init__.py"\n    tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))\n    public_exports: set[str] | None = None\n    lazy_exports: dict[str, tuple[str, str]] | None = None\n    for node in tree.body:\n        if (\n            isinstance(node, ast.Assign)\n            and any(isinstance(target, ast.Name) and target.id == "__all__" for target in node.targets)\n        ):\n            value = ast.literal_eval(node.value)\n            public_exports = set(value)\n        elif (\n            isinstance(node, ast.AnnAssign)\n            and isinstance(node.target, ast.Name)\n            and node.target.id == "_LAZY_EXPORTS"\n            and node.value is not None\n        ):\n            value = ast.literal_eval(node.value)\n            lazy_exports = dict(value)\n    if public_exports is None:\n        raise SystemExit("deep_runtime.__all__ must be explicit")\n    if lazy_exports is None:\n        raise SystemExit("deep_runtime lazy export map must be explicit")\n    for required in (\n        "BoundedDeepAgentRuntimeFactory",\n        "HostedDeepAgentRuntimeFactory",\n    ):\n        if required not in public_exports:\n            raise SystemExit(f"required bounded Deep Agent factory is not exported: {required}")\n        if lazy_exports.get(required) != (".runtime_factory", required):\n            raise SystemExit(f"bounded Deep Agent factory lazy binding is invalid: {required}")\n    if "DeepAgentRuntimeFactory" in public_exports or "DeepAgentRuntimeFactory" in lazy_exports:\n        raise SystemExit("unbounded raw DeepAgentRuntimeFactory must not be exported")\n\n'''
          path.write_text(text[:start] + replacement + text[end + 1:])
          PY
      - name: Syntax-check validator
        run: python -m py_compile scripts/validate_deep_agents_runtime_contract_v2.py
      - name: Commit validator and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_deep_agents_runtime_contract_v2.py
          git rm .github/workflows/node73-auth-parent-flush-one-shot.yml
          git diff --cached --check
          git commit -m 'fix(deep-runtime): validate bounded lazy exports'
          git push origin HEAD:release-closure-p0
