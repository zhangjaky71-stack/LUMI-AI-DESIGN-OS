name: Temporary Quality Closure

on:
  push:
    branches:
      - tmp-quality-closure-181f

permissions:
  contents: write

jobs:
  close-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp-quality-closure-181f
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Frozen workspace install
        run: uv sync --all-packages --frozen

      - name: Apply isolated Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            services/model-gateway
            services/asset-storage/src/lumi_asset_storage/s3.py
            services/asset-storage/tests/test_s3_bounded_bytes.py
            apps/api/src/lumi_api/model_gateway_runtime.py
            apps/api/src/lumi_api/model_gateway_bootstrap.py
            apps/api/src/lumi_api/model_gateway_service.py
            apps/api/src/lumi_api/model_gateway_cli.py
            apps/api/src/lumi_api/model_paid_guard.py
            apps/api/src/lumi_api/provider_output_store.py
            apps/api/tests/test_model_gateway_media_bootstrap.py
            apps/api/tests/test_model_paid_guard.py
            apps/api/tests/test_provider_output_store.py
            apps/api/tests/integration/test_model_paid_guard_postgres.py
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime
            apps/agent-runtime/src/lumi_agent_runtime/runtime_cli.py
            apps/agent-runtime/src/lumi_agent_runtime/runtime_service.py
            apps/agent-runtime/tests/test_deep_runtime_contracts.py
            apps/agent-runtime/tests/test_deep_runtime_factory.py
            apps/agent-runtime/tests/test_deep_runtime_tooling.py
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py
            apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py
            apps/worker-media/src/lumi_worker_media/video_gateway_runtime.py
            apps/worker-media/tests/test_image_gateway_runtime.py
            scripts/validate_model_gateway_contract.py
            scripts/validate_deep_agents_model_gateway_contract.py
            scripts/validate_private_model_gateway_deployment_contract.py
            scripts/validate_deep_agents_runtime_contract_v2.py
            scripts/integration_model_gateway.py
            scripts/integration_deep_agents_runtime.py
            scripts/integration_deep_agent_tool_gateway.py
            scripts/integration_deep_agent_node28_stack.py
          )
          uv run ruff check "${targets[@]}" --fix --unsafe-fixes
          uv run ruff format "${targets[@]}"
          uv run ruff check "${targets[@]}"

      - name: Model Gateway contract and type gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/validate_model_gateway_contract.py
          uv run python scripts/validate_private_model_gateway_deployment_contract.py
          uv run pyright \
            services/model-gateway \
            services/asset-storage/src/lumi_asset_storage/s3.py \
            apps/api/src/lumi_api/model_gateway_runtime.py \
            apps/api/src/lumi_api/model_gateway_bootstrap.py \
            apps/api/src/lumi_api/model_gateway_service.py \
            apps/api/src/lumi_api/model_gateway_cli.py \
            apps/api/src/lumi_api/model_paid_guard.py \
            apps/api/src/lumi_api/provider_output_store.py \
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/model_gateway_chat.py \
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/runtime_factory.py \
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py \
            apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_gateway_runtime.py \
            apps/worker-media/tests/test_image_gateway_runtime.py \
            apps/api/tests/test_model_gateway_media_bootstrap.py \
            apps/api/tests/test_model_paid_guard.py \
            apps/api/tests/test_provider_output_store.py \
            apps/api/tests/integration/test_model_paid_guard_postgres.py

      - name: Deep Runtime contract and type gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=apps/agent-runtime/src uv run python scripts/validate_deep_agents_runtime_contract_v2.py
          uv run python scripts/validate_deep_agents_model_gateway_contract.py
          uv run pyright \
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime \
            apps/agent-runtime/src/lumi_agent_runtime/runtime_cli.py \
            apps/agent-runtime/src/lumi_agent_runtime/runtime_service.py \
            apps/agent-runtime/tests/test_deep_runtime_contracts.py \
            apps/agent-runtime/tests/test_deep_runtime_factory.py \
            apps/agent-runtime/tests/test_deep_runtime_tooling.py \
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py

      - name: Model Gateway and Deep Runtime tests
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m unittest discover -s services/model-gateway/tests -p 'test_*.py'
          uv run pytest \
            services/asset-storage/tests/test_s3_bounded_bytes.py \
            apps/api/tests/test_model_gateway_media_bootstrap.py \
            apps/api/tests/test_provider_output_store.py \
            apps/worker-media/tests/test_image_gateway_runtime.py \
            apps/api/tests/test_model_paid_guard.py \
            apps/agent-runtime/tests/test_deep_runtime_contracts.py \
            apps/agent-runtime/tests/test_deep_runtime_factory.py \
            apps/agent-runtime/tests/test_deep_runtime_tooling.py \
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py \
            -q
          uv run python scripts/integration_model_gateway.py
          PYTHONPATH=apps/agent-runtime/src uv run python scripts/integration_deep_agents_runtime.py
          PYTHONPATH=apps/agent-runtime/src uv run python scripts/integration_deep_agent_tool_gateway.py

      - name: Diff safety check
        run: git diff --check

      - name: Commit isolated source fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes remain"
            exit 0
          fi
          git config user.name "zhangjaky71-stack"
          git config user.email "zhangjaky71@gmail.com"
          git add \
            services/model-gateway \
            services/asset-storage/src/lumi_asset_storage/s3.py \
            services/asset-storage/tests/test_s3_bounded_bytes.py \
            apps/api/src/lumi_api/model_gateway_runtime.py \
            apps/api/src/lumi_api/model_gateway_bootstrap.py \
            apps/api/src/lumi_api/model_gateway_service.py \
            apps/api/src/lumi_api/model_gateway_cli.py \
            apps/api/src/lumi_api/model_paid_guard.py \
            apps/api/src/lumi_api/provider_output_store.py \
            apps/api/tests/test_model_gateway_media_bootstrap.py \
            apps/api/tests/test_model_paid_guard.py \
            apps/api/tests/test_provider_output_store.py \
            apps/api/tests/integration/test_model_paid_guard_postgres.py \
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime \
            apps/agent-runtime/src/lumi_agent_runtime/runtime_cli.py \
            apps/agent-runtime/src/lumi_agent_runtime/runtime_service.py \
            apps/agent-runtime/tests/test_deep_runtime_contracts.py \
            apps/agent-runtime/tests/test_deep_runtime_factory.py \
            apps/agent-runtime/tests/test_deep_runtime_tooling.py \
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py \
            apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_gateway_runtime.py \
            apps/worker-media/tests/test_image_gateway_runtime.py \
            scripts/validate_model_gateway_contract.py \
            scripts/validate_deep_agents_model_gateway_contract.py \
            scripts/validate_private_model_gateway_deployment_contract.py \
            scripts/validate_deep_agents_runtime_contract_v2.py \
            scripts/integration_model_gateway.py \
            scripts/integration_deep_agents_runtime.py \
            scripts/integration_deep_agent_tool_gateway.py \
            scripts/integration_deep_agent_node28_stack.py
          git commit -m "chore(quality): close model gateway and deep runtime lint"
          git push origin HEAD:tmp-quality-closure-181f
