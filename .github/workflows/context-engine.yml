name: Context Engine

on:
  pull_request:
    paths:
      - "apps/agent-runtime/src/lumi_agent_runtime/context_engine/**"
      - "apps/agent-runtime/tests/test_context_*.py"
      - "scripts/validate_context_engine_contract.py"
      - "scripts/integration_context_*.py"
      - "docs/runtime/CONTEXT-ENGINE-V1.md"
      - "reports/nodes/NODE-34/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile NODE-34 runtime and acceptance
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src:scripts
          python -m compileall -q
          apps/agent-runtime/src/lumi_agent_runtime/context_engine
          apps/agent-runtime/tests/test_context_engine.py
          apps/agent-runtime/tests/test_context_learning.py
          apps/agent-runtime/tests/test_context_postgres_contract.py
          scripts/validate_context_engine_contract.py
          scripts/integration_context_engine.py
          scripts/integration_context_postgres.py
      - name: Revalidate NODE-33 Task Graph
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python scripts/validate_task_graph_contract.py
      - name: NODE-34 static Context contract
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python scripts/validate_context_engine_contract.py
      - name: NODE-34 dependency-light unit tests
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src
          python -m unittest discover
          -s apps/agent-runtime/tests
          -p 'test_context_*.py'
      - name: Long-project deterministic Context integration
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src:scripts
          python scripts/integration_context_engine.py

  context-quality:
    needs: context-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: NODE-34 pytest
        run: >-
          uv run pytest
          apps/agent-runtime/tests/test_context_engine.py
          apps/agent-runtime/tests/test_context_learning.py
          apps/agent-runtime/tests/test_context_postgres_contract.py
          -q
      - name: NODE-34 Ruff gate
        run: >-
          uv run ruff check
          apps/agent-runtime/src/lumi_agent_runtime/context_engine
          apps/agent-runtime/tests/test_context_engine.py
          apps/agent-runtime/tests/test_context_learning.py
          apps/agent-runtime/tests/test_context_postgres_contract.py
          scripts/validate_context_engine_contract.py
          scripts/integration_context_engine.py
          scripts/integration_context_postgres.py
      - name: NODE-34 Pyright gate
        run: >-
          uv run pyright
          apps/agent-runtime/src/lumi_agent_runtime/context_engine
          apps/agent-runtime/tests/test_context_engine.py
          apps/agent-runtime/tests/test_context_learning.py
          apps/agent-runtime/tests/test_context_postgres_contract.py

  context-postgres:
    needs: context-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Start local infrastructure
        run: |
          make infra-env
          make infra-up
      - name: Upgrade database to current TaskGraph head
        run: make db-upgrade
      - name: Verify Alembic metadata has no drift
        run: bash scripts/db-local schema-check
      - name: Seed deterministic project fixtures
        run: make db-seed
      - name: ProjectSummary TaskGraph Context readback integration
        run: >-
          PYTHONPATH=apps/agent-runtime/src:services/model-gateway/src:services/tool-gateway/src:scripts
          uv run python scripts/integration_context_postgres.py
      - name: Reset infrastructure
        if: always()
        run: CONFIRM=1 make infra-reset || true
