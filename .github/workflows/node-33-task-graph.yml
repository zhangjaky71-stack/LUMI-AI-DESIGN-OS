name: NODE-33 Task Graph Scheduler

on:
  pull_request:
    paths:
      - "apps/agent-runtime/src/lumi_agent_runtime/task_graph/**"
      - "apps/agent-runtime/tests/test_task_graph_node33.py"
      - "docs/runtime/TASK-GRAPH-SCHEDULER-V1.md"
      - "reports/nodes/NODE-33/**"
      - ".github/workflows/node-33-task-graph.yml"
  push:
    branches:
      - "feat/node-33-task-graph-scheduler"
    paths:
      - "apps/agent-runtime/src/lumi_agent_runtime/task_graph/**"
      - "apps/agent-runtime/tests/test_task_graph_node33.py"
      - "docs/runtime/TASK-GRAPH-SCHEDULER-V1.md"
      - "reports/nodes/NODE-33/**"

permissions:
  contents: read

jobs:
  task-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Compile NODE-33 sources
        run: |
          python -m compileall -q \
            apps/agent-runtime/src/lumi_agent_runtime/task_graph \
            apps/agent-runtime/tests/test_task_graph_node33.py

      - name: Ruff
        run: |
          ruff check \
            apps/agent-runtime/src/lumi_agent_runtime/task_graph \
            apps/agent-runtime/tests/test_task_graph_node33.py

      - name: Pytest NODE-33
        env:
          PYTHONPATH: apps/agent-runtime/src
        run: |
          pytest -q apps/agent-runtime/tests/test_task_graph_node33.py

      - name: Parse gap ledger
        run: |
          python -m json.tool reports/nodes/NODE-33/gap-ledger.json >/dev/null
