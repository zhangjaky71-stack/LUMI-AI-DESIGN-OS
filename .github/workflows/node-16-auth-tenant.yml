name: NODE-16 Authentication Tenant

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/auth/**"
      - "apps/api/src/lumi_api/api/v1/auth_*.py"
      - "apps/api/src/lumi_api/api/v1/app.py"
      - "apps/api/src/lumi_api/domain/repositories.py"
      - "apps/api/src/lumi_api/persistence/models_auth.py"
      - "apps/api/src/lumi_api/persistence/models_identity.py"
      - "apps/api/src/lumi_api/persistence/models.py"
      - "apps/api/migrations/versions/20260816_0002_auth_tenant.py"
      - "apps/api/migrations/versions/20260816_0002_sql/**"
      - "apps/api/tests/test_auth_*.py"
      - "apps/api/tests/test_api_v1_contract.py"
      - "tools/node16/**"
      - "tools/node10/validate_schema.py"
      - "tools/node10/run_database_integration.py"
      - "docs/auth/**"
      - "docs/nodes/NODE-16-AUTH-TENANT.md"
      - "reports/nodes/NODE-16/**"
      - ".github/workflows/node-16-auth-tenant.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/lumi_api/auth/**"
      - "apps/api/src/lumi_api/api/v1/auth_*.py"
      - "apps/api/src/lumi_api/api/v1/app.py"
      - "apps/api/src/lumi_api/domain/repositories.py"
      - "apps/api/src/lumi_api/persistence/models_auth.py"
      - "apps/api/src/lumi_api/persistence/models_identity.py"
      - "apps/api/src/lumi_api/persistence/models.py"
      - "apps/api/migrations/versions/20260816_0002_auth_tenant.py"
      - "apps/api/migrations/versions/20260816_0002_sql/**"
      - "apps/api/tests/test_auth_*.py"
      - "apps/api/tests/test_api_v1_contract.py"
      - "tools/node16/**"
      - "docs/auth/**"
      - "reports/nodes/NODE-16/**"
      - ".github/workflows/node-16-auth-tenant.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"
  SQLALCHEMY_VERSION: "2.0.51"
  ALEMBIC_VERSION: "1.18.5"
  ASYNCPG_VERSION: "0.31.0"
  LUMI_DATABASE_MIGRATION_URL: "postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi"
  LUMI_DATABASE_MIGRATION_URL_ASYNCPG: "postgresql://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi"
  LUMI_DATABASE_APP_URL: "postgresql://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi"

jobs:
  auth-tenant:
    name: auth-tenant
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Validate auth, RBAC, tenant and migration architecture
        run: |
          PYTHONPATH=apps/api/src uv run python tools/node16/validate_auth_tenant.py

      - name: Run auth and HTTP security contract tests
        run: |
          PYTHONPATH=apps/api/src uv run pytest -q \
            apps/api/tests/test_auth_*.py \
            apps/api/tests/test_api_v1_contract.py

      - name: Export machine-readable auth schemas
        run: |
          rm -rf reports/nodes/NODE-16/generated-schemas
          PYTHONPATH=apps/api/src uv run python tools/node16/export_auth_schemas.py
          test "$(find reports/nodes/NODE-16/generated-schemas -name '*.schema.json' | wc -l)" -eq 10

      - name: Validate exported schemas and gap ledger parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("reports/nodes/NODE-16/generated-schemas").glob("*.schema.json"))
          assert len(schemas) == 10, len(schemas)
          for path in schemas:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"validated {path}")
          ledger = json.loads(Path("reports/nodes/NODE-16/gap-ledger.json").read_text(encoding="utf-8"))
          assert ledger["gaps"]
          print("validated NODE-16 gap ledger")
          PY

      - name: Lint and type-check NODE-16 scope
        run: |
          uv run ruff check \
            apps/api/src/lumi_api/auth \
            apps/api/src/lumi_api/api/v1/auth_dependencies.py \
            apps/api/src/lumi_api/api/v1/auth_guard.py \
            apps/api/src/lumi_api/api/v1/auth_routes.py \
            apps/api/src/lumi_api/api/v1/auth_schemas.py \
            apps/api/src/lumi_api/api/v1/app.py \
            apps/api/src/lumi_api/domain/repositories.py \
            apps/api/src/lumi_api/persistence/models_auth.py \
            apps/api/src/lumi_api/persistence/models_identity.py \
            apps/api/tests/test_auth_tenant_contract.py \
            apps/api/tests/test_auth_http_contract.py \
            apps/api/tests/test_auth_business_guard.py \
            apps/api/tests/test_auth_security_extensions.py \
            tools/node16 tools/node10/run_database_integration.py
          uv run pyright \
            apps/api/src/lumi_api/auth \
            apps/api/src/lumi_api/api/v1/auth_dependencies.py \
            apps/api/src/lumi_api/api/v1/auth_guard.py \
            apps/api/src/lumi_api/api/v1/auth_routes.py \
            apps/api/src/lumi_api/api/v1/auth_schemas.py \
            apps/api/src/lumi_api/api/v1/app.py \
            apps/api/src/lumi_api/domain/repositories.py \
            apps/api/src/lumi_api/persistence/models_auth.py \
            apps/api/src/lumi_api/persistence/models_identity.py \
            apps/api/tests/test_auth_tenant_contract.py \
            apps/api/tests/test_auth_http_contract.py \
            apps/api/tests/test_auth_business_guard.py \
            apps/api/tests/test_auth_security_extensions.py \
            tools/node16 tools/node10/run_database_integration.py

      - name: Prepare local PostgreSQL environment
        run: |
          cp infra/compose/env.local.example infra/compose/.env
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            up -d --wait --wait-timeout 180 postgres

      - name: Validate frozen NODE-10 baseline plus current metadata
        run: |
          PYTHONPATH=apps/api/src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            python tools/node10/validate_schema.py

      - name: Upgrade PostgreSQL to NODE-16 head
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade head

      - name: Load deterministic two-tenant baseline fixture
        run: |
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -v ON_ERROR_STOP=1 -U lumi_migration -d lumi \
            < apps/api/migrations/seeds/p0_local_fixture.sql

      - name: Re-run baseline database invariants at current head
        run: |
          PYTHONPATH=apps/api/src uv run --no-project \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            python tools/node10/run_database_integration.py

      - name: Validate NODE-16 auth persistence and API-token RLS
        run: |
          PYTHONPATH=apps/api/src uv run --no-project \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            python tools/node16/test_auth_database.py

      - name: Downgrade NODE-16 migration only
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic downgrade 20260816_0001

      - name: Verify NODE-16 rollback preserved NODE-10 baseline
        run: |
          auth_table="$(docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c "SELECT to_regclass('public.api_tokens') IS NULL")"
          baseline_table="$(docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c "SELECT to_regclass('public.projects') IS NOT NULL")"
          test "$auth_table" = "t"
          test "$baseline_table" = "t"

      - name: Reapply NODE-16 migration
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade head

      - name: Re-run NODE-16 PostgreSQL auth invariants after reapply
        run: |
          PYTHONPATH=apps/api/src uv run --no-project \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            python tools/node16/test_auth_database.py

      - name: Capture PostgreSQL diagnostics on failure
        if: failure()
        run: |
          mkdir -p reports/nodes/NODE-16/runtime
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml ps \
            > reports/nodes/NODE-16/runtime/compose-ps.txt 2>&1 || true
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml logs \
            --no-color --tail=400 postgres \
            > reports/nodes/NODE-16/runtime/postgres.log 2>&1 || true

      - name: Upload NODE-16 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-16-auth-tenant-${{ github.run_id }}
          path: |
            reports/nodes/NODE-16/generated-schemas
            reports/nodes/NODE-16/gap-ledger.json
            reports/nodes/NODE-16/runtime
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            down --volumes --remove-orphans || true
