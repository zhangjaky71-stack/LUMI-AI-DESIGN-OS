name: NODE-55 Infinite Canvas UI

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/api/v1/canvas_document_*.py"
      - "apps/api/src/lumi_api/api/v1/app.py"
      - "apps/api/tests/test_node55_canvas_document_contracts.py"
      - "apps/web/src/lib/canvas/**"
      - "apps/web/src/components/canvas/**"
      - "apps/web/src/components/workspace/ai-workspace.tsx"
      - "apps/web/src/app/(shell)/workspace/canvas.css"
      - "apps/web/src/app/(shell)/workspace/layout.tsx"
      - "apps/web/src/lib/api/client.ts"
      - "apps/web/tsconfig.json"
      - "packages/canvas-sdk/src/**"
      - "packages/canvas-sdk/tests/canvas-node55.test.ts"
      - "tools/node55/**"
      - "docs/runtime/INFINITE-CANVAS-UI-V1.md"
      - "docs/nodes/NODE-55-INFINITE-CANVAS*.md"
      - "reports/nodes/NODE-55/**"
      - ".github/workflows/node-55-infinite-canvas-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.4.0"
  NEXT_TELEMETRY_DISABLED: "1"
  LUMI_API_ORIGIN: "http://127.0.0.1:8000"

jobs:
  canvas-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Compile NODE-55 API runtime
        run: |
          uv run python -m compileall -q \
            apps/api/src/lumi_api/api/v1/canvas_document_schemas.py \
            apps/api/src/lumi_api/api/v1/canvas_document_dependencies.py \
            apps/api/src/lumi_api/api/v1/canvas_document_routes.py \
            apps/api/src/lumi_api/api/v1/canvas_document_adapter.py \
            apps/api/src/lumi_api/api/v1/canvas_document_factory.py \
            tools/node55
      - name: Static Infinite Canvas acceptance
        run: uv run python tools/node55/validate_infinite_canvas.py
      - name: NODE-55 Python contract tests
        run: uv run pytest -q apps/api/tests/test_node55_canvas_document_contracts.py
      - name: Ruff NODE-55 API checks
        run: |
          uv run ruff check --ignore E501,I001 \
            apps/api/src/lumi_api/api/v1/canvas_document_schemas.py \
            apps/api/src/lumi_api/api/v1/canvas_document_dependencies.py \
            apps/api/src/lumi_api/api/v1/canvas_document_routes.py \
            apps/api/src/lumi_api/api/v1/canvas_document_adapter.py \
            apps/api/src/lumi_api/api/v1/canvas_document_factory.py \
            apps/api/tests/test_node55_canvas_document_contracts.py \
            tools/node55
      - name: Parse NODE-55 gap ledger
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          ledger = json.loads(
              Path("reports/nodes/NODE-55/gap-ledger.json").read_text(
                  encoding="utf-8"
              )
          )
          assert ledger["node"] == "NODE-55"
          assert ledger["status"] == "CORE_IMPLEMENTED_VALIDATING_NOT_COMPLETE"
          assert any(gap["severity"] == "P0" for gap in ledger["gaps"])
          print("NODE55_GAP_LEDGER_PARSE_PASS")
          PY

  canvas-web:
    needs: canvas-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version
      - name: Install frozen JS workspace
        run: pnpm install --frozen-lockfile
      - name: Canvas SDK NODE-55 tests
        run: pnpm --filter @lumi/canvas-sdk exec vitest run tests/canvas-node55.test.ts
      - name: Web Canvas contract tests
        run: pnpm --filter @lumi/web exec vitest run src/lib/canvas/types.test.ts
      - name: Typecheck Canvas SDK
        run: pnpm --filter @lumi/canvas-sdk typecheck
      - name: Typecheck web application
        run: pnpm --filter @lumi/web typecheck
      - name: Lint NODE-55 web surface
        run: |
          pnpm --filter @lumi/web exec eslint \
            src/lib/canvas \
            src/components/canvas \
            src/components/workspace/ai-workspace.tsx \
            'src/app/(shell)/workspace'
      - name: Production Next.js build
        run: pnpm --filter @lumi/web build
