name: NODE-73 Sandbox Boundary Closure

on:
  push:
    branches:
      - release-closure-p0
    paths:
      - .github/workflows/node73-sandbox-boundary-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-sandbox-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 1

      - name: Apply reviewed sandbox boundary fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          # Keep child execution helpers importable by the stdlib-only contract suite.
          # boto3/botocore are runtime dependencies needed only when main() creates
          # the real S3 client.
          path = root / 'services/sandbox-runtime/src/lumi_sandbox_runtime/child_cli.py'
          text = path.read_text()
          old = '''\nimport boto3\nfrom botocore.exceptions import BotoCoreError, ClientError\n'''
          assert text.count(old) == 1, 'child_cli boto import boundary drifted'
          text = text.replace(old, '\n', 1)
          marker = '''def main() -> int:\n    bucket = _required_env("LUMI_SANDBOX_EXCHANGE_BUCKET", max_length=255)\n'''
          replacement = '''def main() -> int:\n    import boto3\n    from botocore.exceptions import BotoCoreError, ClientError\n\n    bucket = _required_env("LUMI_SANDBOX_EXCHANGE_BUCKET", max_length=255)\n'''
          assert text.count(marker) == 1, 'child_cli main boundary drifted'
          path.write_text(text.replace(marker, replacement, 1))

          # The runtime already uses the stricter/current sandbox_root and canonical
          # constant forms. Align the source closure validator to those semantics.
          path = root / 'scripts/validate_sandbox_remote_runtime_closure.py'
          text = path.read_text()
          old = '''            '"HOME": str(work)',\n            '"TMPDIR": str(work)',\n            'prefix = "sandbox-exchange/v1/"',\n'''
          new = '''            '"HOME": str(sandbox_root / "work")',\n            '"TMPDIR": str(sandbox_root / "work")',\n            '_EXCHANGE_KEY_PREFIX = "sandbox-exchange/v1/"',\n            "prefix = _EXCHANGE_KEY_PREFIX",\n'''
          assert text.count(old) == 1, 'remote closure child markers drifted'
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Enforce exact diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat <<'EOF'
          scripts/validate_sandbox_remote_runtime_closure.py
          services/sandbox-runtime/src/lumi_sandbox_runtime/child_cli.py
          EOF
          )"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
          python3 -m py_compile \
            services/sandbox-runtime/src/lumi_sandbox_runtime/child_cli.py \
            scripts/validate_sandbox_remote_runtime_closure.py

      - name: Require stdlib sandbox contract PASS
        env:
          PYTHONPATH: services/sandbox-runtime/src
        run: python3 -m unittest discover -s services/sandbox-runtime/tests -p 'test_*contract.py' -v

      - name: Require remote closure validator PASS
        shell: bash
        run: |
          python3 scripts/validate_sandbox_remote_runtime_closure.py --self-test
          python3 scripts/validate_sandbox_remote_runtime_closure.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Frozen Python workspace install
        run: uv sync --all-packages --frozen

      - name: Require scoped Ruff PASS
        run: uv run ruff check --ignore E501 services/sandbox-runtime/src/lumi_sandbox_runtime/child_cli.py scripts/validate_sandbox_remote_runtime_closure.py

      - name: Require exchange file runtime PASS
        run: uv run pytest services/sandbox-runtime/tests/test_exchange_file_runtime.py -q

      - name: Commit only verified changes on unchanged branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-closure-p0 --depth=1
          test "$(git rev-parse origin/release-closure-p0)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/sandbox-runtime/src/lumi_sandbox_runtime/child_cli.py \
            scripts/validate_sandbox_remote_runtime_closure.py
          git commit -m "fix(sandbox): close stdlib and remote source boundaries"
          git push origin HEAD:release-closure-p0
