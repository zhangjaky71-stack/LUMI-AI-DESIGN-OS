name: NODE-20 Idempotency Side Effects

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/idempotency/**"
      - "apps/api/src/lumi_api/api/v1/app.py"
      - "apps/api/src/lumi_api/api/v1/errors.py"
      - "apps/api/src/lumi_api/api/v1/idempotency_middleware.py"
      - "apps/api/src/lumi_api/persistence/models_execution.py"
      - "apps/api/src/lumi_api/persistence/models_platform.py"
      - "apps/api/migrations/versions/20260816_0006_idempotency_side_effects.py"
      - "apps/api/migrations/versions/20260816_0006_sql/**"
      - "apps/api/tests/test_idempotency_*.py"
      - "tools/node20/**"
      - "docs/runtime/IDEMPOTENCY-*.md"
      - "reports/nodes/NODE-20/**"
      - ".github/workflows/node-20-idempotency.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/lumi_api/idempotency/**"
      - "apps/api/src/lumi_api/api/v1/app.py"
      - "apps/api/src/lumi_api/api/v1/errors.py"
      - "apps/api/src/lumi_api/api/v1/idempotency_middleware.py"
      - "apps/api/src/lumi_api/persistence/models_execution.py"
      - "apps/api/src/lumi_api/persistence/models_platform.py"
      - "apps/api/migrations/versions/20260816_0006_idempotency_side_effects.py"
      - "apps/api/migrations/versions/20260816_0006_sql/**"
      - "apps/api/tests/test_idempotency_*.py"
      - "tools/node20/**"
      - "docs/runtime/IDEMPOTENCY-*.md"
      - "reports/nodes/NODE-20/**"
      - ".github/workflows/node-20-idempotency.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"
  SQLALCHEMY_VERSION: "2.0.51"
  ALEMBIC_VERSION: "1.18.5"
  ASYNCPG_VERSION: "0.31.0"
  LUMI_DATABASE_MIGRATION_URL: "postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi"
  LUMI_DATABASE_MIGRATION_URL_ASYNCPG: "postgresql://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi"
  LUMI_DATABASE_APP_URL: "postgresql://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi"

jobs:
  idempotency-side-effects:
    name: idempotency-side-effects
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Validate idempotency architecture and migration
        run: PYTHONPATH=apps/api/src uv run python tools/node20/validate_idempotency.py

      - name: Run idempotency failure-injection and HTTP contracts
        run: |
          PYTHONPATH=apps/api/src uv run pytest -q \
            apps/api/tests/test_idempotency_gateway_contract.py \
            apps/api/tests/test_idempotency_http_contract.py \
            apps/api/tests/test_api_v1_contract.py

      - name: Export idempotency schemas
        run: |
          rm -rf reports/nodes/NODE-20/generated-schemas
          PYTHONPATH=apps/api/src uv run python tools/node20/export_idempotency_schemas.py
          test "$(find reports/nodes/NODE-20/generated-schemas -name '*.schema.json' | wc -l)" -eq 4

      - name: Validate schemas and gap ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("reports/nodes/NODE-20/generated-schemas").glob("*.schema.json"))
          assert len(schemas) == 4
          for path in schemas:
              json.loads(path.read_text(encoding="utf-8"))
          ledger = json.loads(Path("reports/nodes/NODE-20/gap-ledger.json").read_text(encoding="utf-8"))
          assert len(ledger["gaps"]) == 5
          print("NODE-20 schemas and gap ledger valid")
          PY

      - name: Lint and type-check NODE-20 scope
        run: |
          uv run ruff check \
            apps/api/src/lumi_api/idempotency \
            apps/api/src/lumi_api/api/v1/app.py \
            apps/api/src/lumi_api/api/v1/errors.py \
            apps/api/src/lumi_api/api/v1/idempotency_middleware.py \
            apps/api/src/lumi_api/persistence/models_execution.py \
            apps/api/src/lumi_api/persistence/models_platform.py \
            apps/api/tests/test_idempotency_gateway_contract.py \
            apps/api/tests/test_idempotency_http_contract.py \
            tools/node20
          uv run pyright \
            apps/api/src/lumi_api/idempotency \
            apps/api/src/lumi_api/api/v1/app.py \
            apps/api/src/lumi_api/api/v1/errors.py \
            apps/api/src/lumi_api/api/v1/idempotency_middleware.py \
            apps/api/src/lumi_api/persistence/models_execution.py \
            apps/api/src/lumi_api/persistence/models_platform.py \
            apps/api/tests/test_idempotency_gateway_contract.py \
            apps/api/tests/test_idempotency_http_contract.py \
            tools/node20

      - name: Start PostgreSQL
        run: |
          cp infra/compose/env.local.example infra/compose/.env
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            up -d --wait --wait-timeout 180 postgres

      - name: Upgrade through NODE-19 baseline
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade 20260816_0005

      - name: Load deterministic two-tenant fixture before NODE-20
        run: |
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -v ON_ERROR_STOP=1 -U lumi_migration -d lumi \
            < apps/api/migrations/seeds/p0_local_fixture.sql

      - name: Upgrade PostgreSQL to NODE-20 head
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade head

      - name: Validate frozen baseline plus current metadata
        run: |
          PYTHONPATH=apps/api/src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            python tools/node10/validate_schema.py

      - name: Re-run baseline PostgreSQL invariants
        run: |
          PYTHONPATH=apps/api/src uv run --no-project \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            python tools/node10/run_database_integration.py

      - name: Run NODE-20 core PostgreSQL invariants before downgrade
        run: |
          NODE20_SKIP_COST=1 PYTHONPATH=apps/api/src uv run --no-project \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            --with "pydantic==2.13.4" \
            python tools/node20/test_idempotency_database.py

      - name: Prove atomic DB side-effect crash recovery
        run: |
          PYTHONPATH=apps/api/src uv run --no-project \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            --with "pydantic==2.13.4" \
            python tools/node20/test_transactional_gateway_database.py

      - name: Downgrade NODE-20 migration only
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic downgrade 20260816_0005

      - name: Verify rollback preserves NODE-19 baseline
        run: |
          runtime_jobs="$(docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c "SELECT to_regclass('public.runtime_jobs') IS NOT NULL")"
          lease_column="$(docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c "SELECT NOT EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='idempotency_operations' AND column_name='lease_owner')")"
          cost_operation="$(docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c "SELECT NOT EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='cost_ledger' AND column_name='operation_id')")"
          test "$runtime_jobs" = "t"
          test "$lease_column" = "t"
          test "$cost_operation" = "t"

      - name: Reapply NODE-20 and run full PostgreSQL invariants
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade head
          cd ../..
          PYTHONPATH=apps/api/src uv run --no-project \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            --with "pydantic==2.13.4" \
            python tools/node20/test_idempotency_database.py

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          mkdir -p reports/nodes/NODE-20/runtime
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml ps \
            > reports/nodes/NODE-20/runtime/compose-ps.txt 2>&1 || true
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml logs \
            --no-color --tail=400 postgres \
            > reports/nodes/NODE-20/runtime/postgres.log 2>&1 || true

      - name: Upload NODE-20 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-20-idempotency-${{ github.run_id }}
          path: |
            reports/nodes/NODE-20/generated-schemas
            reports/nodes/NODE-20/gap-ledger.json
            reports/nodes/NODE-20/runtime
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            down --volumes --remove-orphans || true
