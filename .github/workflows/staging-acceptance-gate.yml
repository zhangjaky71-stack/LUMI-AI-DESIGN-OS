name: Staging Acceptance Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production-like staging API base URL (https://...)"
        required: false
        type: string
      expected_version:
        description: "Exact RC version expected from /version"
        required: false
        type: string
      host_ack:
        description: "Exact staging hostname acknowledgement"
        required: false
        type: string
      evidence_path:
        description: "Path under reports/staging-acceptance/ to completed evidence JSON"
        required: false
        type: string
      runtime_image_set_run_id:
        description: "GitHub Actions run id that produced the frozen six-runtime RC image set"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate staging acceptance contract
        run: python3 scripts/validate_staging_acceptance_contract.py
      - name: Drill immutable staging evidence artifact binding
        run: python3 scripts/validate_staging_evidence_artifacts.py --self-test
      - name: Require one canonical API provenance source union
        run: python3 scripts/validate_api_provenance_source_manifest.py
      - name: Drill frozen runtime-image build binding
        run: python3 scripts/validate_staging_runtime_image_binding.py --self-test
      - name: Require frozen runtime-image workflow anti-regression contract
        run: python3 scripts/validate_staging_runtime_image_workflow_contract.py
      - name: Drill NODE-71 decision artifact provenance
        run: python3 scripts/validate_node71_decision_artifact.py --self-test
      - name: Drill canonical media-generation E2E evidence validator
        run: python3 scripts/validate_media_generation_e2e_evidence.py --self-test
      - name: Drill canonical Tool Gateway side-effect provenance validator
        run: python3 scripts/validate_side_effect_control_provenance.py --self-test
      - name: Drill canonical Tool Gateway audit provenance validator
        run: python3 scripts/validate_tool_audit_provenance.py --self-test
      - name: Drill canonical Tool Gateway approval provenance validator
        run: python3 scripts/validate_tool_approval_provenance.py --self-test
      - name: Drill canonical Tool Gateway data provenance validator
        run: python3 scripts/validate_tool_data_provenance.py --self-test
      - name: Drill canonical Tool Gateway result-offload provenance validator
        run: python3 scripts/validate_tool_result_offload_provenance.py --self-test
      - name: Require immutable release action supply chain
        run: python3 scripts/validate_release_action_pins.py
      - name: Python syntax
        run: |
          python3 -m py_compile \
            scripts/staging-acceptance-gate.py \
            scripts/staging-preflight.py \
            scripts/validate_staging_acceptance_contract.py \
            scripts/validate_staging_evidence_artifacts.py \
            scripts/validate_api_provenance_source_manifest.py \
            scripts/validate_staging_runtime_image_binding.py \
            scripts/validate_staging_runtime_image_workflow_contract.py \
            scripts/validate_node71_decision_artifact.py \
            scripts/validate_media_generation_e2e_evidence.py \
            scripts/validate_side_effect_control_provenance.py \
            scripts/validate_tool_audit_provenance.py \
            scripts/validate_tool_approval_provenance.py \
            scripts/validate_tool_data_provenance.py \
            scripts/validate_tool_result_offload_provenance.py \
            scripts/validate_release_action_pins.py \
            scripts/validate_uv_workspace_lock.py
      - name: JSON contract syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('production/runtime-images/manifest-v1.json'),
              Path('production/release-actions/pins-v1.json'),
              Path('staging/acceptance/manifest-v1.json'),
              Path('staging/acceptance/environment-parity-v1.json'),
              Path('staging/acceptance/evidence-template.json'),
              Path('staging/acceptance/api-provenance-sources-v1.json'),
              Path('staging/acceptance/media-generation-e2e-v1.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY

  canonical-lock-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Require exact workspace membership in uv.lock
        run: python3 scripts/validate_uv_workspace_lock.py
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Require canonical lock freshness
        run: uv lock --check
      - name: Frozen repository dependency sync for every workspace package
        run: uv sync --all-packages --frozen

  remote-read-only-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.base_url != '' && inputs.expected_version != '' && inputs.host_ack != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LUMI_STAGING_BASE_URL: ${{ inputs.base_url }}
      LUMI_STAGING_EXPECTED_VERSION: ${{ inputs.expected_version }}
      LUMI_STAGING_HOST_ACK: ${{ inputs.host_ack }}
      LUMI_STAGING_ENV_ACK: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Probe staging without side effects
        run: |
          mkdir -p reports/staging-acceptance/runtime
          python3 scripts/staging-preflight.py \
            --base-url "$LUMI_STAGING_BASE_URL" \
            --expected-version "$LUMI_STAGING_EXPECTED_VERSION" \
            --output reports/staging-acceptance/runtime/preflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-read-only-preflight
          path: reports/staging-acceptance/runtime/preflight.json

  acceptance-decision:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_path != '' && inputs.runtime_image_set_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      LUMI_STAGING_EVIDENCE_PATH: ${{ inputs.evidence_path }}
      LUMI_RUNTIME_IMAGE_SET_RUN_ID: ${{ inputs.runtime_image_set_run_id }}
      RUNTIME_IMAGE_SET_DIR: reports/staging-acceptance/runtime/runtime-image-set
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate evidence path and resolve exact runtime-image artifact identity
        id: runtime_image_binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ['LUMI_STAGING_EVIDENCE_PATH']
          run_id = os.environ['LUMI_RUNTIME_IMAGE_SET_RUN_ID']
          if not run_id.isdecimal() or int(run_id) <= 0:
              raise SystemExit('runtime_image_set_run_id must be a positive decimal GitHub Actions run id')
          workspace = Path.cwd().resolve()
          root = (workspace / 'reports' / 'staging-acceptance').resolve()
          target = (workspace / raw).resolve()
          if target.suffix != '.json' or root not in target.parents:
              raise SystemExit('evidence_path must resolve to a JSON file below reports/staging-acceptance/')
          if not target.is_file():
              raise SystemExit('evidence_path does not exist')
          payload = json.loads(target.read_text(encoding='utf-8'))
          rc = payload.get('release_candidate')
          if not isinstance(rc, dict):
              raise SystemExit('release_candidate is missing from staging evidence')
          rc_sha = rc.get('git_sha')
          if not isinstance(rc_sha, str) or len(rc_sha) != 40 or any(c not in '0123456789abcdefABCDEF' for c in rc_sha):
              raise SystemExit('staging evidence RC SHA is invalid')
          rc_sha = rc_sha.lower()
          artifact_name = f'runtime-image-set-{rc_sha}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'rc_sha={rc_sha}\n')
              fh.write(f'artifact_name={artifact_name}\n')
          print(target.relative_to(workspace))
          print(artifact_name)
          PY
      - name: Bind every PASS claim to immutable staging evidence artifact bytes and live producer runs
        env:
          STAGING_EVIDENCE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/validate_staging_evidence_artifacts.py
          --evidence "$LUMI_STAGING_EVIDENCE_PATH"
          --require-live-producers
          --output reports/staging-acceptance/runtime/evidence-artifact-binding.json
      - name: Download frozen runtime-image set from exact build run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-image-set-${{ steps.runtime_image_binding.outputs.rc_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_image_set_run_id }}
          path: ${{ env.RUNTIME_IMAGE_SET_DIR }}
      - name: Require exact frozen image-set and attestation report pair
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNTIME_IMAGE_SET_DIR/container-image-set.json"
          test -f "$RUNTIME_IMAGE_SET_DIR/attestation-verification.json"
          test "$(find "$RUNTIME_IMAGE_SET_DIR" -maxdepth 1 -type f -name 'container-image-set.json' | wc -l)" -eq 1
          test "$(find "$RUNTIME_IMAGE_SET_DIR" -maxdepth 1 -type f -name 'attestation-verification.json' | wc -l)" -eq 1
          python3 -m json.tool "$RUNTIME_IMAGE_SET_DIR/container-image-set.json" >/dev/null
          python3 -m json.tool "$RUNTIME_IMAGE_SET_DIR/attestation-verification.json" >/dev/null
      - name: Bind NODE-71 evidence to the exact verified six-runtime build artifact
        run: >-
          python3 scripts/validate_staging_runtime_image_binding.py
          --evidence "$LUMI_STAGING_EVIDENCE_PATH"
          --image-set "$RUNTIME_IMAGE_SET_DIR/container-image-set.json"
          --attestation-report "$RUNTIME_IMAGE_SET_DIR/attestation-verification.json"
          --expected-run-id "$LUMI_RUNTIME_IMAGE_SET_RUN_ID"
      - name: Require canonical Tool Gateway side-effect API provenance
        run: >-
          python3 scripts/validate_side_effect_control_provenance.py
          --evidence "$LUMI_STAGING_EVIDENCE_PATH"
      - name: Require canonical Tool Gateway audit API provenance
        run: >-
          python3 scripts/validate_tool_audit_provenance.py
          --evidence "$LUMI_STAGING_EVIDENCE_PATH"
      - name: Require canonical Tool Gateway approval API provenance
        run: >-
          python3 scripts/validate_tool_approval_provenance.py
          --evidence "$LUMI_STAGING_EVIDENCE_PATH"
      - name: Require canonical Tool Gateway data provenance
        run: >-
          python3 scripts/validate_tool_data_provenance.py
          --evidence "$LUMI_STAGING_EVIDENCE_PATH"
      - name: Require canonical Tool Gateway result-offload provenance
        run: >-
          python3 scripts/validate_tool_result_offload_provenance.py
          --evidence "$LUMI_STAGING_EVIDENCE_PATH"
      - name: Require structured canonical media-generation E2E evidence
        run: >-
          python3 scripts/validate_media_generation_e2e_evidence.py
          --evidence "$LUMI_STAGING_EVIDENCE_PATH"
      - name: Evaluate completed staging evidence
        run: |
          mkdir -p reports/staging-acceptance/runtime
          python3 scripts/staging-acceptance-gate.py \
            --evidence "$LUMI_STAGING_EVIDENCE_PATH" \
            --output reports/staging-acceptance/runtime/decision.json \
            --markdown reports/staging-acceptance/runtime/decision.md
      - name: Capture immutable NODE-71 decision workflow provenance
        env:
          NODE71_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 scripts/validate_node71_decision_artifact.py
          --decision reports/staging-acceptance/runtime/decision.json
          --write-provenance reports/staging-acceptance/runtime/decision-provenance.json
          --expected-run-id "${{ github.run_id }}"
          --expected-repository "${{ github.repository }}"
          --workflow-run-url "$NODE71_RUN_URL"
      - name: Self-verify NODE-71 decision provenance before archive
        run: >-
          python3 scripts/validate_node71_decision_artifact.py
          --decision reports/staging-acceptance/runtime/decision.json
          --provenance reports/staging-acceptance/runtime/decision-provenance.json
          --expected-run-id "${{ github.run_id }}"
          --expected-repository "${{ github.repository }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: staging-acceptance-decision
          path: reports/staging-acceptance/runtime/

  contract-gate:
    if: always()
    needs: [source-contract, canonical-lock-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and frozen dependency gates
        run: |
          test "${{ needs.source-contract.result }}" = "success"
          test "${{ needs.canonical-lock-gate.result }}" = "success"
