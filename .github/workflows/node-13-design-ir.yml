name: NODE-13 Design IR

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/design_ir/**"
      - "apps/api/tests/test_design_ir_contract.py"
      - "tools/node13/**"
      - "docs/design-ir/**"
      - "docs/nodes/NODE-13-DESIGN-IR.md"
      - "reports/nodes/NODE-13/**"
      - ".github/workflows/node-13-design-ir.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/lumi_api/design_ir/**"
      - "apps/api/tests/test_design_ir_contract.py"
      - "tools/node13/**"
      - "docs/design-ir/**"
      - "reports/nodes/NODE-13/**"
      - ".github/workflows/node-13-design-ir.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  design-ir:
    name: design-ir
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Validate Design IR architecture and schema contract
        run: |
          PYTHONPATH=apps/api/src uv run python tools/node13/validate_design_ir.py

      - name: Run executable Design IR contract tests
        run: |
          PYTHONPATH=apps/api/src uv run pytest -q apps/api/tests/test_design_ir_contract.py

      - name: Export machine-readable Design IR schemas
        run: |
          rm -rf reports/nodes/NODE-13/generated-schemas
          PYTHONPATH=apps/api/src uv run python tools/node13/export_design_schemas.py
          test -s reports/nodes/NODE-13/generated-schemas/design-ir-v1.schema.json
          test -s reports/nodes/NODE-13/generated-schemas/design-operation-batch-v1.schema.json

      - name: Validate exported JSON schema files parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("reports/nodes/NODE-13/generated-schemas")
          for path in sorted(root.glob("*.schema.json")):
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"validated {path}")
          PY

      - name: Upload generated Design IR schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-13-design-ir-schemas-${{ github.run_id }}
          path: reports/nodes/NODE-13/generated-schemas
          if-no-files-found: error
          retention-days: 14
