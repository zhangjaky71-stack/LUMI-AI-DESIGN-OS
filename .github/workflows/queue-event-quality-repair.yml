name: Final Release Quality Repair

on:
  push:
    branches: [release-closure-p0]
    paths:
      - .github/workflows/queue-event-quality-repair.yml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen

      - name: Reapply reviewed quality-only repair payload
        shell: bash
        run: |
          set -euo pipefail
          git show 7487ef7b6d11c9fb24db18dc317aa2fff2537123:.github/workflows/queue-event-quality-repair.yml > /tmp/quality-repair-source.yml
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          text = Path("/tmp/quality-repair-source.yml").read_text(encoding="utf-8")
          start_marker = "      - name: Apply reviewed quality-only repairs\n        run: |\n"
          end_marker = "\n      - name: Format touched Python files\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("reviewed quality repair payload markers drifted")
          body = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path("/tmp/apply-reviewed-quality-repair.sh").write_text(dedent(body), encoding="utf-8")
          PY
          bash /tmp/apply-reviewed-quality-repair.sh

      - name: Format touched Python files
        run: |
          uv run ruff format \
            services/image-generation/src/lumi_image_generation/image_validation.py \
            apps/agent-runtime/tests/test_agent_registry.py \
            apps/api/alembic/versions/0014_agent_registry_provenance.py \
            scripts/validate_agent_registry_contract.py \
            apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/approval_bridge.py \
            apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/containers.py \
            apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/loader.py \
            apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/registry.py \
            scripts/validate_recipe_engine_contract.py

      - name: Exact Ruff gates
        run: |
          uv run ruff check --ignore E501 \
            services/image-generation/src \
            services/image-generation/tests \
            apps/api/src/lumi_api/generations/service.py
          uv run ruff check \
            apps/agent-runtime/src/lumi_agent_runtime/agent_registry \
            apps/agent-runtime/tests/test_agent_registry.py \
            apps/agent-runtime/tests/test_agent_registry_release.py \
            apps/agent-runtime/tests/test_agent_registry_provenance_store.py \
            apps/api/src/lumi_api/persistence/models/agent_registry.py \
            apps/api/src/lumi_api/persistence/models/__init__.py \
            apps/api/alembic/versions/0014_agent_registry_provenance.py \
            scripts/validate_agent_registry_contract.py \
            scripts/integration_agent_registry.py \
            scripts/integration_agent_registry_release.py
          uv run ruff check \
            apps/agent-runtime/src/lumi_agent_runtime/recipe_engine \
            apps/agent-runtime/tests/test_recipe_expression.py \
            apps/agent-runtime/tests/test_recipe_dag.py \
            apps/agent-runtime/tests/test_recipe_release.py \
            scripts/validate_recipe_engine_contract.py \
            scripts/integration_recipe_engine.py \
            scripts/integration_recipe_engine_mock.py

      - name: NODE-46 image tests and Pyright
        env:
          PYTHONPATH: services/image-generation/src:services/model-gateway/src:services/asset-intelligence/src:services/artifact-history/src:services/brand-rules/src:services/identity-engine/src:services/domain/src
        run: |
          uv run pytest services/image-generation/tests -q
          uv run pyright -p services/image-generation/pyrightconfig.json

      - name: NODE-30 Agent Registry contract tests and Pyright
        run: |
          uv run python scripts/validate_agent_registry_contract.py
          uv run pytest \
            apps/agent-runtime/tests/test_agent_registry.py \
            apps/agent-runtime/tests/test_agent_registry_release.py \
            apps/agent-runtime/tests/test_agent_registry_provenance_store.py -q
          uv run pyright apps/agent-runtime/src/lumi_agent_runtime/agent_registry \
            apps/agent-runtime/tests/test_agent_registry.py \
            apps/agent-runtime/tests/test_agent_registry_release.py \
            apps/agent-runtime/tests/test_agent_registry_provenance_store.py

      - name: NODE-32 Recipe contract tests and Pyright
        run: |
          PYTHONPATH=apps/agent-runtime/src uv run python scripts/validate_recipe_engine_contract.py
          uv run pytest \
            apps/agent-runtime/tests/test_recipe_expression.py \
            apps/agent-runtime/tests/test_recipe_dag.py \
            apps/agent-runtime/tests/test_recipe_release.py -q
          uv run pyright apps/agent-runtime/src/lumi_agent_runtime/recipe_engine \
            apps/agent-runtime/tests/test_recipe_expression.py \
            apps/agent-runtime/tests/test_recipe_dag.py \
            apps/agent-runtime/tests/test_recipe_release.py

      - name: Patch sanity
        run: git diff --check

      - name: Commit validated quality repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/image-generation/src/lumi_image_generation/image_validation.py \
            apps/agent-runtime/tests/test_agent_registry.py \
            apps/api/alembic/versions/0014_agent_registry_provenance.py \
            scripts/validate_agent_registry_contract.py \
            apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/approval_bridge.py \
            apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/containers.py \
            apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/loader.py \
            apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/registry.py \
            scripts/validate_recipe_engine_contract.py
          if git diff --cached --quiet; then
            echo "No quality repair changes remain."
            exit 0
          fi
          git commit -m "fix: close final static quality blockers [skip ci]"
          git push origin HEAD:release-closure-p0