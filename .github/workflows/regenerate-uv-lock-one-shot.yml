name: One-shot Canonical UV Lock Regeneration

on:
  push:
    branches:
      - release-closure-p0

permissions:
  contents: read

concurrency:
  group: node73-one-shot-regenerate-uv-lock
  cancel-in-progress: false

env:
  TARGET_REF: release-closure-p0
  EXPECTED_TRIGGER_MESSAGE: "ci(release): one-shot regenerate canonical uv lock"

jobs:
  regenerate-lock:
    if: github.ref == 'refs/heads/release-closure-p0' && github.event.head_commit.message == 'ci(release): one-shot regenerate canonical uv lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.lock_meta.outputs.changed }}
      lock_sha256: ${{ steps.lock_meta.outputs.lock_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Require exact immutable trigger revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "zhangjaky71-stack/LUMI-AI-DESIGN-OS"
          test "$GITHUB_REF" = "refs/heads/${TARGET_REF}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Preserve canonical regeneration contract
        run: |
          python3 scripts/validate_uv_lock_regeneration_contract.py
          python3 scripts/validate_release_action_pins.py

      - name: Regenerate uv.lock with pinned resolver
        run: uv lock

      - name: Require uv.lock to be the only generated path
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -gt 1 ]; then
            printf 'unexpected generated path: %s\n' "${changed[@]}" >&2
            exit 1
          fi
          if [ "${#changed[@]}" -eq 1 ] && [ "${changed[0]}" != "uv.lock" ]; then
            printf 'unexpected generated path: %s\n' "${changed[0]}" >&2
            exit 1
          fi
          git diff --check -- uv.lock

      - name: Verify regenerated workspace lock
        run: |
          python3 scripts/validate_uv_workspace_lock.py
          uv lock --check
          uv sync --all-packages --frozen

      - name: Compile release-critical Python under frozen lock
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/node73-one-shot-compileall
        run: >-
          uv run --frozen python -m compileall -q
          scripts/validate_uv_lock_regeneration_contract.py
          scripts/validate_uv_workspace_lock.py
          scripts/staging-acceptance-gate.py
          scripts/validate_staging_acceptance_contract.py
          scripts/final-acceptance-gate.py
          scripts/validate_final_acceptance_contract.py
          apps/api/src/lumi_api/product_app.py
          apps/api/src/lumi_api/generations
          apps/api/src/lumi_api/media_dispatch.py

      - name: Require no post-resolver workspace mutation outside uv.lock
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files --others --exclude-standard)"
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -gt 1 ]; then
            printf 'unexpected post-resolver path: %s\n' "${changed[@]}" >&2
            exit 1
          fi
          if [ "${#changed[@]}" -eq 1 ] && [ "${changed[0]}" != "uv.lock" ]; then
            printf 'unexpected post-resolver path: %s\n' "${changed[0]}" >&2
            exit 1
          fi
          git diff --check -- uv.lock

      - name: Freeze regenerated lock identity
        id: lock_meta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            changed=false
          else
            changed=true
          fi
          lock_sha256="$(sha256sum uv.lock | awk '{print $1}')"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "lock_sha256=$lock_sha256" >> "$GITHUB_OUTPUT"
          printf 'changed=%s\nlock_sha256=%s\n' "$changed" "$lock_sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node73-one-shot-uv-lock-${{ github.sha }}
          path: uv.lock
          if-no-files-found: error
          retention-days: 7

  commit-lock:
    if: needs.regenerate-lock.result == 'success' && needs.regenerate-lock.outputs.changed == 'true'
    needs: [regenerate-lock]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node73-one-shot-uv-lock-${{ github.sha }}
          path: _node73-one-shot-lock

      - name: Verify immutable resolver artifact
        shell: bash
        env:
          EXPECTED_LOCK_SHA256: ${{ needs.regenerate-lock.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          artifact="_node73-one-shot-lock/uv.lock"
          test -f "$artifact"
          test ! -L "$artifact"
          test "$(find _node73-one-shot-lock -type f | wc -l)" -eq 1
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test "$(sha256sum uv.lock | awk '{print $1}')" != "$EXPECTED_LOCK_SHA256"
          cp "$artifact" uv.lock
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "uv.lock"
          git diff --check -- uv.lock

      - name: Commit uv.lock only if branch did not move
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          auth_header="AUTHORIZATION: basic $basic"
          git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags origin "+refs/heads/${TARGET_REF}:refs/remotes/origin/${TARGET_REF}"
          test "$(git rev-parse "origin/${TARGET_REF}")" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- uv.lock
          test "$(git diff --cached --name-only)" = "uv.lock"
          git commit -m "chore(release): regenerate canonical uv lock"
          git -c http.https://github.com/.extraheader="$auth_header" push origin "HEAD:${TARGET_REF}"
