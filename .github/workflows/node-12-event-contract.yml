name: NODE-12 Event Contract

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/events/**"
      - "apps/api/tests/test_event_contract.py"
      - "tools/node12/**"
      - "docs/events/**"
      - "docs/nodes/NODE-12-EVENT-CONTRACT.md"
      - "reports/nodes/NODE-12/**"
      - ".github/workflows/node-12-event-contract.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/lumi_api/events/**"
      - "apps/api/tests/test_event_contract.py"
      - "tools/node12/**"
      - "docs/events/**"
      - "reports/nodes/NODE-12/**"
      - ".github/workflows/node-12-event-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  event-contract:
    name: event-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Validate event architecture and schema registry
        run: |
          PYTHONPATH=apps/api/src uv run python tools/node12/validate_event_contract.py

      - name: Run executable event contract tests
        run: |
          PYTHONPATH=apps/api/src uv run pytest -q apps/api/tests/test_event_contract.py
