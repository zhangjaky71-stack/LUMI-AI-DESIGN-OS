name: Runtime Image Closure Contract

on:
  pull_request:
    paths:
      - "apps/api/Dockerfile"
      - "apps/api/src/lumi_api/cli.py"
      - "apps/api/src/lumi_api/product_app.py"
      - "apps/api/src/lumi_api/idempotency/**"
      - "apps/api/src/lumi_api/tool_side_effect_control.py"
      - "apps/api/src/lumi_api/tool_audit_control.py"
      - "apps/api/src/lumi_api/tool_approval_control.py"
      - "apps/api/src/lumi_api/tool_data_control.py"
      - "apps/api/alembic/versions/0021_tool_approval_scope.py"
      - "apps/agent-runtime/Dockerfile"
      - "apps/agent-runtime/pyproject.toml"
      - "apps/agent-runtime/src/lumi_agent_runtime/runtime_*.py"
      - "apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/**"
      - "services/model-gateway/Dockerfile"
      - "apps/api/src/lumi_api/model_gateway_*.py"
      - "services/tool-gateway/Dockerfile"
      - "services/tool-gateway/pyproject.toml"
      - "services/tool-gateway/src/lumi_tool_gateway/**"
      - "services/asset-storage/src/lumi_asset_storage/s3.py"
      - "apps/worker-media/Dockerfile"
      - "apps/worker-media/src/lumi_worker_media/**"
      - "services/sandbox-runtime/Dockerfile"
      - "services/sandbox-runtime/pyproject.toml"
      - "services/sandbox-runtime/src/lumi_sandbox_runtime/**"
      - "infra/iac/modules/platform-app/**"
      - "infra/iac/modules/storage/**"
      - "infra/iac/modules/compute/**"
      - "infra/iac/environments/staging/core/**"
      - "infra/iac/environments/staging/app/**"
      - "infra/iac/environments/production/core/**"
      - "infra/iac/environments/production/app/**"
      - "production/runtime-images/**"
      - "production/release-actions/**"
      - "staging/acceptance/evidence-template.json"
      - "scripts/runtime_image_set.py"
      - "scripts/validate_release_action_pins.py"
      - "scripts/validate_release_workflow_permissions.py"
      - "scripts/validate_uv_lock_regeneration_contract.py"
      - "scripts/validate_runtime_image_build_pipeline.py"
      - "scripts/validate_runtime_image_set_contract.py"
      - "scripts/validate_runtime_image_closure.py"
      - "scripts/validate_side_effect_control_provenance.py"
      - "scripts/validate_tool_audit_provenance.py"
      - "scripts/validate_tool_approval_provenance.py"
      - "scripts/validate_tool_data_provenance.py"
      - "scripts/validate_tool_result_offload_provenance.py"
      - ".github/workflows/build-runtime-image-set.yml"
      - ".github/workflows/regenerate-uv-lock.yml"
      - ".github/workflows/staging-acceptance-gate.yml"
      - ".github/workflows/production-iac-contract.yml"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/final-acceptance-gate.yml"
      - ".github/workflows/runtime-image-closure-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-image-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Compile runtime closure validator and hosted entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/runtime_image_set.py \
            scripts/validate_release_action_pins.py \
            scripts/validate_release_workflow_permissions.py \
            scripts/validate_uv_lock_regeneration_contract.py \
            scripts/validate_runtime_image_build_pipeline.py \
            scripts/validate_runtime_image_set_contract.py \
            scripts/validate_runtime_image_closure.py \
            scripts/validate_side_effect_control_provenance.py \
            scripts/validate_tool_audit_provenance.py \
            scripts/validate_tool_approval_provenance.py \
            scripts/validate_tool_data_provenance.py \
            scripts/validate_tool_result_offload_provenance.py
          for path in \
            apps/api/src/lumi_api/cli.py \
            apps/api/src/lumi_api/product_app.py \
            apps/api/src/lumi_api/tool_side_effect_control.py \
            apps/api/src/lumi_api/tool_audit_control.py \
            apps/api/src/lumi_api/tool_approval_control.py \
            apps/api/src/lumi_api/tool_data_control.py \
            apps/agent-runtime/src/lumi_agent_runtime/runtime_cli.py \
            apps/agent-runtime/src/lumi_agent_runtime/runtime_service.py \
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/runtime_factory.py \
            services/tool-gateway/src/lumi_tool_gateway/cli.py \
            services/tool-gateway/src/lumi_tool_gateway/service.py \
            services/tool-gateway/src/lumi_tool_gateway/http_transport.py \
            services/tool-gateway/src/lumi_tool_gateway/data_control.py \
            services/tool-gateway/src/lumi_tool_gateway/web_transport.py \
            services/tool-gateway/src/lumi_tool_gateway/sandbox_transport.py \
            services/tool-gateway/src/lumi_tool_gateway/side_effect_control.py \
            services/tool-gateway/src/lumi_tool_gateway/audit_control.py \
            services/tool-gateway/src/lumi_tool_gateway/approval_control.py \
            services/tool-gateway/src/lumi_tool_gateway/result_offload.py \
            apps/worker-media/src/lumi_worker_media/worker_cli.py \
            services/sandbox-runtime/src/lumi_sandbox_runtime/cli.py \
            services/sandbox-runtime/src/lumi_sandbox_runtime/service.py; do
            python -m compileall -q "$path"
          done

      - name: Require all six runtimes to have real frozen production image closure
        run: |
          python scripts/validate_runtime_image_closure.py
          python scripts/runtime_image_set.py validate-manifest
          python scripts/validate_runtime_image_build_pipeline.py
          python scripts/validate_runtime_image_set_contract.py
          python scripts/validate_release_action_pins.py
          python scripts/validate_release_workflow_permissions.py
          python scripts/validate_uv_lock_regeneration_contract.py

      - name: Require canonical Tool Gateway production binding provenance
        run: |
          python scripts/validate_side_effect_control_provenance.py --self-test
          python scripts/validate_tool_audit_provenance.py --self-test
          python scripts/validate_tool_approval_provenance.py --self-test
          python scripts/validate_tool_data_provenance.py --self-test
          python scripts/validate_tool_result_offload_provenance.py --self-test
