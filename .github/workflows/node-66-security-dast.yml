name: NODE-66 Security DAST

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 3"

permissions:
  contents: read

jobs:
  staging-baseline:
    name: staging-baseline
    if: vars.LUMI_STAGING_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Validate configured staging target
        env:
          TARGET_URL: ${{ vars.LUMI_STAGING_URL }}
        run: |
          python - <<'PY'
          import ipaddress
          import os
          import socket
          from urllib.parse import urlsplit

          value = os.environ["TARGET_URL"].strip()
          parsed = urlsplit(value)
          if parsed.scheme != "https":
              raise SystemExit("NODE66_DAST_TARGET_MUST_USE_HTTPS")
          if not parsed.hostname:
              raise SystemExit("NODE66_DAST_TARGET_HOST_REQUIRED")
          if parsed.username or parsed.password:
              raise SystemExit("NODE66_DAST_TARGET_CREDENTIALS_FORBIDDEN")
          if parsed.query or parsed.fragment:
              raise SystemExit("NODE66_DAST_TARGET_QUERY_FRAGMENT_FORBIDDEN")
          hostname = parsed.hostname.rstrip(".").casefold()
          if hostname in {"localhost", "metadata.google.internal", "host.docker.internal"}:
              raise SystemExit("NODE66_DAST_TARGET_INTERNAL_HOST_FORBIDDEN")

          try:
              literal = ipaddress.ip_address(hostname)
          except ValueError:
              literal = None

          if literal is not None:
              addresses = {str(literal)}
          else:
              try:
                  rows = socket.getaddrinfo(hostname, parsed.port or 443, type=socket.SOCK_STREAM)
              except OSError as exc:
                  raise SystemExit("NODE66_DAST_TARGET_DNS_RESOLUTION_FAILED") from exc
              addresses = {row[4][0] for row in rows}
              if not addresses:
                  raise SystemExit("NODE66_DAST_TARGET_DNS_EMPTY")

          for raw in sorted(addresses):
              try:
                  address = ipaddress.ip_address(raw.split("%", 1)[0])
              except ValueError as exc:
                  raise SystemExit("NODE66_DAST_TARGET_DNS_ADDRESS_INVALID") from exc
              if not address.is_global:
                  raise SystemExit(f"NODE66_DAST_TARGET_NON_GLOBAL_IP_FORBIDDEN:{address}")

          print(
              "NODE66_DAST_TARGET_VALID:"
              f"{hostname}:addresses={','.join(sorted(addresses))}"
          )
          PY

      - name: Run blocking OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.LUMI_STAGING_URL }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: node-66-zap-baseline-${{ github.run_id }}
          cmd_options: "-a"
