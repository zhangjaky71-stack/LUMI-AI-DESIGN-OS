name: Release Projects Formatting Fix

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-projects-format-fix.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-projects-format-fix
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install JS workspace
        run: pnpm install --frozen-lockfile
      - name: Format exact Projects backlog
        run: |
          pnpm exec prettier --write \
            apps/web/src/lib/projects/client-utils.ts \
            apps/web/src/lib/projects/contracts.ts \
            apps/web/src/lib/projects/projects-gateway.ts \
            apps/web/src/lib/projects/projects-server.ts \
            apps/web/src/lib/projects/types.ts \
            apps/web/e2e/projects.spec.ts
          git diff --check
      - name: Verify canonical Projects formatting scope
        run: pnpm exec prettier --check "apps/web/src/app/app/projects/**/*.{ts,tsx}" "apps/web/src/components/projects/**/*.{ts,tsx,css}" "apps/web/src/lib/projects/**/*.{ts,tsx}" "apps/web/e2e/projects.spec.ts"
      - name: Validate Projects architecture boundaries
        run: |
          python scripts/validate_app_shell.py
          python scripts/validate_projects_ui.py
      - name: Validate Web type and lint gates
        run: |
          pnpm --filter @lumi/web typecheck
          pnpm --filter @lumi/web lint
      - name: Validate Projects and App Shell regressions
        run: |
          pnpm --filter @lumi/web exec vitest run src/lib/projects
          pnpm --filter @lumi/web exec vitest run src/lib/app-shell/api-client.test.ts src/lib/app-shell/query-cache.test.ts
      - name: Commit verified Projects formatting closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/lib/projects/client-utils.ts \
            apps/web/src/lib/projects/contracts.ts \
            apps/web/src/lib/projects/projects-gateway.ts \
            apps/web/src/lib/projects/projects-server.ts \
            apps/web/src/lib/projects/types.ts \
            apps/web/e2e/projects.spec.ts
          git diff --cached --quiet && { echo 'No Projects formatting change to commit' >&2; exit 1; }
          git commit -m "style(projects): close canonical formatting gate"
          git push origin HEAD:release-closure-p0
