name: NODE-64 Admin Console

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/admin/**"
      - "apps/api/src/lumi_api/api/v1/admin_*.py"
      - "apps/api/src/lumi_api/api/v1/app.py"
      - "apps/api/src/lumi_api/persistence/models_admin.py"
      - "apps/api/src/lumi_api/persistence/models.py"
      - "apps/api/migrations/versions/20260818_0024_admin_console.py"
      - "apps/api/migrations/versions/20260818_0024_sql/**"
      - "apps/api/tests/test_admin_node64.py"
      - "apps/admin/**"
      - "tools/node64/**"
      - "docs/nodes/NODE-64-ADMIN-CONSOLE.md"
      - "reports/nodes/NODE-64/**"
      - ".github/workflows/node-64-admin-console.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.4.0"
  SQLALCHEMY_VERSION: "2.0.51"
  ALEMBIC_VERSION: "1.18.5"
  ASYNCPG_VERSION: "0.31.0"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_LUMI_API_ORIGIN: "http://127.0.0.1:8000"
  LUMI_DATABASE_MIGRATION_URL: "postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi"

jobs:
  admin-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen Python workspace
        run: uv sync --all-packages --frozen

      - name: Compile NODE-64 contracts
        run: |
          uv run python -m compileall -q \
            apps/api/src/lumi_api/admin \
            apps/api/src/lumi_api/api/v1/admin_auth_guard.py \
            apps/api/src/lumi_api/api/v1/admin_dependencies.py \
            apps/api/src/lumi_api/api/v1/admin_routes.py \
            apps/api/src/lumi_api/api/v1/admin_schemas.py \
            apps/api/src/lumi_api/persistence/models_admin.py \
            apps/api/migrations/versions/20260818_0024_admin_console.py \
            apps/api/tests/test_admin_node64.py \
            tools/node64

      - name: Static Admin acceptance
        run: uv run python tools/node64/validate_admin.py

      - name: NODE-64 contract tests
        run: uv run pytest -q apps/api/tests/test_admin_node64.py

      - name: API composition regression
        run: uv run pytest -q apps/api/tests/test_api_v1_contract.py

      - name: Ruff NODE-64 backend
        run: |
          uv run ruff check --ignore E501,I001 \
            apps/api/src/lumi_api/admin \
            apps/api/src/lumi_api/api/v1/admin_auth_guard.py \
            apps/api/src/lumi_api/api/v1/admin_dependencies.py \
            apps/api/src/lumi_api/api/v1/admin_routes.py \
            apps/api/src/lumi_api/api/v1/admin_schemas.py \
            apps/api/src/lumi_api/persistence/models_admin.py \
            apps/api/tests/test_admin_node64.py \
            tools/node64

      - name: Pyright NODE-64 backend
        run: |
          uv run pyright \
            apps/api/src/lumi_api/admin \
            apps/api/src/lumi_api/api/v1/admin_auth_guard.py \
            apps/api/src/lumi_api/api/v1/admin_dependencies.py \
            apps/api/src/lumi_api/api/v1/admin_routes.py \
            apps/api/src/lumi_api/api/v1/admin_schemas.py \
            apps/api/src/lumi_api/persistence/models_admin.py

      - name: Prepare local PostgreSQL
        run: |
          cp infra/compose/env.local.example infra/compose/.env
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml up -d --wait --wait-timeout 180 postgres

      - name: Apply full migration chain through admin console
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade head

      - name: Verify durable Admin schema
        run: |
          result="$(docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c \
            "SELECT concat_ws(',',
              to_regclass('public.platform_admin_principals'),
              to_regclass('public.platform_admin_audit_events'),
              to_regclass('public.platform_feature_flags'),
              to_regclass('public.platform_break_glass_grants'));" )"
          test "$result" = "platform_admin_principals,platform_admin_audit_events,platform_feature_flags,platform_break_glass_grants"
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c \
            "SELECT count(*) FROM pg_trigger WHERE tgname IN ('trg_platform_admin_audit_immutable','trg_platform_break_glass_immutable') AND NOT tgisinternal;" | grep -qx 2

      - name: Verify append-only Admin audit
        run: |
          compose="docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml"
          $compose exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -v ON_ERROR_STOP=1 -U lumi_migration -d lumi -c \
            "INSERT INTO users(id,email,display_name,created_at,updated_at,version)
             VALUES ('00000000-0000-7000-8000-000000000641','node64-ci@example.invalid','NODE64 CI',now(),now(),1);
             INSERT INTO platform_admin_audit_events(id,actor_user_id,actor_role,action,resource_type,reason,metadata_json,created_at)
             VALUES ('00000000-0000-7000-8000-000000000642','00000000-0000-7000-8000-000000000641','OPS','ci.verify','schema','NODE64 CI immutable audit','{}'::jsonb,now());"
          if $compose exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -v ON_ERROR_STOP=1 -U lumi_migration -d lumi -c \
            "UPDATE platform_admin_audit_events SET action='ci.mutated' WHERE id='00000000-0000-7000-8000-000000000642';"; then
            echo "Admin audit mutation unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Parse NODE-64 gap ledger
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path("reports/nodes/NODE-64/gap-ledger.json").read_text(encoding="utf-8"))
          assert ledger["node"] == "NODE-64"
          assert ledger["status"] == "CORE_IMPLEMENTED_VALIDATING_NOT_COMPLETE"
          assert any(gap["severity"] == "P0" and gap["status"] == "open" for gap in ledger["gaps"])
          assert any(gap["id"] == "NODE64-GAP-201" and gap["status"] == "closed" for gap in ledger["gaps"])
          assert any(gap["id"] == "NODE64-GAP-205" and gap["status"] == "closed" for gap in ledger["gaps"])
          print("NODE64_GAP_LEDGER_PARSE_PASS")
          PY

      - name: PostgreSQL diagnostics
        if: failure()
        run: |
          mkdir -p reports/nodes/NODE-64/runtime
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml ps > reports/nodes/NODE-64/runtime/compose-ps.txt 2>&1 || true
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml logs --no-color --tail=300 postgres > reports/nodes/NODE-64/runtime/postgres.log 2>&1 || true

      - name: Upload NODE-64 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-64-admin-${{ github.run_id }}
          path: reports/nodes/NODE-64/runtime
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup PostgreSQL
        if: always()
        run: docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml down --volumes --remove-orphans || true

  admin-web:
    needs: admin-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install frozen JS workspace
        run: pnpm install --frozen-lockfile

      - name: Admin parser tests
        run: pnpm --filter @lumi/admin exec vitest run src/lib/admin/types.test.ts

      - name: Typecheck admin application
        run: pnpm --filter @lumi/admin typecheck

      - name: Lint NODE-64 admin surface
        run: |
          pnpm --filter @lumi/admin exec eslint \
            src/lib/admin \
            src/components/admin-console.tsx \
            src/app/page.tsx

      - name: Production Admin Next.js build
        run: pnpm --filter @lumi/admin build
