name: Release App Shell Canonical Format Fix

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-app-shell-format-fix.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-app-shell-format-fix
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install frozen JS workspace
        run: pnpm install --frozen-lockfile
      - name: Apply canonical App Shell formatting
        run: |
          pnpm exec prettier --write \
            "apps/web/src/app/**/*.{ts,tsx,css}" \
            "apps/web/src/components/**/*.{ts,tsx,css}" \
            "apps/web/src/lib/app-shell/**/*.{ts,tsx}" \
            "apps/web/e2e/app-shell.spec.ts"
      - name: Verify canonical App Shell formatting
        run: |
          pnpm exec prettier --check \
            "apps/web/src/app/**/*.{ts,tsx,css}" \
            "apps/web/src/components/**/*.{ts,tsx,css}" \
            "apps/web/src/lib/app-shell/**/*.{ts,tsx}" \
            "apps/web/e2e/app-shell.spec.ts"
      - name: Verify full Web ESLint
        run: pnpm --filter @lumi/web lint
      - name: Verify Web typecheck
        run: pnpm --filter @lumi/web typecheck
      - name: Verify App Shell units
        run: pnpm --filter @lumi/web exec vitest run src/lib/app-shell
      - name: Verify full Web unit suite
        run: pnpm --filter @lumi/web test
      - name: Commit verified formatting and self-remove
        run: |
          rm .github/workflows/release-app-shell-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/release-app-shell-format-fix.yml apps/web
          git diff --cached --quiet && { echo "No formatting changes to commit"; exit 1; }
          git commit -m "style(app-shell): apply canonical formatting"
          git push origin HEAD:release-closure-p0
