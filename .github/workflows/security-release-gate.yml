name: Security Release Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python security corpus
        run: |
          uv sync --frozen
          uv run --project apps/api pytest apps/api/tests/test_security_hardening.py apps/api/tests/integration/test_auth_tenant.py apps/api/tests/integration/test_auth_privilege_escalation.py apps/api/tests/integration/test_project_security.py
      - name: Python dependency audit
        run: |
          uv export --frozen --no-dev --format requirements-txt > /tmp/requirements.txt
          uvx --from pip-audit pip-audit -r /tmp/requirements.txt --strict
      - name: Python SAST
        run: uvx --from bandit bandit -q -r apps packages -x '*/tests/*'

  node-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only

  secret-and-iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: IaC and filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.34.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false

  release-gate:
    if: always()
    needs: [security-tests, node-supply-chain, codeql, dependency-review, secret-and-iac-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Critical/High gate
        run: |
          test '${{ needs.security-tests.result }}' = success
          test '${{ needs.node-supply-chain.result }}' = success
          test '${{ needs.codeql.result }}' = success
          if [ '${{ github.event_name }}' = pull_request ]; then test '${{ needs.dependency-review.result }}' = success; fi
          test '${{ needs.secret-and-iac-scan.result }}' = success
