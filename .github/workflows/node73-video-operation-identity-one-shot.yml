name: NODE73 Video Operation Identity One Shot

on:
  push:
    branches:
      - release-closure-p0
    paths:
      - ".github/workflows/node73-video-operation-identity-one-shot.yml"

permissions:
  contents: write

jobs:
  close-video-operation-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
      LUMI_DB_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 0
      - name: Apply exact operation identity binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/lumi_api/generations/video_service.py")
          text = path.read_text(encoding="utf-8")
          old = """        operation = IdempotencyOperation(\n            organization_id=organization_id,\n"""
          new = """        operation = IdempotencyOperation(\n            id=operation_id,\n            organization_id=organization_id,\n"""
          if text.count(old) != 1:
              raise SystemExit("video operation identity patch target drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          test "$(git diff --name-only)" = "apps/api/src/lumi_api/generations/video_service.py"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen workspace install
        run: uv sync --all-packages --frozen
      - name: Validate source and producer contract
        shell: bash
        run: |
          python -m py_compile apps/api/src/lumi_api/generations/video_service.py
          uv run ruff check --ignore E501 \
            apps/api/src/lumi_api/generations/video_service.py \
            apps/api/tests/integration/test_video_generation_control_plane_postgres.py \
            apps/api/tests/integration/test_video_outbox_dispatch_postgres.py
          python scripts/validate_video_generation_producer_binding.py
      - name: Prepare canonical local infrastructure
        run: make infra-env
      - name: Start canonical local dependencies
        run: make infra-up
      - name: Upgrade schema and seed deterministic scope
        shell: bash
        run: |
          make db-upgrade
          bash scripts/db-local schema-check
          make db-seed
      - name: Prove PostgreSQL producer acceptance
        env:
          PYTHONPATH: apps/api/src:apps/worker-media/src:services/video-generation/src:services/domain/src
        run: >-
          uv run pytest
          apps/api/tests/integration/test_video_generation_control_plane_postgres.py
          apps/api/tests/integration/test_video_outbox_dispatch_postgres.py
          -q
      - name: Cleanup local infrastructure
        if: always()
        run: CONFIRM=1 make infra-reset || true
      - name: Guard exact diff and branch head
        shell: bash
        run: |
          test "$(git diff --name-only)" = "apps/api/src/lumi_api/generations/video_service.py"
          remote_head="$(git ls-remote origin refs/heads/release-closure-p0 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
      - name: Commit verified identity fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/lumi_api/generations/video_service.py
          git commit -m "fix(video): bind generation to canonical operation identity"
          git push origin HEAD:release-closure-p0
