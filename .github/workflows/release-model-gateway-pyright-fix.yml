name: Release Model Gateway Pyright Fix

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-model-gateway-pyright-fix.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-model-gateway-pyright-fix
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Apply behavior-equivalent type boundary fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              occurrences = source.count(old)
              if occurrences < count:
                  raise SystemExit(
                      f"expected Pyright target missing: {path}: wanted {count}, found {occurrences}: {old!r}"
                  )
              target.write_text(source.replace(old, new, count), encoding="utf-8")

          deep_test = "apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py"
          replace(
              deep_test,
              "from lumi_agent_runtime.deep_runtime.contracts import (\n"
              "    DeepAgentInvocationContext,\n"
              "    SubagentInvocationContext,\n"
              ")\n",
              "from lumi_agent_runtime.deep_runtime.contracts import (\n"
              "    DeepAgentInvocationContext,\n"
              "    DeepSubagentDefinition,\n"
              "    SubagentInvocationContext,\n"
              ")\n",
          )
          replace(
              deep_test,
              "        request = invoke.await_args.args[0]\n",
              "        invoke_args = invoke.await_args\n"
              "        assert invoke_args is not None\n"
              "        request = invoke_args.args[0]\n",
          )
          replace(
              deep_test,
              "        ai = chat_result.generations[0].message\n",
              "        ai = chat_result.generations[0].message\n"
              "        assert isinstance(ai, AIMessage)\n",
          )
          replace(
              deep_test,
              "        second_request = second_invoke.await_args.args[0]\n",
              "        second_invoke_args = second_invoke.await_args\n"
              "        assert second_invoke_args is not None\n"
              "        second_request = second_invoke_args.args[0]\n",
          )
          replace(
              deep_test,
              "        shared = dict(\n"
              "            organization_id=uuid4(),\n"
              "            project_id=uuid4(),\n"
              "            agent_run_id=uuid4(),\n"
              "            task_id=uuid4(),\n"
              "            operation_id=uuid4(),\n"
              "            actor_id=\"agent-test\",\n"
              "            root_agent=\"designer\",\n"
              "            granted_permissions=frozenset({\"project.read\"}),\n"
              "            allowed_tools=(\"asset.search\",),\n"
              "            trace_id=\"trace-budget\",\n"
              "            budget_limit_usd=\"2.50\",\n"
              "        )\n"
              "        root = DeepAgentInvocationContext(**shared)\n",
              "        root = DeepAgentInvocationContext(\n"
              "            organization_id=uuid4(),\n"
              "            project_id=uuid4(),\n"
              "            agent_run_id=uuid4(),\n"
              "            task_id=uuid4(),\n"
              "            operation_id=uuid4(),\n"
              "            actor_id=\"agent-test\",\n"
              "            root_agent=\"designer\",\n"
              "            granted_permissions=frozenset({\"project.read\"}),\n"
              "            allowed_tools=(\"asset.search\",),\n"
              "            trace_id=\"trace-budget\",\n"
              "            budget_limit_usd=\"2.50\",\n"
              "        )\n",
          )
          replace(
              deep_test,
              "            definition=type(\"Definition\", (), {\"model_profile\": \"reasoning.fast\"})(),\n",
              "            definition=DeepSubagentDefinition(\n"
              "                name=\"researcher\",\n"
              "                description=\"Research project evidence\",\n"
              "                system_prompt=\"Research only within the granted project scope.\",\n"
              "                allowed_tools=root.allowed_tools,\n"
              "                model_profile=\"reasoning.fast\",\n"
              "            ),\n",
          )

          service = "apps/api/src/lumi_api/model_gateway_service.py"
          replace(
              service,
              "        connection = await asyncpg.connect(dsn, timeout=3.0)\n"
              "        barrier_exists = await connection.fetchval(\n",
              "        active_connection = await asyncpg.connect(dsn, timeout=3)\n"
              "        connection = active_connection\n"
              "        barrier_exists = await active_connection.fetchval(\n",
          )
          replace(
              service,
              "        policy = await connection.fetchrow(\n",
              "        policy = await active_connection.fetchrow(\n",
          )

          guard = "apps/api/src/lumi_api/model_paid_guard.py"
          replace(
              guard,
              "        decoded = float(raw)\n"
              "        if not math.isfinite(decoded):\n"
              "            raise ValueError(\"MODEL_PAID_GUARD_NON_FINITE_FLOAT\")\n"
              "        return decoded\n",
              "        decoded_float = float(raw)\n"
              "        if not math.isfinite(decoded_float):\n"
              "            raise ValueError(\"MODEL_PAID_GUARD_NON_FINITE_FLOAT\")\n"
              "        return decoded_float\n",
          )

          image_runtime = "apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py"
          replace(
              image_runtime,
              "async def _gateway_call[T](awaitable: Awaitable[_T], *, code: str) -> _T:\n",
              "async def _gateway_call(awaitable: Awaitable[_T], *, code: str) -> _T:\n",
          )

          store = "apps/api/src/lumi_api/provider_output_store.py"
          replace(
              store,
              "from pathlib import Path\n",
              "from pathlib import Path\nfrom typing import Protocol\n",
          )
          replace(
              store,
              "\n\nclass ProviderOutputStoreError(RuntimeError):\n",
              "\n\nclass _ProviderObjectStore(Protocol):\n"
              "    async def put_bytes(\n"
              "        self,\n"
              "        *,\n"
              "        bucket: str,\n"
              "        object_key: str,\n"
              "        data: bytes,\n"
              "        content_type: str,\n"
              "        max_bytes: int,\n"
              "        metadata: dict[str, str] | None = None,\n"
              "    ) -> object: ...\n\n"
              "    async def upload_from_path(\n"
              "        self,\n"
              "        *,\n"
              "        bucket: str,\n"
              "        object_key: str,\n"
              "        path: str,\n"
              "        content_type: str,\n"
              "        checksum_sha256_b64: str,\n"
              "    ) -> object: ...\n\n\n"
              "class ProviderOutputStoreError(RuntimeError):\n",
          )
          replace(
              store,
              "    object_store: S3ObjectStore\n",
              "    object_store: _ProviderObjectStore\n",
          )

          store_test = "apps/api/tests/test_provider_output_store.py"
          replace(
              store_test,
              "from pathlib import Path\n",
              "from pathlib import Path\nfrom typing import cast\n",
          )
          replace(
              store_test,
              "    async def put_bytes(self, **kwargs: object) -> object:\n"
              "        self.calls.append(dict(kwargs))\n"
              "        return object()\n\n"
              "    async def upload_from_path(self, **kwargs: object) -> object:\n"
              "        self.file_calls.append(dict(kwargs))\n"
              "        return object()\n",
              "    async def put_bytes(\n"
              "        self,\n"
              "        *,\n"
              "        bucket: str,\n"
              "        object_key: str,\n"
              "        data: bytes,\n"
              "        content_type: str,\n"
              "        max_bytes: int,\n"
              "        metadata: dict[str, str] | None = None,\n"
              "    ) -> object:\n"
              "        self.calls.append(\n"
              "            {\n"
              "                \"bucket\": bucket,\n"
              "                \"object_key\": object_key,\n"
              "                \"data\": data,\n"
              "                \"content_type\": content_type,\n"
              "                \"max_bytes\": max_bytes,\n"
              "                \"metadata\": metadata,\n"
              "            }\n"
              "        )\n"
              "        return object()\n\n"
              "    async def upload_from_path(\n"
              "        self,\n"
              "        *,\n"
              "        bucket: str,\n"
              "        object_key: str,\n"
              "        path: str,\n"
              "        content_type: str,\n"
              "        checksum_sha256_b64: str,\n"
              "    ) -> object:\n"
              "        self.file_calls.append(\n"
              "            {\n"
              "                \"bucket\": bucket,\n"
              "                \"object_key\": object_key,\n"
              "                \"path\": path,\n"
              "                \"content_type\": content_type,\n"
              "                \"checksum_sha256_b64\": checksum_sha256_b64,\n"
              "            }\n"
              "        )\n"
              "        return object()\n",
          )
          target = Path(store_test)
          source = target.read_text(encoding="utf-8")
          source = source.replace("  # type: ignore[arg-type]", "")
          target.write_text(source, encoding="utf-8")
          replace(
              store_test,
              "        self.assertEqual(call[\"metadata\"][\"lumi-kind\"], \"provider-output\")\n",
              "        metadata = cast(dict[str, str], call[\"metadata\"])\n"
              "        self.assertEqual(metadata[\"lumi-kind\"], \"provider-output\")\n",
          )

          adapter_test = "services/model-gateway/tests/test_openai_adapter.py"
          replace(
              adapter_test,
              "from decimal import Decimal\n",
              "from decimal import Decimal\nfrom typing import cast\n",
          )
          target = Path(adapter_test)
          source = target.read_text(encoding="utf-8")
          source = source.replace(
              'json.loads(call["body"])',
              'json.loads(cast(bytes, call["body"]))',
          )
          source = source.replace(
              'json.loads(transport.calls[0]["body"])',
              'json.loads(cast(bytes, transport.calls[0]["body"]))',
          )
          source = source.replace(
              '        headers = call["headers"]\n',
              '        headers = cast(dict[str, str], call["headers"])\n',
          )
          target.write_text(source, encoding="utf-8")

          tool_test = "services/model-gateway/tests/test_openai_tool_adapter.py"
          replace(
              tool_test,
              "from decimal import Decimal\n",
              "from decimal import Decimal\nfrom typing import cast\n",
          )
          target = Path(tool_test)
          source = target.read_text(encoding="utf-8")
          if source.count('json.loads(transport.calls[0]["body"])') < 2:
              raise SystemExit("expected OpenAI tool transport JSON bodies")
          source = source.replace(
              'json.loads(transport.calls[0]["body"])',
              'json.loads(cast(bytes, transport.calls[0]["body"]))',
          )
          target.write_text(source, encoding="utf-8")

          image_test = "services/model-gateway/tests/test_openai_image_adapter.py"
          replace(
              image_test,
              "from decimal import Decimal\n",
              "from decimal import Decimal\nfrom pathlib import Path\nfrom typing import cast\n",
          )
          replace(
              image_test,
              "class FakeOutputStore:\n"
              "    def __init__(self) -> None:\n"
              "        self.calls: list[dict[str, object]] = []\n\n"
              "    async def store_bytes(self, **kwargs: object) -> str:\n"
              "        self.calls.append(dict(kwargs))\n"
              "        request = kwargs[\"request\"]\n"
              "        return f\"s3://assets/provider-output/v1/{request.operation_id}/image.png\"\n",
              "class FakeOutputStore:\n"
              "    def __init__(self) -> None:\n"
              "        self.calls: list[dict[str, object]] = []\n\n"
              "    async def store_bytes(\n"
              "        self,\n"
              "        *,\n"
              "        request: ModelRequest,\n"
              "        provider: str,\n"
              "        model: str,\n"
              "        data: bytes,\n"
              "        content_type: str,\n"
              "        extension: str,\n"
              "    ) -> str:\n"
              "        self.calls.append(\n"
              "            {\n"
              "                \"request\": request,\n"
              "                \"provider\": provider,\n"
              "                \"model\": model,\n"
              "                \"data\": data,\n"
              "                \"content_type\": content_type,\n"
              "                \"extension\": extension,\n"
              "            }\n"
              "        )\n"
              "        return f\"s3://assets/provider-output/v1/{request.operation_id}/image.png\"\n\n"
              "    async def store_path(\n"
              "        self,\n"
              "        *,\n"
              "        request: ModelRequest,\n"
              "        provider: str,\n"
              "        model: str,\n"
              "        path: Path,\n"
              "        content_type: str,\n"
              "        extension: str,\n"
              "        max_bytes: int,\n"
              "    ) -> str:\n"
              "        raise AssertionError(\"image adapter must not stage a file path\")\n\n"
              "    async def store_async_path(\n"
              "        self,\n"
              "        *,\n"
              "        provider: str,\n"
              "        model: str,\n"
              "        provider_request_id: str,\n"
              "        path: Path,\n"
              "        content_type: str,\n"
              "        extension: str,\n"
              "        max_bytes: int,\n"
              "    ) -> str:\n"
              "        raise AssertionError(\"image adapter must not stage an async file path\")\n",
          )
          target = Path(image_test)
          source = target.read_text(encoding="utf-8")
          source = source.replace(
              'json.loads(call["body"])',
              'json.loads(cast(bytes, call["body"]))',
          )
          source = source.replace(
              'json.loads(transport.calls[0]["body"])',
              'json.loads(cast(bytes, transport.calls[0]["body"]))',
          )
          target.write_text(source, encoding="utf-8")
          PY
      - name: Format and lint touched Model Gateway boundary
        run: |
          TARGETS=(
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py
            apps/api/src/lumi_api/model_gateway_service.py
            apps/api/src/lumi_api/model_paid_guard.py
            apps/api/src/lumi_api/provider_output_store.py
            apps/api/tests/test_provider_output_store.py
            apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py
            services/model-gateway/tests/test_openai_adapter.py
            services/model-gateway/tests/test_openai_image_adapter.py
            services/model-gateway/tests/test_openai_tool_adapter.py
          )
          uv run ruff check --fix "${TARGETS[@]}"
          uv run ruff format "${TARGETS[@]}"
          uv run ruff check "${TARGETS[@]}"
      - name: Verify formal Model Gateway Pyright target
        run: >-
          uv run pyright
          services/model-gateway
          services/asset-storage/src/lumi_asset_storage/s3.py
          apps/api/src/lumi_api/model_gateway_runtime.py
          apps/api/src/lumi_api/model_gateway_bootstrap.py
          apps/api/src/lumi_api/model_gateway_service.py
          apps/api/src/lumi_api/model_gateway_cli.py
          apps/api/src/lumi_api/model_paid_guard.py
          apps/api/src/lumi_api/provider_output_store.py
          apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/model_gateway_chat.py
          apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/runtime_factory.py
          apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py
          apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py
          apps/worker-media/src/lumi_worker_media/video_gateway_runtime.py
          apps/worker-media/tests/test_image_gateway_runtime.py
          apps/api/tests/test_model_gateway_media_bootstrap.py
          apps/api/tests/test_model_paid_guard.py
          apps/api/tests/test_provider_output_store.py
          apps/api/tests/integration/test_model_paid_guard_postgres.py
      - name: Revalidate Model Gateway architecture boundaries
        run: |
          uv run python scripts/validate_model_gateway_contract.py
          uv run python scripts/validate_private_model_gateway_deployment_contract.py
          uv run python scripts/validate_deep_agents_model_gateway_contract.py
      - name: Run formal Model Gateway non-Postgres tests
        run: |
          uv run python -m unittest discover -s services/model-gateway/tests -p 'test_*.py'
          uv run pytest -q \
            services/asset-storage/tests/test_s3_bounded_bytes.py \
            apps/api/tests/test_model_gateway_media_bootstrap.py \
            apps/api/tests/test_provider_output_store.py \
            apps/worker-media/tests/test_image_gateway_runtime.py
          uv run pytest -q apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py
          uv run pytest -q apps/api/tests/test_model_paid_guard.py
          uv run python scripts/integration_model_gateway.py
      - name: Self-remove and commit verified Pyright fixes
        run: |
          rm .github/workflows/release-model-gateway-pyright-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/release-model-gateway-pyright-fix.yml \
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py \
            apps/api/src/lumi_api/model_gateway_service.py \
            apps/api/src/lumi_api/model_paid_guard.py \
            apps/api/src/lumi_api/provider_output_store.py \
            apps/api/tests/test_provider_output_store.py \
            apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py \
            services/model-gateway/tests/test_openai_adapter.py \
            services/model-gateway/tests/test_openai_image_adapter.py \
            services/model-gateway/tests/test_openai_tool_adapter.py
          if git diff --cached --quiet; then
            echo "No verified Pyright changes were produced" >&2
            exit 1
          fi
          git commit -m "fix(model-gateway): close Pyright type boundary backlog"
          git push origin HEAD:release-closure-p0
