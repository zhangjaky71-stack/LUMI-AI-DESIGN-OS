name: NODE-62 Approval Engine

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/approvals/**"
      - "apps/api/src/lumi_api/api/v1/approval_*.py"
      - "apps/api/src/lumi_api/api/v1/artifact_engine_schemas.py"
      - "apps/api/src/lumi_api/api/v1/app.py"
      - "apps/api/src/lumi_api/persistence/models_approvals.py"
      - "apps/api/src/lumi_api/persistence/models.py"
      - "apps/api/migrations/versions/20260818_0022_approval_engine.py"
      - "apps/api/migrations/versions/20260818_0022_sql/**"
      - "apps/api/tests/test_node62_approval_*.py"
      - "apps/web/src/lib/approvals/**"
      - "apps/web/src/components/approvals/**"
      - "apps/web/src/components/workspace/ai-workspace.tsx"
      - "apps/web/src/components/workspace/agent-timeline.tsx"
      - "apps/web/src/app/(shell)/workspace/page.tsx"
      - "apps/web/src/app/(shell)/workspace/layout.tsx"
      - "apps/web/src/app/(shell)/workspace/approvals.css"
      - "tools/node62/**"
      - "docs/nodes/NODE-62-APPROVAL-ENGINE.md"
      - "docs/runtime/APPROVAL-ENGINE-V1.md"
      - "reports/nodes/NODE-62/**"
      - ".github/workflows/node-62-approval-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.4.0"
  SQLALCHEMY_VERSION: "2.0.51"
  ALEMBIC_VERSION: "1.18.5"
  ASYNCPG_VERSION: "0.31.0"
  NEXT_TELEMETRY_DISABLED: "1"
  LUMI_API_ORIGIN: "http://127.0.0.1:8000"
  LUMI_DATABASE_MIGRATION_URL: "postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi"

jobs:
  approval-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen Python workspace
        run: uv sync --all-packages --frozen

      - name: Compile NODE-62 contracts
        run: |
          uv run python -m compileall -q \
            apps/api/src/lumi_api/approvals \
            apps/api/src/lumi_api/api/v1/app.py \
            apps/api/src/lumi_api/api/v1/approval_dependencies.py \
            apps/api/src/lumi_api/api/v1/approval_routes.py \
            apps/api/src/lumi_api/api/v1/approval_schemas.py \
            apps/api/src/lumi_api/api/v1/artifact_engine_schemas.py \
            apps/api/src/lumi_api/persistence/models_approvals.py \
            apps/api/tests/test_node62_approval_contracts.py \
            apps/api/tests/test_node62_approval_safety.py \
            tools/node62

      - name: Static Approval acceptance
        run: uv run python tools/node62/validate_approval.py

      - name: NODE-62 contract and bridge tests
        run: |
          uv run pytest -q \
            apps/api/tests/test_node62_approval_contracts.py \
            apps/api/tests/test_node62_approval_safety.py

      - name: Artifact Engine regression tests
        run: |
          uv run pytest -q \
            apps/api/tests/test_artifact_engine_runtime.py \
            apps/api/tests/test_artifact_engine_api.py

      - name: Ruff NODE-62 backend
        run: |
          uv run ruff check --ignore E501,I001 \
            apps/api/src/lumi_api/approvals \
            apps/api/src/lumi_api/api/v1/app.py \
            apps/api/src/lumi_api/api/v1/approval_dependencies.py \
            apps/api/src/lumi_api/api/v1/approval_routes.py \
            apps/api/src/lumi_api/api/v1/approval_schemas.py \
            apps/api/src/lumi_api/api/v1/artifact_engine_schemas.py \
            apps/api/src/lumi_api/persistence/models_approvals.py \
            apps/api/tests/test_node62_approval_contracts.py \
            apps/api/tests/test_node62_approval_safety.py \
            tools/node62

      - name: Prepare local PostgreSQL
        run: |
          cp infra/compose/env.local.example infra/compose/.env
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml up -d --wait --wait-timeout 180 postgres

      - name: Apply full migration chain through approval engine
        working-directory: apps/api
        run: |
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==${SQLALCHEMY_VERSION}" \
            --with "alembic==${ALEMBIC_VERSION}" \
            --with "asyncpg==${ASYNCPG_VERSION}" \
            alembic upgrade head

      - name: Verify durable Approval schema
        run: |
          result="$(docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c \
            "SELECT concat_ws(',', to_regclass('public.approval_requests'), to_regclass('public.approval_decisions'), to_regclass('public.approval_audit_events'), to_regclass('public.approval_effects'));" )"
          test "$result" = "approval_requests,approval_decisions,approval_audit_events,approval_effects"
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml \
            exec -T -e PGPASSWORD=lumi_migration_local_only postgres \
            psql -At -U lumi_migration -d lumi -c \
            "SELECT 1 FROM pg_indexes WHERE indexname='uq_approval_requests_pending_artifact';" | grep -qx 1

      - name: Parse NODE-62 gap ledger
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path("reports/nodes/NODE-62/gap-ledger.json").read_text(encoding="utf-8"))
          assert ledger["node"] == "NODE-62"
          assert ledger["status"] == "CORE_IMPLEMENTED_VALIDATING_NOT_COMPLETE"
          assert any(gap["severity"] == "P0" and gap["status"] == "open" for gap in ledger["gaps"])
          assert any(gap["id"] == "NODE62-GAP-013" and gap["status"] == "closed" for gap in ledger["gaps"])
          assert any(gap["id"] == "NODE62-GAP-014" and gap["status"] == "closed" for gap in ledger["gaps"])
          print("NODE62_GAP_LEDGER_PARSE_PASS")
          PY

      - name: PostgreSQL diagnostics
        if: failure()
        run: |
          mkdir -p reports/nodes/NODE-62/runtime
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml ps > reports/nodes/NODE-62/runtime/compose-ps.txt 2>&1 || true
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml logs --no-color --tail=300 postgres > reports/nodes/NODE-62/runtime/postgres.log 2>&1 || true

      - name: Upload NODE-62 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-62-approval-${{ github.run_id }}
          path: reports/nodes/NODE-62/runtime
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup PostgreSQL
        if: always()
        run: docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml down --volumes --remove-orphans || true

  approval-web:
    needs: approval-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install frozen JS workspace
        run: pnpm install --frozen-lockfile

      - name: Approval web contract tests
        run: pnpm --filter @lumi/web exec vitest run src/lib/approvals/types.test.ts

      - name: Typecheck web application
        run: pnpm --filter @lumi/web typecheck

      - name: Lint NODE-62 web surface
        run: |
          pnpm --filter @lumi/web exec eslint \
            src/lib/approvals \
            src/components/approvals \
            src/components/workspace/ai-workspace.tsx \
            src/components/workspace/agent-timeline.tsx \
            'src/app/(shell)/workspace/page.tsx' \
            'src/app/(shell)/workspace/layout.tsx'

      - name: Production Next.js build
        run: pnpm --filter @lumi/web build
