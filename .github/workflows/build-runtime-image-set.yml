name: Build and Freeze RC Runtime Image Set

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default-branch-registry-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse default-branch execution
        run: |
          echo "This file is a workflow_dispatch registry stub only." >&2
          echo "Run this workflow with ref=release-closure-p0 so GitHub uses the hardened release-ref workflow definition." >&2
          exit 64
