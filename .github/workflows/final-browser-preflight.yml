name: Final Browser Preflight

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.final-acceptance.config.ts"
      - "final/acceptance/**"
      - "docs/acceptance/**"
      - ".github/workflows/final-browser-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-browser-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.4.0"

jobs:
  browser-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Install browser runtimes and system dependencies
        run: |
          pnpm exec playwright install-deps chromium firefox webkit
          pnpm exec playwright install firefox webkit chrome msedge
      - name: Capture exact browser/runtime inventory
        run: |
          mkdir -p reports/final-browser-preflight
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "playwright=$(pnpm exec playwright --version)"
            echo "os=$(uname -a)"
            echo "chrome=$(google-chrome --version 2>/dev/null || true)"
            echo "edge=$(microsoft-edge --version 2>/dev/null || true)"
            echo
            pnpm exec playwright install --list
          } | tee reports/final-browser-preflight/browser-inventory.txt
      - name: Final Acceptance multi-browser smoke
        run: >-
          pnpm exec playwright test
          --config=playwright.final-acceptance.config.ts
      - name: Write preflight boundary
        if: always()
        run: |
          cat > reports/final-browser-preflight/README.txt <<'EOF'
          This job is an automated browser regression preflight.
          chrome-stable and edge-stable use branded browser channels.
          firefox-engine uses the Playwright-pinned Firefox build.
          webkit-safari-engine-preflight uses Playwright WebKit and MUST NOT be used as evidence that real macOS Safari passed BROWSER-02.
          Final BROWSER-01/BROWSER-02 acceptance still requires exact supported browser/OS evidence on the frozen release candidate as defined by NODE-73 UAT runbooks.
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-browser-preflight-${{ github.run_id }}
          path: |
            reports/final-browser-preflight
            test-results/final-browser-acceptance
          if-no-files-found: warn
          retention-days: 30
