name: Idempotency Side Effects

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/idempotency/**"
      - "apps/api/src/lumi_api/persistence/models/platform.py"
      - "apps/api/alembic/versions/0009_idempotency_side_effects.py"
      - "apps/api/tests/test_idempotency_contracts.py"
      - "scripts/validate_idempotency_contract.py"
      - "scripts/integration_idempotency_side_effects.py"
      - "docs/runtime/IDEMPOTENCY-SIDE-EFFECT-GATEWAY-V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idempotency-side-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Frozen workspace install
        run: uv sync --all-packages --frozen

      - name: Static NODE-20 contract
        run: uv run python scripts/validate_idempotency_contract.py

      - name: Idempotency lint
        run: >-
          uv run ruff check
          apps/api/src/lumi_api/idempotency
          apps/api/src/lumi_api/persistence/models/platform.py
          apps/api/alembic/versions/0009_idempotency_side_effects.py
          apps/api/tests/test_idempotency_contracts.py
          scripts/validate_idempotency_contract.py
          scripts/integration_idempotency_side_effects.py

      - name: Idempotency type check
        run: >-
          uv run pyright
          apps/api/src/lumi_api/idempotency
          apps/api/tests/test_idempotency_contracts.py

      - name: Idempotency unit tests
        run: uv run pytest apps/api/tests/test_idempotency_contracts.py -q

      - name: Prepare local infrastructure
        run: make infra-env

      - name: Start local dependencies
        run: make infra-up

      - name: Upgrade database and verify ORM drift
        run: |
          make db-upgrade
          bash scripts/db-local schema-check
          make db-seed

      - name: Idempotency failure-injection acceptance
        run: uv run python scripts/integration_idempotency_side_effects.py

      - name: Migration downgrade/upgrade smoke
        run: bash scripts/db-local downgrade-smoke

      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/nodes/NODE-20/runtime
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml ps \
            > reports/nodes/NODE-20/runtime/compose-ps.txt 2>&1 || true
          docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml logs \
            --no-color --tail=300 postgres \
            > reports/nodes/NODE-20/runtime/postgres.log 2>&1 || true

      - name: Upload NODE-20 diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: node-20-idempotency-side-effects-${{ github.run_id }}
          path: reports/nodes/NODE-20/runtime
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true
