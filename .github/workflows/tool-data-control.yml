name: Tool Gateway Data Control

on:
  pull_request:
    paths:
      - "apps/api/src/lumi_api/product_app.py"
      - "apps/api/src/lumi_api/tool_data_control.py"
      - "apps/api/src/lumi_api/persistence/models/project.py"
      - "apps/api/src/lumi_api/persistence/models/workflow.py"
      - "apps/api/src/lumi_api/persistence/models/asset.py"
      - "apps/api/src/lumi_api/persistence/models/design.py"
      - "apps/api/tests/test_tool_data_control.py"
      - "apps/api/tests/integration/test_tool_data_control_postgres.py"
      - "services/tool-gateway/src/lumi_tool_gateway/catalog.py"
      - "services/tool-gateway/src/lumi_tool_gateway/data_control.py"
      - "services/tool-gateway/src/lumi_tool_gateway/errors.py"
      - "services/tool-gateway/src/lumi_tool_gateway/http_transport.py"
      - "services/tool-gateway/src/lumi_tool_gateway/schema.py"
      - "services/tool-gateway/src/lumi_tool_gateway/service.py"
      - "services/tool-gateway/tests/test_data_control.py"
      - "services/tool-gateway/tests/test_schema_pattern.py"
      - "infra/iac/environments/staging/core/main.tf"
      - "infra/iac/environments/staging/app/main.tf"
      - "infra/iac/environments/production/core/main.tf"
      - "infra/iac/environments/production/app/main.tf"
      - "infra/iac/modules/platform-app/internal-path-deny.tf"
      - "scripts/validate_tool_data_provenance.py"
      - "scripts/validate_api_provenance_source_manifest.py"
      - "staging/acceptance/api-provenance-sources-v1.json"
      - "staging/acceptance/evidence-template.json"
      - ".github/workflows/tool-data-control.yml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-data-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Tool Data control sources
        run: |
          python -m compileall -q \
            apps/api/src/lumi_api/tool_data_control.py \
            apps/api/src/lumi_api/persistence/models/asset.py \
            apps/api/src/lumi_api/persistence/models/design.py \
            apps/api/tests/test_tool_data_control.py \
            apps/api/tests/integration/test_tool_data_control_postgres.py \
            services/tool-gateway/src/lumi_tool_gateway/data_control.py \
            services/tool-gateway/src/lumi_tool_gateway/catalog.py \
            services/tool-gateway/src/lumi_tool_gateway/schema.py \
            services/tool-gateway/tests/test_data_control.py \
            services/tool-gateway/tests/test_schema_pattern.py \
            scripts/validate_tool_data_provenance.py \
            scripts/validate_api_provenance_source_manifest.py
      - name: Require Tool Data source, identity, and provenance closure
        run: python scripts/validate_tool_data_provenance.py --self-test
      - name: Require canonical API provenance source union
        run: python scripts/validate_api_provenance_source_manifest.py

  tool-data-quality:
    needs: tool-data-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Require canonical frozen workspace
        run: uv sync --all-packages --frozen
      - name: Ruff Tool Data boundary
        run: >-
          uv run ruff check
          apps/api/src/lumi_api/tool_data_control.py
          apps/api/tests/test_tool_data_control.py
          apps/api/tests/integration/test_tool_data_control_postgres.py
          services/tool-gateway/src/lumi_tool_gateway/data_control.py
          services/tool-gateway/src/lumi_tool_gateway/catalog.py
          services/tool-gateway/src/lumi_tool_gateway/schema.py
          services/tool-gateway/tests/test_data_control.py
          services/tool-gateway/tests/test_schema_pattern.py
          scripts/validate_tool_data_provenance.py
      - name: Pyright Tool Data boundary
        run: >-
          uv run pyright
          apps/api/src/lumi_api/tool_data_control.py
          services/tool-gateway/src/lumi_tool_gateway/data_control.py
          services/tool-gateway/src/lumi_tool_gateway/schema.py
      - name: Unit acceptance
        run: >-
          uv run pytest
          apps/api/tests/test_tool_data_control.py
          services/tool-gateway/tests/test_data_control.py
          services/tool-gateway/tests/test_schema_pattern.py
          -q

  tool-data-postgres:
    needs: tool-data-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Require canonical frozen workspace
        run: uv sync --all-packages --frozen
      - name: Start canonical local infrastructure
        run: |
          make infra-env
          make infra-up
      - name: Migrate canonical API schema
        run: make db-upgrade
      - name: Require ORM to migration parity
        run: bash scripts/db-local schema-check
      - name: Seed deterministic tenant fixtures
        run: make db-seed
      - name: Real PostgreSQL task-derived data and side-effect acceptance
        env:
          LUMI_DB_INTEGRATION: "1"
        run: uv run pytest apps/api/tests/integration/test_tool_data_control_postgres.py -q
      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true
