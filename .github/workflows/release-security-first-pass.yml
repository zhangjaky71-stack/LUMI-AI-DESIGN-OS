name: Release Security First Pass

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-security-first-pass.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-security-first-pass
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Apply first-pass security remediations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("apps/worker-media/tests/test_asset_validation_security.py")
          source = test_path.read_text(encoding="utf-8")
          if source.count("@pytest.mark.asyncio") != 2:
              raise SystemExit("expected exactly two asyncio SVG security tests")
          source = source.replace("@pytest.mark.asyncio", "@pytest.mark.anyio")
          marker = "from lumi_worker_media.media_tools import inspect_media\n\n\n"
          fixture = (
              "from lumi_worker_media.media_tools import inspect_media\n\n\n"
              "@pytest.fixture\n"
              "def anyio_backend() -> str:\n"
              "    return \"asyncio\"\n\n\n"
          )
          if marker not in source:
              raise SystemExit("worker-media SVG fixture insertion point missing")
          source = source.replace(marker, fixture, 1)
          test_path.write_text(source, encoding="utf-8")

          minio_path = Path("infra/docker/minio/Dockerfile")
          source = minio_path.read_text(encoding="utf-8")
          old = (
              "FROM alpine:3.22\n"
              "RUN apk add --no-cache ca-certificates tzdata\n"
              "COPY --from=builder /out/minio /usr/local/bin/minio\n\n"
              "EXPOSE 9000 9001\n"
              "VOLUME [\"/data\"]\n"
              "ENTRYPOINT [\"/usr/local/bin/minio\"]\n"
          )
          new = (
              "FROM alpine:3.22\n"
              "RUN apk add --no-cache ca-certificates tzdata \\\n"
              "    && addgroup -S -g 10001 minio \\\n"
              "    && adduser -S -D -H -u 10001 -G minio minio \\\n"
              "    && mkdir -p /data \\\n"
              "    && chown minio:minio /data\n"
              "COPY --from=builder /out/minio /usr/local/bin/minio\n\n"
              "EXPOSE 9000 9001\n"
              "VOLUME [\"/data\"]\n"
              "USER minio\n"
              "ENTRYPOINT [\"/usr/local/bin/minio\"]\n"
          )
          if old not in source:
              raise SystemExit("MinIO Dockerfile security target missing")
          minio_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          data_path = Path("infra/iac/modules/data/main.tf")
          source = data_path.read_text(encoding="utf-8")
          postgres_egress = (
              "\n  egress {\n"
              "    protocol    = \"-1\"\n"
              "    from_port   = 0\n"
              "    to_port     = 0\n"
              "    cidr_blocks = [\"0.0.0.0/0\"]\n"
              "  }\n"
          )
          if postgres_egress not in source:
              raise SystemExit("PostgreSQL public egress block missing")
          data_path.write_text(source.replace(postgres_egress, "\n", 1), encoding="utf-8")

          network_path = Path("infra/iac/modules/network/main.tf")
          source = network_path.read_text(encoding="utf-8")
          alb_egress = (
              "  egress {\n"
              "    protocol    = \"-1\"\n"
              "    from_port   = 0\n"
              "    to_port     = 0\n"
              "    cidr_blocks = [\"0.0.0.0/0\"]\n"
              "  }\n"
          )
          alb_vpc_egress = (
              "  egress {\n"
              "    protocol    = \"-1\"\n"
              "    from_port   = 0\n"
              "    to_port     = 0\n"
              "    cidr_blocks = [aws_vpc.this.cidr_block]\n"
              "  }\n"
          )
          if source.count(alb_egress) < 2:
              raise SystemExit("expected ALB and explicit Internet egress blocks")
          source = source.replace(alb_egress, alb_vpc_egress, 1)
          network_path.write_text(source, encoding="utf-8")

          workspace = Path("pnpm-workspace.yaml")
          source = workspace.read_text(encoding="utf-8")
          if "next@16.2.12>sharp" in source:
              raise SystemExit("sharp override already exists unexpectedly")
          insertion = (
              "# Security override: Next 16.2.12 declares sharp ^0.34.5, but sharp <0.35.0\n"
              "# inherits patched libvips vulnerabilities. Scope the override to Next only.\n"
              "overrides:\n"
              "  \"next@16.2.12>sharp\": \"0.35.3\"\n\n"
          )
          anchor = "# pnpm 11 blocks dependency lifecycle scripts by default."
          if anchor not in source:
              raise SystemExit("pnpm workspace insertion point missing")
          workspace.write_text(source.replace(anchor, insertion + anchor, 1), encoding="utf-8")
          PY
      - name: Run frozen Python security test
        run: |
          uv sync --all-packages --frozen
          uv run pytest -q apps/worker-media/tests/test_asset_validation_security.py
      - name: Regenerate and verify JS lockfile
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
      - name: Verify Next resolves patched sharp
        working-directory: apps/web
        run: |
          node <<'NODE'
          const { createRequire } = require('node:module');
          const requireFromWeb = createRequire(process.cwd() + '/package.json');
          const nextPackage = requireFromWeb.resolve('next/package.json');
          const requireFromNext = createRequire(nextPackage);
          const sharpPackage = requireFromNext.resolve('sharp/package.json');
          const sharpVersion = require(sharpPackage).version;
          console.log(`Next resolves sharp ${sharpVersion}`);
          if (sharpVersion !== '0.35.3') {
            throw new Error(`Expected Next to resolve sharp 0.35.3, got ${sharpVersion}`);
          }
          NODE
      - name: Verify network and MinIO source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          minio = Path("infra/docker/minio/Dockerfile").read_text(encoding="utf-8")
          if "USER minio" not in minio or "-u 10001" not in minio:
              raise SystemExit("MinIO must run as the dedicated uid 10001 user")

          data = Path("infra/iac/modules/data/main.tf").read_text(encoding="utf-8")
          postgres = data.split('resource "aws_security_group" "postgres"', 1)[1].split(
              'resource "aws_security_group" "redis"', 1
          )[0]
          if '0.0.0.0/0' in postgres:
              raise SystemExit("PostgreSQL SG still exposes public egress")

          network = Path("infra/iac/modules/network/main.tf").read_text(encoding="utf-8")
          alb = network.split('resource "aws_security_group" "alb"', 1)[1].split(
              'resource "aws_security_group" "app"', 1
          )[0]
          if 'cidr_blocks = [aws_vpc.this.cidr_block]' not in alb:
              raise SystemExit("ALB egress must be scoped to the VPC CIDR")
          print("first-pass network security source contract: PASS")
          PY
      - name: Build and inspect non-root MinIO image
        run: |
          docker build -f infra/docker/minio/Dockerfile -t lumi-minio-security:ci .
          test "$(docker run --rm --entrypoint id lumi-minio-security:ci -u)" = "10001"
      - name: Self-remove and commit verified security fixes
        run: |
          rm .github/workflows/release-security-first-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/release-security-first-pass.yml \
            apps/worker-media/tests/test_asset_validation_security.py \
            infra/docker/minio/Dockerfile \
            infra/iac/modules/data/main.tf \
            infra/iac/modules/network/main.tf \
            pnpm-workspace.yaml \
            pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No verified security changes were produced" >&2
            exit 1
          fi
          git commit -m "fix(security): close first release gate findings"
          git push origin HEAD:release-closure-p0
