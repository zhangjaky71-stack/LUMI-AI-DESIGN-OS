name: Release Closure Safe Repair

on:
  push:
    branches: [release-closure-p0]
    paths:
      - .github/workflows/release-closure-repair.yml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python workspace
        run: uv sync --all-packages --frozen

      - name: Harden performance validator against formatter layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_performance_stage_event_contract.py")
          source = path.read_text(encoding="utf-8")
          replacements = {
              '        "function artifactTaskId(snapshot: AIWorkspaceSnapshot, event: WorkspaceEvent)",\n':
                  '        "function artifactTaskId(",\n',
              '        "scheduleArtifactUiPropagationAfterPaint(event, artifactTaskId(snapshot, event))",\n':
                  '        "scheduleArtifactUiPropagationAfterPaint(",\n        "artifactTaskId(snapshot, event)",\n',
              '    schedule_index = contract.index("scheduleArtifactUiPropagationAfterPaint(event, artifactTaskId(snapshot, event))")\n':
                  '    schedule_index = contract.index("scheduleArtifactUiPropagationAfterPaint(")\n',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"expected performance validator marker not found: {old.strip()}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply Ruff safe fixes
        shell: bash
        run: |
          set +e
          uv run ruff check --fix apps services evals scripts
          status=$?
          set -e
          echo "ruff_safe_fix_exit=$status"
          echo "Residual non-safe findings are expected to remain visible for the next canonical CI pass."

      - name: Normalize Python formatter-owned trees
        run: uv run ruff format apps services evals

      - name: Restore canonical generated API v1 client
        run: uv run python scripts/generate_api_v1_client.py

      - name: Patch sanity
        run: |
          git diff --check
          git status --short

      - name: Commit safe repair changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps services evals scripts packages/api-client-v1/src/generated.ts
          git commit -m "fix: apply safe release closure repairs [skip ci]"
          git push origin HEAD:release-closure-p0
