name: Versions CSS Prettier Oracle

on:
  pull_request:
    paths:
      - ".github/release-closure-targeted-patch-trigger"

permissions:
  contents: read

jobs:
  format-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Format Versions CSS with repository-pinned Prettier
        run: pnpm exec prettier --write apps/web/src/components/versions-ui/versions-ui.module.css
      - name: Verify exact formatter output
        run: |
          pnpm exec prettier --check apps/web/src/components/versions-ui/versions-ui.module.css
          git diff --check
      - name: Print exact formatter diff
        run: |
          echo '--- PRETTIER EXACT DIFF START ---'
          git diff -- apps/web/src/components/versions-ui/versions-ui.module.css
          echo '--- PRETTIER EXACT DIFF END ---'
