name: Versions CSS Targeted Patch

on:
  pull_request:
    paths:
      - ".github/release-closure-targeted-patch-trigger"

permissions:
  contents: write

jobs:
  patch-versions-css:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Apply repository-pinned Prettier to Versions CSS
        run: pnpm exec prettier --write apps/web/src/components/versions-ui/versions-ui.module.css
      - name: Verify exact single-file patch
        run: |
          pnpm exec prettier --check apps/web/src/components/versions-ui/versions-ui.module.css
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "apps/web/src/components/versions-ui/versions-ui.module.css"
          git diff -- apps/web/src/components/versions-ui/versions-ui.module.css
      - name: Commit exact Versions CSS repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/versions-ui/versions-ui.module.css
          git commit -m "style(versions): apply pinned Prettier output"
          git push origin HEAD:release-closure-p0
