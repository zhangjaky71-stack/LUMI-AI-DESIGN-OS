name: NODE-39 Constraint Validator

on:
  pull_request:
    paths:
      - "packages/design-constraints/**"
      - "apps/api/src/lumi_api/constraint_validator/**"
      - "apps/api/tests/test_constraint_validator_node39.py"
      - "docs/runtime/CONSTRAINT-VALIDATOR-V1.md"
      - "reports/nodes/NODE-39/**"
      - "tools/node39/**"
      - ".github/workflows/node-39-constraint-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.4.0"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.28"

jobs:
  constraint-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install frozen JS workspace
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm --filter @lumi/design-constraints typecheck

      - name: TypeScript tests
        run: pnpm --filter @lumi/design-constraints test

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen Python workspace
        run: uv sync --all-packages --frozen

      - name: Python constraint validator tests
        run: |
          PYTHONPATH=apps/api/src \
            uv run pytest -q apps/api/tests/test_constraint_validator_node39.py

      - name: Static NODE-39 validator
        run: |
          PYTHONPATH=apps/api/src \
            uv run python tools/node39/validate_constraint_validator.py

      - name: Parse gap ledger
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path("reports/nodes/NODE-39/gap-ledger.json").read_text(encoding="utf-8")
          )
          assert value["node"] == "NODE-39"
          assert len(value["gaps"]) == 5
          print("NODE39_GAP_LEDGER_PARSE_PASS")
          PY

      - name: Ruff
        run: |
          uv run ruff check \
            apps/api/src/lumi_api/constraint_validator \
            apps/api/tests/test_constraint_validator_node39.py \
            tools/node39

      - name: Pyright
        run: |
          uv run pyright \
            apps/api/src/lumi_api/constraint_validator \
            apps/api/tests/test_constraint_validator_node39.py \
            tools/node39
