name: Release Model Gateway Ruff Autofix

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - ".github/workflows/release-model-gateway-ruff-autofix.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-model-gateway-ruff-autofix
  cancel-in-progress: true

jobs:
  autofix:
    if: github.event.pull_request.head.ref == 'release-closure-p0' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install frozen workspace
        run: uv sync --all-packages --frozen
      - name: Normalize known non-autofixable long lines
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "scripts/validate_private_model_gateway_deployment_contract.py": [
                  (
                      '"for name, service in var.services : name => service if length(service.secret_arns) > 0",',
                      '(\n                "for name, service in var.services : name => service "\n                "if length(service.secret_arns) > 0"\n            ),',
                  ),
                  (
                      '"Provider secret ownership scanner must guard the rejection behind the exact Hosted host allowlist",',
                      '(\n            "Provider secret ownership scanner must guard the rejection "\n            "behind the exact Hosted host allowlist"\n        ),',
                  ),
              ],
              "services/model-gateway/src/lumi_model_gateway/openai_video_adapter.py": [
                  (
                      '"OpenAI Videos exposes delete but this adapter does not equate deletion with proven cancellation",',
                      '(\n                "OpenAI Videos exposes delete but this adapter does not equate "\n                "deletion with proven cancellation"\n            ),',
                  ),
              ],
              "services/model-gateway/src/lumi_model_gateway/telemetry.py": [
                  (
                      '"""Project gateway telemetry without request content, outputs, or tenant IDs as metric labels."""',
                      '"""Project gateway telemetry without request content or tenant IDs as metric labels."""',
                  ),
              ],
          }

          for raw_path, edits in replacements.items():
              path = Path(raw_path)
              source = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in source:
                      raise SystemExit(f"expected Ruff target not found: {raw_path}: {old}")
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          PY
      - name: Apply Ruff fixes and formatting
        run: |
          TARGETS=(
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/model_gateway_chat.py
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py
            apps/api/src/lumi_api/model_gateway_service.py
            apps/api/src/lumi_api/model_paid_guard.py
            apps/api/tests/integration/test_model_paid_guard_postgres.py
            apps/api/tests/test_model_gateway_media_bootstrap.py
            apps/api/tests/test_model_paid_guard.py
            apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py
            apps/worker-media/src/lumi_worker_media/video_gateway_runtime.py
            scripts/validate_deep_agents_model_gateway_contract.py
            scripts/validate_model_gateway_contract.py
            scripts/validate_private_model_gateway_deployment_contract.py
            services/model-gateway/src/lumi_model_gateway/capability_registry.py
            services/model-gateway/src/lumi_model_gateway/http_transport.py
            services/model-gateway/src/lumi_model_gateway/models.py
            services/model-gateway/src/lumi_model_gateway/openai_adapter.py
            services/model-gateway/src/lumi_model_gateway/openai_tool_adapter.py
            services/model-gateway/src/lumi_model_gateway/openai_video_adapter.py
            services/model-gateway/src/lumi_model_gateway/routing.py
            services/model-gateway/src/lumi_model_gateway/telemetry.py
          )
          uv run ruff check --fix --unsafe-fixes "${TARGETS[@]}" || true
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py": [
                  (
                      "        with patch.dict(os.environ, {}, clear=True):\n"
                      "            with self.assertRaises(DeepAgentModelBoundaryError):\n"
                      "                HttpProfileModelProvider.from_env()\n",
                      "        with patch.dict(os.environ, {}, clear=True), self.assertRaises(\n"
                      "            DeepAgentModelBoundaryError\n"
                      "        ):\n"
                      "            HttpProfileModelProvider.from_env()\n",
                  ),
              ],
              "scripts/validate_deep_agents_model_gateway_contract.py": [
                  (
                      "        if isinstance(node, ast.ImportFrom) and node.module:\n"
                      "            if node.module.split(\".\", 1)[0] in forbidden_modules:\n"
                      "                raise SystemExit(f\"{path}: provider/direct HTTP import bypasses NODE-22\")\n",
                      "        if (\n"
                      "            isinstance(node, ast.ImportFrom)\n"
                      "            and node.module\n"
                      "            and node.module.split(\".\", 1)[0] in forbidden_modules\n"
                      "        ):\n"
                      "            raise SystemExit(f\"{path}: provider/direct HTTP import bypasses NODE-22\")\n",
                  ),
              ],
              "services/model-gateway/src/lumi_model_gateway/models.py": [
                  (
                      "        if self.amount_usd is not None:\n"
                      "            if not self.amount_usd.is_finite() or self.amount_usd < 0:\n"
                      "                raise ValueError(\"MODEL_COST_AMOUNT_INVALID\")\n",
                      "        if self.amount_usd is not None and (\n"
                      "            not self.amount_usd.is_finite() or self.amount_usd < 0\n"
                      "        ):\n"
                      "            raise ValueError(\"MODEL_COST_AMOUNT_INVALID\")\n",
                  ),
              ],
              "services/model-gateway/src/lumi_model_gateway/routing.py": [
                  (
                      "        if requested_region and descriptor.regions:\n"
                      "            if requested_region not in descriptor.regions:\n"
                      "                reasons.append(\"REGION_UNAVAILABLE\")\n",
                      "        if (\n"
                      "            requested_region\n"
                      "            and descriptor.regions\n"
                      "            and requested_region not in descriptor.regions\n"
                      "        ):\n"
                      "            reasons.append(\"REGION_UNAVAILABLE\")\n",
                  ),
                  (
                      "        if policy.allowed_regions and descriptor.regions:\n"
                      "            if not descriptor.regions.intersection(policy.allowed_regions):\n"
                      "                reasons.append(\"ORG_REGION_POLICY_MISMATCH\")\n",
                      "        if (\n"
                      "            policy.allowed_regions\n"
                      "            and descriptor.regions\n"
                      "            and not descriptor.regions.intersection(policy.allowed_regions)\n"
                      "        ):\n"
                      "            reasons.append(\"ORG_REGION_POLICY_MISMATCH\")\n",
                  ),
              ],
          }

          for raw_path, edits in replacements.items():
              path = Path(raw_path)
              source = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in source:
                      raise SystemExit(f"expected SIM target not found: {raw_path}: {old}")
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          PY
          uv run ruff format "${TARGETS[@]}"
          uv run ruff check "${TARGETS[@]}"
      - name: Run focused Model Gateway tests
        run: |
          uv run pytest -q \
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py \
            apps/api/tests/test_model_gateway_media_bootstrap.py \
            apps/api/tests/test_model_paid_guard.py \
            services/model-gateway/tests
      - name: Self-remove and commit verified fixes
        run: |
          rm .github/workflows/release-model-gateway-ruff-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/release-model-gateway-ruff-autofix.yml \
            apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/model_gateway_chat.py \
            apps/agent-runtime/tests/test_deep_runtime_model_gateway_chat.py \
            apps/api/src/lumi_api/model_gateway_service.py \
            apps/api/src/lumi_api/model_paid_guard.py \
            apps/api/tests/integration/test_model_paid_guard_postgres.py \
            apps/api/tests/test_model_gateway_media_bootstrap.py \
            apps/api/tests/test_model_paid_guard.py \
            apps/worker-media/src/lumi_worker_media/image_gateway_runtime.py \
            apps/worker-media/src/lumi_worker_media/video_gateway_runtime.py \
            scripts/validate_deep_agents_model_gateway_contract.py \
            scripts/validate_model_gateway_contract.py \
            scripts/validate_private_model_gateway_deployment_contract.py \
            services/model-gateway/src/lumi_model_gateway/capability_registry.py \
            services/model-gateway/src/lumi_model_gateway/http_transport.py \
            services/model-gateway/src/lumi_model_gateway/models.py \
            services/model-gateway/src/lumi_model_gateway/openai_adapter.py \
            services/model-gateway/src/lumi_model_gateway/openai_tool_adapter.py \
            services/model-gateway/src/lumi_model_gateway/openai_video_adapter.py \
            services/model-gateway/src/lumi_model_gateway/routing.py \
            services/model-gateway/src/lumi_model_gateway/telemetry.py
          if git diff --cached --quiet; then
            echo "No verified Ruff changes were produced" >&2
            exit 1
          fi
          git commit -m "fix(model-gateway): clear quality gate lint backlog"
          git push origin HEAD:release-closure-p0
