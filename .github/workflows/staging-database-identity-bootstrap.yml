name: Staging Database Identity Bootstrap

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Database identity bootstrap operation"
        required: true
        type: choice
        options:
          - plan-database-bootstrap
          - apply-database-bootstrap
          - run-database-bootstrap
      apply_ack:
        description: "Required for apply/run mutations: APPLY_STAGING_DATABASE_BOOTSTRAP"
        required: false
        type: string
      release_git_sha:
        description: "Exact frozen runtime RC SHA"
        required: true
        type: string
      promoted_image_set_json:
        description: "Exact six-image Staging ECR digest map from verified promotion"
        required: true
        type: string
      credential_generation:
        description: "Positive database credential generation number"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  default-branch-registry-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse default-branch execution
        run: |
          echo "This file is a workflow_dispatch registry stub only." >&2
          echo "Run this workflow with ref=release-closure-p0 so GitHub uses the hardened release-ref definition." >&2
          exit 64
