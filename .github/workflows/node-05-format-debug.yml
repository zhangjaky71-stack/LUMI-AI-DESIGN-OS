name: NODE-05 Format Debug

on:
  pull_request:
    paths:
      - "evals/**"
      - ".github/workflows/node-05-format-debug.yml"

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
      - run: uv sync --all-packages --frozen
      - name: Show Ruff formatter diff
        run: uv run ruff format --check --diff evals/graders.py evals/tests/test_harness.py
