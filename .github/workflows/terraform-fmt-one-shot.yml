name: One-shot Terraform Canonical Format

on:
  push:
    branches:
      - release-closure-p0

permissions:
  contents: read

concurrency:
  group: node73-one-shot-terraform-fmt
  cancel-in-progress: false

env:
  TARGET_REF: release-closure-p0

jobs:
  format:
    if: github.ref == 'refs/heads/release-closure-p0' && github.event.head_commit.message == 'NODE73_ONE_SHOT_TERRAFORM_FMT'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      patch_sha256: ${{ steps.format.outputs.patch_sha256 }}
      changed_count: ${{ steps.format.outputs.changed_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Generate canonical Terraform-only patch
        id: format
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "zhangjaky71-stack/LUMI-AI-DESIGN-OS"
          test "$GITHUB_REF" = "refs/heads/release-closure-p0"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

          terraform fmt -recursive infra/iac
          terraform fmt -check -recursive infra/iac

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            [[ "$path" == infra/iac/*.tf || "$path" == infra/iac/**/*.tf ]]
          done
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check -- infra/iac

          patch="$RUNNER_TEMP/terraform-fmt.patch"
          git diff --binary -- infra/iac > "$patch"
          test -s "$patch"
          patch_sha256="$(sha256sum "$patch" | awk '{print $1}')"
          echo "patch_sha256=$patch_sha256" >> "$GITHUB_OUTPUT"
          echo "changed_count=${#changed[@]}" >> "$GITHUB_OUTPUT"
          printf 'Terraform formatter changed %s files; patch sha256=%s\n' "${#changed[@]}" "$patch_sha256"
          printf '%s\n' "${changed[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node73-terraform-fmt-${{ github.sha }}
          path: ${{ runner.temp }}/terraform-fmt.patch
          if-no-files-found: error
          retention-days: 7

  commit-format:
    if: needs.format.result == 'success' && needs.format.outputs.changed_count != '0'
    needs: [format]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node73-terraform-fmt-${{ github.sha }}
          path: ${{ runner.temp }}/node73-terraform-fmt

      - name: Verify and apply immutable formatter patch
        shell: bash
        env:
          EXPECTED_PATCH_SHA256: ${{ needs.format.outputs.patch_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          patch="$RUNNER_TEMP/node73-terraform-fmt/terraform-fmt.patch"
          test -f "$patch"
          test ! -L "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"
          git apply --check "$patch"
          git apply "$patch"
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq "${{ needs.format.outputs.changed_count }}"
          for path in "${changed[@]}"; do
            [[ "$path" == infra/iac/*.tf || "$path" == infra/iac/**/*.tf ]]
          done
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check -- infra/iac

      - name: Commit formatter output only if branch did not move
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          auth_header="AUTHORIZATION: basic $basic"
          git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags origin "+refs/heads/${TARGET_REF}:refs/remotes/origin/${TARGET_REF}"
          test "$(git rev-parse "origin/${TARGET_REF}")" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- infra/iac
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq "${{ needs.format.outputs.changed_count }}"
          for path in "${staged[@]}"; do
            [[ "$path" == infra/iac/*.tf || "$path" == infra/iac/**/*.tf ]]
          done
          git commit -m "style(iac): apply canonical terraform format"
          git -c http.https://github.com/.extraheader="$auth_header" push origin "HEAD:${TARGET_REF}"
