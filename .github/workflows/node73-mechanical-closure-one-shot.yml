name: NODE-73 Mechanical Closure One-Shot

on:
  pull_request:
    branches:
      - node-73-final-acceptance-release
    paths:
      - .github/workflows/node73-mechanical-closure-one-shot.yml

permissions:
  contents: write

jobs:
  mechanical-closure:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release-closure-p0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact mechanical fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('apps/web/src/components/brand-kit/brand-kit.module.css')
          css = css_path.read_text()
          old_css = '.assetRow input, select, .complianceControls select, .proposalList select {'
          new_css = '.assetRow input, .page select, .complianceControls select, .proposalList select {'
          if css.count(old_css) != 1:
              raise SystemExit('unexpected Brand Kit select boundary')
          css_path.write_text(css.replace(old_css, new_css, 1))

          path = Path('services/sandbox-runtime/src/lumi_sandbox_runtime/local_backend.py')
          text = path.read_text()
          import_old = 'import threading\nimport time\nfrom dataclasses import dataclass\n'
          import_new = 'import threading\nimport time\nfrom contextlib import suppress\nfrom dataclasses import dataclass\n'
          if text.count(import_old) != 1:
              raise SystemExit('unexpected local_backend import boundary')
          text = text.replace(import_old, import_new, 1)

          wait_old = '''                process.kill()\n                try:\n                    process.wait(timeout=5)\n                except subprocess.TimeoutExpired:\n                    pass\n                self._best_effort_kill(record.container_name)\n'''
          wait_new = '''                process.kill()\n                with suppress(subprocess.TimeoutExpired):\n                    process.wait(timeout=5)\n                self._best_effort_kill(record.container_name)\n'''
          if text.count(wait_old) != 1:
              raise SystemExit('unexpected process wait cleanup boundary')
          text = text.replace(wait_old, wait_new, 1)

          remove_old = '''    def _best_effort_remove(self, container: str) -> None:\n        try:\n            self._docker(\n                ["rm", "-f", "-v", container],\n                timeout=20,\n                allow_failure=True,\n            )\n        except Exception:\n            pass\n\n    def _best_effort_kill(self, container: str) -> None:\n        try:\n            self._docker(["kill", container], timeout=10, allow_failure=True)\n        except Exception:\n            pass\n'''
          remove_new = '''    def _best_effort_remove(self, container: str) -> None:\n        with suppress(Exception):\n            self._docker(\n                ["rm", "-f", "-v", container],\n                timeout=20,\n                allow_failure=True,\n            )\n\n    def _best_effort_kill(self, container: str) -> None:\n        with suppress(Exception):\n            self._docker(["kill", container], timeout=10, allow_failure=True)\n'''
          if text.count(remove_old) != 1:
              raise SystemExit('unexpected best-effort cleanup boundary')
          path.write_text(text.replace(remove_old, remove_new, 1))
          PY
      - name: Syntax and diff checks
        run: |
          python -m py_compile services/sandbox-runtime/src/lumi_sandbox_runtime/local_backend.py
          git diff --check
      - name: Commit fixes and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/brand-kit/brand-kit.module.css services/sandbox-runtime/src/lumi_sandbox_runtime/local_backend.py
          git rm .github/workflows/node73-mechanical-closure-one-shot.yml
          git diff --cached --check
          git commit -m 'style(release): close css and sandbox mechanical gates'
          git push origin HEAD:release-closure-p0
