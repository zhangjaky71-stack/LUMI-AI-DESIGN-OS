name: Video Generation

on:
  pull_request:
    paths:
      - "services/video-generation/**"
      - "services/model-gateway/**"
      - "services/asset-storage/**"
      - "services/sandbox-runtime/**"
      - "services/artifact-history/**"
      - "services/identity-engine/**"
      - "services/brand-rules/**"
      - "apps/worker-media/Dockerfile"
      - "apps/worker-media/pyproject.toml"
      - "apps/worker-media/src/lumi_worker_media/app.py"
      - "apps/worker-media/src/lumi_worker_media/job_runtime.py"
      - "apps/worker-media/src/lumi_worker_media/external_wait_runtime.py"
      - "apps/worker-media/src/lumi_worker_media/video_*.py"
      - "apps/worker-media/tests/test_video_*.py"
      - "apps/worker-media/tests/integration/test_video_*.py"
      - "apps/api/alembic/versions/0023_video_generation_runtime.py"
      - "apps/api/src/lumi_api/provider_output_store.py"
      - "apps/api/src/lumi_api/model_gateway_bootstrap.py"
      - "apps/api/tests/test_provider_output_store.py"
      - "infra/iac/environments/staging/app/main.tf"
      - "infra/iac/environments/staging/app/variables.tf"
      - "infra/iac/environments/staging/app/terraform.tfvars.example"
      - "infra/iac/environments/production/app/main.tf"
      - "infra/iac/environments/production/app/variables.tf"
      - "infra/iac/environments/production/app/terraform.tfvars.example"
      - "infra/iac/modules/compute/sandbox_child.tf"
      - "scripts/validate_video_generation.py"
      - "scripts/validate_video_worker_hosted_binding.py"
      - "scripts/benchmark_video_generation.py"
      - "fixtures/video-generation/**"
      - "docs/runtime/VIDEO-GENERATION-V1.md"
      - "docs/nodes/NODE-48-VIDEO-GENERATION.md"
      - "reports/nodes/NODE-48/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/video-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-generation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile NODE-48 hosted production contract
        shell: bash
        run: |
          python -m compileall -q \
            services/video-generation/src \
            services/video-generation/tests \
            apps/worker-media/src/lumi_worker_media/app.py \
            apps/worker-media/src/lumi_worker_media/video_*.py \
            apps/worker-media/tests/test_video_*.py \
            apps/worker-media/tests/integration/test_video_*.py \
            apps/api/src/lumi_api/provider_output_store.py \
            apps/api/tests/test_provider_output_store.py \
            scripts/validate_video_generation.py \
            scripts/validate_video_worker_hosted_binding.py \
            scripts/benchmark_video_generation.py
      - name: Validate NODE-48 architecture contract
        env:
          PYTHONPATH: services/video-generation/src:services/model-gateway/src:services/artifact-history/src
        run: python scripts/validate_video_generation.py
      - name: Validate Hosted video.render production binding
        run: python scripts/validate_video_worker_hosted_binding.py

  video-generation-quality:
    needs: video-generation-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen Python workspace install
        run: uv sync --all-packages --frozen
      - name: Run NODE-48 domain tests
        env:
          PYTHONPATH: services/video-generation/src:services/model-gateway/src:services/artifact-history/src:services/identity-engine/src:services/brand-rules/src
        run: uv run pytest services/video-generation/tests -q
      - name: Run all Hosted Worker video boundary tests
        shell: bash
        run: uv run pytest apps/worker-media/tests/test_video_*.py apps/api/tests/test_provider_output_store.py -q
      - name: Ruff correctness gate
        shell: bash
        run: |
          uv run ruff check --ignore E501 \
            services/video-generation/src \
            services/video-generation/tests \
            apps/worker-media/src/lumi_worker_media/app.py \
            apps/worker-media/src/lumi_worker_media/video_*.py \
            apps/worker-media/tests/test_video_*.py \
            apps/worker-media/tests/integration/test_video_*.py \
            apps/api/src/lumi_api/provider_output_store.py \
            apps/api/tests/test_provider_output_store.py \
            scripts/validate_video_generation.py \
            scripts/validate_video_worker_hosted_binding.py \
            scripts/benchmark_video_generation.py
      - name: Pyright runtime gate
        shell: bash
        run: |
          uv run pyright -p services/video-generation/pyrightconfig.json
          uv run pyright \
            apps/worker-media/src/lumi_worker_media/video_*.py \
            apps/worker-media/tests/test_video_*.py

  worker-media-video-smoke:
    needs: video-generation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build frozen Worker Media image
        run: docker build -f apps/worker-media/Dockerfile -t lumi-worker-media-video:${{ github.sha }} .
      - name: Verify packaged Hosted video imports
        run: >-
          docker run --rm --entrypoint python
          lumi-worker-media-video:${{ github.sha }}
          -c "from lumi_worker_media.app import video_render; from lumi_worker_media.video_generation_runtime import HostedVideoGenerationRuntime; from lumi_worker_media.video_sandbox_runtime import SandboxExchangeMediaRuntime; print('hosted-video-imports-ok')"
      - name: Start Worker Media container and assert process liveness
        shell: bash
        run: |
          docker run -d --name lumi-worker-media-video-smoke lumi-worker-media-video:${{ github.sha }}
          for attempt in $(seq 1 15); do
            if [ "$(docker inspect -f '{{.State.Running}}' lumi-worker-media-video-smoke 2>/dev/null || true)" = "true" ]; then
              sleep 2
              test "$(docker inspect -f '{{.State.Running}}' lumi-worker-media-video-smoke)" = "true"
              docker logs lumi-worker-media-video-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs lumi-worker-media-video-smoke || true
          exit 1
      - name: Cleanup Worker Media smoke container
        if: always()
        run: docker rm -f lumi-worker-media-video-smoke >/dev/null 2>&1 || true

  video-generation-integration:
    needs: video-generation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
      LUMI_DB_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen Python workspace install
        run: uv sync --all-packages --frozen
      - name: Prepare canonical local infrastructure
        run: make infra-env
      - name: Start canonical local dependencies
        run: make infra-up
      - name: Upgrade canonical Alembic schema and seed deterministic scope
        run: |
          make db-upgrade
          bash scripts/db-local schema-check
          make db-seed
      - name: Run Hosted video PostgreSQL acceptance
        env:
          PYTHONPATH: apps/worker-media/src:services/video-generation/src:services/domain/src
        run: uv run pytest apps/worker-media/tests/integration/test_video_hosted_postgres.py -q
      - name: Run video / Model Gateway / Artifact regressions
        env:
          PYTHONPATH: services/video-generation/src:services/model-gateway/src:services/artifact-history/src:services/identity-engine/src:services/brand-rules/src:services/domain/src
        run: >-
          uv run pytest
          services/video-generation/tests
          services/model-gateway/tests
          services/artifact-history/tests
          -q
      - name: Assert canonical Hosted video runtime tables exist
        shell: bash
        run: |
          count="$(docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml exec -T postgres \
            psql -U lumi_migration -d lumi -Atc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name in ('video_generation_jobs','video_provider_jobs');")"
          test "$count" = "2"
      - name: Assert historical parallel NODE-48 tables are absent
        shell: bash
        run: |
          count="$(docker compose --env-file infra/compose/.env -f infra/compose/docker-compose.yml exec -T postgres \
            psql -U lumi_migration -d lumi -Atc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name in ('video_generation_shots','video_generation_cost_reconciliation','video_timelines','video_generation_provenance','video_validation_findings');")"
          test "$count" = "0"
      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true

  video-generation-benchmark:
    needs: video-generation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run deterministic storyboard/timeline benchmark
        env:
          PYTHONPATH: services/video-generation/src:services/model-gateway/src:services/artifact-history/src
          LUMI_VIDEO_BENCHMARK_ITERATIONS: "1000"
          LUMI_VIDEO_BENCHMARK_SHOTS: "8"
        run: python scripts/benchmark_video_generation.py
      - name: Preserve live-provider quality gate
        run: |
          echo "Synthetic and MockProvider evidence does not certify live video visual quality."
          echo "Production routing remains gated on approved NODE-23 live provider/model video benchmark snapshots."
