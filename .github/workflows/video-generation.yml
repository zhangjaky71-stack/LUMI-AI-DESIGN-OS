name: Video Generation

on:
  pull_request:
    paths:
      - "services/video-generation/**"
      - "services/model-gateway/**"
      - "services/artifact-history/**"
      - "services/identity-engine/**"
      - "services/brand-rules/**"
      - "db/migrations/0001_artifact_engine.sql"
      - "db/migrations/0007_video_generation.sql"
      - "fixtures/video-generation/**"
      - "scripts/validate_video_generation.py"
      - "scripts/benchmark_video_generation.py"
      - "docs/runtime/VIDEO-GENERATION-V1.md"
      - "docs/nodes/NODE-48-VIDEO-GENERATION.md"
      - "reports/nodes/NODE-48/**"
      - ".github/workflows/video-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-generation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile NODE-48 contract files
        run: >-
          python -m compileall -q
          services/video-generation/src
          services/video-generation/tests
          scripts/validate_video_generation.py
          scripts/benchmark_video_generation.py
      - name: Validate NODE-48 architecture contract
        env:
          PYTHONPATH: services/video-generation/src:services/model-gateway/src:services/artifact-history/src
        run: python scripts/validate_video_generation.py

  video-generation-quality:
    needs: video-generation-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Frozen Python workspace install
        run: uv sync --all-packages --frozen
      - name: Run NODE-48 tests
        env:
          PYTHONPATH: services/video-generation/src:services/model-gateway/src:services/artifact-history/src:services/identity-engine/src:services/brand-rules/src
        run: uv run pytest services/video-generation/tests -q
      - name: Ruff correctness gate
        run: >-
          uv run ruff check --ignore E501
          services/video-generation/src
          services/video-generation/tests
          scripts/validate_video_generation.py
          scripts/benchmark_video_generation.py
          services/model-gateway/src/lumi_model_gateway/routing.py
      - name: Pyright runtime gate
        run: uv run pyright -p services/video-generation/pyrightconfig.json

  video-generation-integration:
    needs: video-generation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi
          POSTGRES_DB: lumi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumi -d lumi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
      - name: Frozen Python workspace install
        run: uv sync --all-packages --frozen
      - name: Run video / Model Gateway / Artifact regressions
        env:
          PYTHONPATH: services/video-generation/src:services/model-gateway/src:services/artifact-history/src:services/identity-engine/src:services/brand-rules/src
        run: >-
          uv run pytest
          services/video-generation/tests
          services/model-gateway/tests
          services/artifact-history/tests
          -q
      - name: Apply Artifact and Video Generation migrations
        env:
          PGPASSWORD: lumi
        run: |
          psql -h 127.0.0.1 -U lumi -d lumi -v ON_ERROR_STOP=1 -f db/migrations/0001_artifact_engine.sql
          psql -h 127.0.0.1 -U lumi -d lumi -v ON_ERROR_STOP=1 -f db/migrations/0007_video_generation.sql
      - name: Verify NODE-48 DB contracts
        env:
          PGPASSWORD: lumi
        run: |
          test "$(psql -h 127.0.0.1 -U lumi -d lumi -Atc "select count(*) from information_schema.tables where table_name in ('video_generation_jobs','video_generation_shots','video_provider_jobs','video_generation_cost_reconciliation','video_timelines','video_generation_provenance','video_validation_findings');")" = "7"
          psql -h 127.0.0.1 -U lumi -d lumi -Atc "select data_type from information_schema.columns where table_name='video_generation_cost_reconciliation' and column_name='amount_usd';" | grep -qx numeric
          psql -h 127.0.0.1 -U lumi -d lumi -Atc "select count(*) from pg_indexes where indexname='video_provider_jobs_one_active_attempt_idx';" | grep -qx 1

  video-generation-benchmark:
    needs: video-generation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run deterministic storyboard/timeline benchmark
        env:
          PYTHONPATH: services/video-generation/src:services/model-gateway/src:services/artifact-history/src
          LUMI_VIDEO_BENCHMARK_ITERATIONS: "1000"
          LUMI_VIDEO_BENCHMARK_SHOTS: "8"
        run: python scripts/benchmark_video_generation.py
      - name: Preserve live-provider quality gate
        run: |
          echo "Synthetic and MockProvider evidence does not certify live video visual quality."
          echo "Production routing remains gated on approved NODE-23 live provider/model video benchmark snapshots."
