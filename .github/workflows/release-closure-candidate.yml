name: Release Closure Pyright Diagnose

on:
  pull_request:
    paths:
      - .github/release-closure-candidate-trigger

permissions:
  contents: read

jobs:
  diagnose-pyright-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 174929388975069cd7a5388357b9a5cabbf9506e
      BASE_VERIFIER_COMMIT: 8c2ab60e3b093b80c2d1b046c7eea1b65f72e06e
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - name: Assert exact release parent
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
      - name: Fetch frozen first closure batch
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_VERIFIER_COMMIT"
          git show "$BASE_VERIFIER_COMMIT:.github/workflows/release-closure-candidate.yml" > /tmp/base-verifier.yml
      - name: Apply first and final typed closure batches
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          verifier = Path("/tmp/base-verifier.yml").read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n      - uses: actions/setup-python@v6"
          if start not in verifier or end not in verifier:
              raise SystemExit("frozen verifier patch block not found")
          first_batch = verifier.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(first_batch), "<frozen-first-batch>", "exec"))

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected final patch anchor missing: {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          app = "apps/worker-media/src/lumi_worker_media/app.py"
          replace(
              app,
              "import os\nfrom uuid import UUID",
              "import os\nfrom typing import Any, cast\nfrom uuid import UUID",
          )
          for _ in range(3):
              replace(app, "        retry = self.retry", "        retry = cast(Any, self).retry")
          replace(
              app,
              "    settings = AssetWorkerSettings()",
              "    settings = cast(Any, AssetWorkerSettings)()",
          )

          event_runtime = "apps/worker-media/src/lumi_worker_media/event_runtime.py"
          replace(
              event_runtime,
              "from typing import Any, Protocol",
              "from typing import Any, Protocol, cast",
          )
          replace(
              event_runtime,
              "            with connection.channel() as channel:",
              "            with cast(Any, connection.channel()) as channel:",
          )

          task_base = "apps/worker-media/src/lumi_worker_media/task_base.py"
          replace(task_base, "from typing import Any", "from typing import Any, cast")
          replace(
              task_base,
              "        with Connection(broker_url) as connection, connection.channel() as channel:",
              "        with Connection(broker_url) as connection, cast(Any, connection.channel()) as channel:",
          )

          topology = "apps/worker-media/src/lumi_worker_media/topology.py"
          replace(
              topology,
              "from dataclasses import dataclass\n\nfrom kombu",
              "from dataclasses import dataclass\nfrom typing import Any, cast\n\nfrom kombu",
          )
          replace(
              topology,
              "    with connection.channel() as channel:",
              "    with cast(Any, connection.channel()) as channel:",
          )

          image_entry = "apps/worker-media/tests/test_image_task_entrypoint.py"
          replace(
              image_entry,
              "    parsed = execute.await_args.args[0]",
              "    assert execute.await_args is not None\n    parsed = execute.await_args.args[0]",
          )

          sandbox = "services/video-generation/src/lumi_video_generation/media_sandbox.py"
          replace(
              sandbox,
              '''class SandboxPathResolver(Protocol):\n    def resolve_readonly(self, durable_ref: str) -> str: ...\n    def allocate_output(self, suffix: str) -> str: ...\n    async def ingest_rendered_video(self, path: str, timeline: VideoTimeline) -> RenderedVideo: ...\n''',
              '''class SandboxCompilePathResolver(Protocol):\n    def resolve_readonly(self, durable_ref: str) -> str: ...\n    def allocate_output(self, suffix: str) -> str: ...\n\n\nclass SandboxPathResolver(SandboxCompilePathResolver, Protocol):\n    async def ingest_rendered_video(self, path: str, timeline: VideoTimeline) -> RenderedVideo: ...\n''',
          )
          replace(
              sandbox,
              "    def compile(self, timeline: VideoTimeline, resolver: SandboxPathResolver) -> FfmpegInvocation:",
              "    def compile(\n        self, timeline: VideoTimeline, resolver: SandboxCompilePathResolver\n    ) -> FfmpegInvocation:",
          )
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Canonical Ruff fix and format
        run: |
          uv run ruff check --fix apps services evals
          uv run ruff format apps services evals
      - name: Full Python formatting and lint
        run: |
          uv run ruff format --check apps services evals
          uv run ruff check apps services evals
      - name: Run full Pyright
        id: pyright
        continue-on-error: true
        run: uv run pyright
      - name: Show typed closure boundary
        if: always()
        run: |
          git diff --check
          git diff --name-only
      - name: Require Pyright
        if: always()
        env:
          PYRIGHT_OUTCOME: ${{ steps.pyright.outcome }}
        run: |
          echo "pyright=$PYRIGHT_OUTCOME"
          test "$PYRIGHT_OUTCOME" = success
