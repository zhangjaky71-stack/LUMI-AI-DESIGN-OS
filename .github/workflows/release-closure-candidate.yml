name: Release Closure Python Diagnose

on:
  pull_request:
    paths:
      - .github/release-closure-candidate-trigger

permissions:
  contents: read

jobs:
  diagnose-python-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
      EXPECTED_PARENT: 174929388975069cd7a5388357b9a5cabbf9506e
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-closure-p0
          fetch-depth: 1
      - name: Assert exact release parent
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
      - name: Apply LangGraph restart and Pyright source-root diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}")
              target.write_text(text.replace(old, new, 1))

          script = "scripts/integration_langgraph_postgres_checkpoint.py"
          replace(script, "from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit\n", "")
          replace(script, '\n_SCHEMA = "node28_checkpoint_acceptance"\n', "")
          replace(
              script,
              '''\ndef _with_search_path(dsn: str, schema: str) -> str:\n    parsed = urlsplit(dsn)\n    query = dict(parse_qsl(parsed.query, keep_blank_values=True))\n    query["options"] = f"-csearch_path={schema},public"\n    return urlunsplit(\n        (parsed.scheme, parsed.netloc, parsed.path, urlencode(query), parsed.fragment)\n    )\n''',
              "",
          )
          replace(
              script,
              '''    checkpoint_dsn = _with_search_path(admin_dsn, _SCHEMA)''',
              '''    # Alembic migration 0022 owns checkpoint schema mutation. Runtime must\n    # exercise the migration-provisioned tables without setup privileges.\n    checkpoint_dsn = runtime_dsn''',
          )
          replace(
              script,
              '''        await admin.execute(f'DROP SCHEMA IF EXISTS "{_SCHEMA}" CASCADE')\n        await admin.execute(f'CREATE SCHEMA "{_SCHEMA}"')\n''',
              "",
          )
          replace(script, "            allow_setup=True,", "            allow_setup=False,")
          replace(
              script,
              '''        await admin.execute(f'DROP SCHEMA IF EXISTS "{_SCHEMA}" CASCADE')\n''',
              "",
          )

          pyproject = "pyproject.toml"
          replace(
              pyproject,
              '''  "services/video-generation/src",\n]''',
              '''  "services/video-generation/src",\n  "services/artifact-history/src",\n  "services/brand-rules/src",\n  "services/constraint-engine/src",\n  "services/design-ir/src",\n  "services/identity-engine/src",\n  "services/image-edit/src",\n]''',
          )
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Validate diagnostic patch formatting and lint
        run: |
          uv run ruff format scripts/integration_langgraph_postgres_checkpoint.py
          uv run ruff format --check apps services evals
          uv run ruff check scripts/integration_langgraph_postgres_checkpoint.py
      - name: Start PostgreSQL and dependencies
        run: |
          make infra-env
          make infra-up
      - name: Upgrade and seed database
        run: |
          make db-upgrade
          make db-seed
      - name: Verify migration-owned LangGraph saver restart
        run: >-
          PYTHONPATH=apps/agent-runtime/src:apps/api/src
          uv run python scripts/integration_langgraph_postgres_checkpoint.py
      - name: Run full Pyright after source-root repair
        run: uv run pyright
      - name: Show diagnostic diff boundary
        if: always()
        run: |
          git diff --check
          git diff --name-only
      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true
