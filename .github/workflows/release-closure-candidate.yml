name: Release Closure Exact Candidate Verification

on:
  pull_request:
    paths:
      - .github/release-closure-candidate-trigger

permissions:
  contents: read

jobs:
  verify-exact-python-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: 174929388975069cd7a5388357b9a5cabbf9506e
      CANDIDATE_SHA: acf2d2ad744798b0e2e12d0283c5679a9505d5f7
      CANDIDATE_BRANCH: release-closure-python-candidate
      RELEASE_BRANCH: release-closure-p0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: acf2d2ad744798b0e2e12d0283c5679a9505d5f7
          fetch-depth: 2
      - name: Assert exact immutable candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          remote_candidate="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          remote_release="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          test "$remote_candidate" = "$CANDIDATE_SHA"
          test "$remote_release" = "$EXPECTED_PARENT"
      - name: Assert exact 32-file candidate boundary
        run: |
          set -euo pipefail
          cat > /tmp/expected-paths.txt <<'EOF'
          apps/agent-runtime/src/lumi_agent_runtime/deep_runtime/__init__.py
          apps/agent-runtime/src/lumi_agent_runtime/recipe_engine/approval_bridge.py
          apps/agent-runtime/tests/test_approval_bridge.py
          apps/api/src/lumi_api/assets/router.py
          apps/api/src/lumi_api/persistence/repositories.py
          apps/api/src/lumi_api/persistence/seed.py
          apps/api/tests/integration/test_project_security.py
          apps/api/tests/integration/test_tool_gateway_staging_fixture_postgres.py
          apps/api/tests/test_admin_router.py
          apps/api/tests/test_api_v1_contract.py
          apps/worker-media/src/lumi_worker_media/app.py
          apps/worker-media/src/lumi_worker_media/event_runtime.py
          apps/worker-media/src/lumi_worker_media/task_base.py
          apps/worker-media/src/lumi_worker_media/topology.py
          apps/worker-media/tests/integration/test_image_artifact_event_postgres.py
          apps/worker-media/tests/integration/test_video_hosted_postgres.py
          apps/worker-media/tests/test_event_runtime.py
          apps/worker-media/tests/test_external_wait_runtime.py
          apps/worker-media/tests/test_image_task_entrypoint.py
          apps/worker-media/tests/test_queue_topology.py
          evals/tests/test_release_gate.py
          evals/tests/test_release_security_contracts.py
          evals/tests/test_statistics.py
          pyproject.toml
          scripts/integration_langgraph_postgres_checkpoint.py
          scripts/validate_langgraph_control_plane_contract_v2.py
          services/artifact-history/tests/test_artifact_engine_runtime.py
          services/asset-storage/tests/test_s3_bounded_bytes.py
          services/auth/src/lumi_auth/policy.py
          services/design-ir/src/lumi_design_ir/validation.py
          services/image-edit/src/lumi_image_edit/inmemory.py
          services/video-generation/src/lumi_video_generation/media_sandbox.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          git diff --check "$EXPECTED_PARENT" "$CANDIDATE_SHA"
          git diff --name-only "$EXPECTED_PARENT" "$CANDIDATE_SHA" | sort > /tmp/actual-paths.txt
          sort /tmp/expected-paths.txt -o /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test "$(wc -l < /tmp/actual-paths.txt)" -eq 32
          test "$(git rev-list --count "$EXPECTED_PARENT..$CANDIDATE_SHA")" -eq 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Full Python Ruff and Pyright gates
        run: |
          set -euo pipefail
          uv run ruff format --check apps services evals
          uv run ruff check apps services evals
          uv run ruff format --check \
            scripts/integration_langgraph_postgres_checkpoint.py \
            scripts/validate_langgraph_control_plane_contract_v2.py
          uv run ruff check \
            scripts/integration_langgraph_postgres_checkpoint.py \
            scripts/validate_langgraph_control_plane_contract_v2.py
          uv run pyright
      - name: Full main-CI Python pytest
        run: uv run pytest
      - name: Main-CI eval and contract regression gates
        run: |
          make eval-smoke
          bash scripts/ci-contracts
      - name: LangGraph graph-contract exact gates
        run: |
          set -euo pipefail
          PYTHONPATH=apps/agent-runtime/src python -m compileall -q \
            apps/agent-runtime/src/lumi_agent_runtime/control_plane \
            apps/agent-runtime/tests/test_control_plane.py \
            apps/agent-runtime/tests/test_resume_policy.py \
            apps/agent-runtime/tests/test_control_plane_client.py \
            scripts/validate_langgraph_control_plane_contract_v2.py \
            scripts/integration_langgraph_control_plane.py \
            scripts/integration_langgraph_postgres_control.py \
            scripts/integration_langgraph_postgres_checkpoint.py
          python scripts/validate_idempotency_contract.py
          PYTHONPATH=services/tool-gateway/src python scripts/validate_tool_gateway_contract.py
          PYTHONPATH=apps/api/src:services/model-gateway/src python scripts/validate_cost_ledger_contract.py
          PYTHONPATH=apps/agent-runtime/src python scripts/validate_langgraph_control_plane_contract_v2.py
          PYTHONPATH=apps/agent-runtime/src python -m unittest discover -s apps/agent-runtime/tests -p 'test_control_plane.py'
          PYTHONPATH=apps/agent-runtime/src python -m unittest discover -s apps/agent-runtime/tests -p 'test_control_plane_client.py'
          PYTHONPATH=apps/agent-runtime/src python -m unittest discover -s apps/agent-runtime/tests -p 'test_resume_policy.py'
      - name: LangGraph graph-quality exact gates
        run: |
          set -euo pipefail
          uv run pytest \
            apps/agent-runtime/tests/test_control_plane.py \
            apps/agent-runtime/tests/test_resume_policy.py \
            apps/agent-runtime/tests/test_control_plane_client.py -q
          PYTHONPATH=apps/agent-runtime/src uv run python scripts/integration_langgraph_control_plane.py
          uv run ruff check \
            apps/agent-runtime/src/lumi_agent_runtime/control_plane \
            apps/agent-runtime/tests/test_control_plane.py \
            apps/agent-runtime/tests/test_resume_policy.py \
            apps/agent-runtime/tests/test_control_plane_client.py \
            apps/api/alembic/versions/0012_langgraph_control_plane.py \
            scripts/validate_langgraph_control_plane_contract_v2.py \
            scripts/integration_langgraph_control_plane.py \
            scripts/integration_langgraph_postgres_control.py \
            scripts/integration_langgraph_postgres_checkpoint.py
          uv run pyright \
            apps/agent-runtime/src/lumi_agent_runtime/control_plane \
            apps/agent-runtime/tests/test_control_plane.py \
            apps/agent-runtime/tests/test_resume_policy.py \
            apps/agent-runtime/tests/test_control_plane_client.py
      - name: Start PostgreSQL and dependencies
        run: |
          make infra-env
          make infra-up
      - name: Upgrade and seed database
        env:
          DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
          MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
        run: |
          make db-upgrade
          make db-seed
      - name: LangGraph PostgreSQL exact acceptance gates
        env:
          DATABASE_URL: postgresql+asyncpg://lumi_app:lumi_app_local_only@127.0.0.1:5432/lumi
          MIGRATION_DATABASE_URL: postgresql+asyncpg://lumi_migration:lumi_migration_local_only@127.0.0.1:5432/lumi
        run: |
          set -euo pipefail
          PYTHONPATH=apps/agent-runtime/src:apps/api/src uv run python scripts/integration_langgraph_postgres_control.py
          PYTHONPATH=apps/agent-runtime/src:apps/api/src uv run python scripts/integration_langgraph_postgres_checkpoint.py
          bash scripts/db-local downgrade-smoke
      - name: Final candidate immutability assertion
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          remote_candidate="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          remote_release="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          test "$remote_candidate" = "$CANDIDATE_SHA"
          test "$remote_release" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT" "$CANDIDATE_SHA"
          echo "verified_candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "verified_parent_sha=$EXPECTED_PARENT" >> "$GITHUB_STEP_SUMMARY"
          echo "verified_file_count=32" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: CONFIRM=1 make infra-reset || true
