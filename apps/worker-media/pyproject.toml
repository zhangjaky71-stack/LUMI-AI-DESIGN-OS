[project]
name = "lumi-worker-media"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "asyncpg==0.31.0",
  "celery==5.6.3",
  "fonttools>=4.59,<5",
  "lumi-asset-storage[s3]",
  "lumi-domain",
  "lumi-image-generation",
  "lumi-model-gateway",
  "Pillow==12.3.0",
  "pydantic-settings==2.14.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
lumi-worker-smoke = "lumi_worker_media.smoke:main"
