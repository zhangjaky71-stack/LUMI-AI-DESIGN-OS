[project]
name = "lumi-agent-runtime"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "deepagents==0.6.12",
  "fastapi==0.139.2",
  "langchain==1.3.14",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.2",
  "lumi-model-gateway",
  "lumi-tool-gateway",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
lumi-agent-runtime = "lumi_agent_runtime.runtime_cli:main"
lumi-agent-smoke = "lumi_agent_runtime.smoke:main"
