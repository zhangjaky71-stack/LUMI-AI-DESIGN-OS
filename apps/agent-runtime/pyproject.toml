[project]
name = "lumi-agent-runtime"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "deepagents==0.6.12",
  "langchain==1.3.14",
  "langgraph==1.2.9",
  "lumi-model-gateway",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
lumi-agent-smoke = "lumi_agent_runtime.smoke:main"
