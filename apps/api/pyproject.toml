[project]
name = "lumi-api"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.139.2",
  "pydantic-settings==2.14.2",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
lumi-api = "lumi_api.cli:main"
