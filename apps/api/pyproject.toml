[project]
name = "lumi-api"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "fastapi==0.139.2",
  "lumi-auth",
  "lumi-domain",
  "pgvector==0.5.0",
  "pydantic-settings==2.14.2",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
lumi-api = "lumi_api.cli:main"
