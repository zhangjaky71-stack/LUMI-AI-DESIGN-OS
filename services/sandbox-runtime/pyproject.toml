[project]
name = "lumi-sandbox-runtime"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "boto3>=1.42,<2",
  "fastapi==0.139.2",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
lumi-sandbox-runtime = "lumi_sandbox_runtime.cli:main"
lumi-sandbox-child = "lumi_sandbox_runtime.child_cli:main"
