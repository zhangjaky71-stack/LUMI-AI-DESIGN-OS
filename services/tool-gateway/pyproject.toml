[project]
name = "lumi-tool-gateway"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.139.2",
  "lumi-asset-storage[s3]",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
lumi-tool-gateway = "lumi_tool_gateway.cli:main"
