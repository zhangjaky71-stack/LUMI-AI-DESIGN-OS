[project]
name = "lumi-ai-design-os"
version = "0.0.0"
description = "LUMI AI Design OS Python workspace"
requires-python = "==3.12.*"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest==9.1.1",
  "pyright==1.1.411",
  "ruff==0.15.22",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/agent-runtime",
  "apps/worker-media",
  "services/model-gateway",
  "services/tool-gateway",
  "services/sandbox-runtime",
  "services/memory",
  "services/knowledge",
  "services/visual-critic",
  "services/asset-intelligence",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "apps/api/src",
  "apps/agent-runtime/src",
  "apps/worker-media/src",
  "services/model-gateway/src",
  "services/tool-gateway/src",
  "services/sandbox-runtime/src",
  "services/memory/src",
  "services/knowledge/src",
  "services/visual-critic/src",
  "services/asset-intelligence/src",
  "services/auto-repair/src",
  "evals",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
  "lumi_api",
  "lumi_agent_runtime",
  "lumi_worker_media",
  "lumi_model_gateway",
  "lumi_tool_gateway",
  "lumi_sandbox_runtime",
  "lumi_memory",
  "lumi_knowledge",
  "lumi_visual_critic",
  "lumi_asset_intelligence",
  "lumi_auto_repair",
  "evals",
]
known-third-party = ["fastapi"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps", "services", "evals"]
exclude = ["**/__pycache__", ".venv"]
extraPaths = ["services/auto-repair/src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [
  ".",
  "services/tool-gateway/src",
  "services/auto-repair/src",
]
testpaths = [
  "apps/api/tests",
  "apps/agent-runtime/tests",
  "apps/worker-media/tests",
  "services/tool-gateway/tests",
  "services/auto-repair/tests",
  "evals/tests",
]
