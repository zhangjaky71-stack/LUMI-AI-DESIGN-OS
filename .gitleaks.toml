title = "LUMI AI Design OS Gitleaks Policy"
minVersion = "8.24.3"

[extend]
useDefault = true

[[rules]]
id = "lumi-ci-test-secret"
description = "Deterministic CI sentinel used only for secret-scan fault injection"
regex = '''LUMI_CI_TEST_SECRET\s*=\s*[A-Za-z0-9_-]{16,}'''
keywords = ["LUMI_CI_TEST_SECRET"]

[allowlist]
description = "Local-only examples plus one exact public immutable GitHub Action pin"
regexTarget = "line"
paths = [
  '''(^|/)infra/compose/env\.local\.example$''',
  '''(^|/)\.env\.example$''',
  '''(^|/).*\.env\.example$'''
]
regexes = [
  '''["']aws-actions/configure-aws-credentials["']\s*:\s*["']e6de054238d6b7531b4efff3b6587d9aade6a06c["']'''
]
