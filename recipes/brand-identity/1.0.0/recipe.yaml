{
  "id":"brand-identity",
  "version":"1.0.0",
  "inputs":["brief"],
  "budget_limit_usd":"14",
  "steps":[
    {"id":"research","type":"agent","agent":"researcher@^1","skills":["web-research@^1"],"input":{"brief":"$inputs.brief"},"output_schema":"ResearchOutput","budget_limit_usd":"2"},
    {"id":"strategy","type":"agent","agent":"creative-director@^1","skills":["creative-direction@^1"],"depends_on":["research"],"input":{"brief":"$inputs.brief","research":"$steps.research.output"},"output_schema":"CreativeDirectionOutput","budget_limit_usd":"2"},
    {"id":"moodboards","type":"foreach","count":3,"depends_on":["strategy"],"budget_limit_usd":"6","template":{"id":"moodboard","type":"agent","agent":"creative-director@^1","skills":["creative-direction@^1"],"input":{"strategy":"$steps.strategy.output"},"output_schema":"DesignOutput"},"output_schema":"DesignOutput"},
    {"id":"approve","type":"approval","depends_on":["moodboards"],"approval":{"prompt_summary":"Approve one brand direction before system development.","allowed_actions":["approve","reject"],"option_refs":["$steps.moodboards.output"],"resume_mapping":{"approve":"approved","reject":"rejected"}},"output_schema":"ApprovalResult"},
    {"id":"system","type":"agent","agent":"creative-director@^1","skills":["creative-direction@^1"],"depends_on":["approve"],"input":{"direction":"$steps.moodboards.output","approval":"$steps.approve.output"},"output_schema":"DesignOutput","budget_limit_usd":"2"},
    {"id":"critic","type":"agent","agent":"critic@^1","skills":["visual-critique@^1"],"depends_on":["system"],"input":{"artifact":"$steps.system.output"},"output_schema":"CritiqueOutput","budget_limit_usd":"1"},
    {"id":"finalize","type":"finalize","service":"project.finalize","depends_on":["critic"],"input":{"system":"$steps.system.output","critique":"$steps.critic.output"},"output_schema":"DesignOutput","budget_limit_usd":"1"}
  ],
  "outputs":{"identity":"$steps.finalize.output"},
  "metadata":{"eval_profile":"brand-identity-v1"}
}
