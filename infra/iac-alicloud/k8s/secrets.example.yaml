apiVersion: v1
kind: Secret
metadata:
  name: lumi-runtime-secrets
  namespace: lumi-staging
type: Opaque
stringData:
  LUMI_DATABASE_URL: REPLACE_WITH_LUMI_APP_DATABASE_URL
  MIGRATION_DATABASE_URL: REPLACE_WITH_LUMI_MIGRATION_DATABASE_URL
  LUMI_REDIS_URL: REPLACE_WITH_REDIS_TLS_URL
  LUMI_RABBITMQ_URL: REPLACE_WITH_RABBITMQ_TLS_URL
  LUMI_BILLING_WEBHOOK_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_AUTH_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_SIDE_EFFECT_CONTROL_AUTH_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_TOOL_AUDIT_AUTH_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_TOOL_APPROVAL_AUTH_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_TOOL_DATA_AUTH_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_AGENT_CONTROL_AUTH_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_MODEL_GATEWAY_AUTH_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_TOOL_GATEWAY_AUTH_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_SANDBOX_RUNTIME_AUTH_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  LUMI_MODEL_PROVIDER_SECRET: REPLACE_WITH_PROVIDER_CONFIGURATION_JSON
  LUMI_MEDIA_PROVIDER_SECRET: REPLACE_WITH_PROVIDER_CONFIGURATION_JSON
  LUMI_BRAVE_SEARCH_API_KEY: REPLACE_WITH_SEARCH_API_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: lumi-oss-runtime
  namespace: lumi-staging
type: Opaque
stringData:
  access-key-id: REPLACE_WITH_RUNTIME_RAM_ACCESS_KEY_ID
  secret-access-key: REPLACE_WITH_RUNTIME_RAM_ACCESS_KEY_SECRET
  session-token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: lumi-oss-sandbox
  namespace: lumi-staging
type: Opaque
stringData:
  access-key-id: REPLACE_WITH_SANDBOX_RAM_ACCESS_KEY_ID
  secret-access-key: REPLACE_WITH_SANDBOX_RAM_ACCESS_KEY_SECRET
  session-token: ""
