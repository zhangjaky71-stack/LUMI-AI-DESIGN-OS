apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: lumi
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: lumi
        lumi.dev/http-port: "8000"
        lumi.dev/internet-egress: allowed
    spec:
      serviceAccountName: lumi-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: lumi-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: lumi-runtime-config
          env:
            - name: LUMI_ROLE
              value: api
            - name: LUMI_DATABASE_URL
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_DATABASE_URL}}
            - name: LUMI_REDIS_URL
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_REDIS_URL}}
            - name: LUMI_RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_RABBITMQ_URL}}
            - name: LUMI_BILLING_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_BILLING_WEBHOOK_SECRET}}
            - name: LUMI_AUTH_SIGNING_SECRET
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_AUTH_SIGNING_SECRET}}
            - name: LUMI_SIDE_EFFECT_CONTROL_AUTH_SECRET
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_SIDE_EFFECT_CONTROL_AUTH_SECRET}}
            - name: LUMI_TOOL_AUDIT_AUTH_SECRET
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_TOOL_AUDIT_AUTH_SECRET}}
            - name: LUMI_TOOL_APPROVAL_AUTH_SECRET
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_TOOL_APPROVAL_AUTH_SECRET}}
            - name: LUMI_TOOL_DATA_AUTH_SECRET
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_TOOL_DATA_AUTH_SECRET}}
            - name: LUMI_AGENT_CONTROL_AUTH_SECRET
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_AGENT_CONTROL_AUTH_SECRET}}
            - name: LUMI_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: lumi-oss-runtime, key: access-key-id}}
            - name: LUMI_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: lumi-oss-runtime, key: secret-access-key}}
            - name: LUMI_S3_SESSION_TOKEN
              valueFrom: {secretKeyRef: {name: lumi-oss-runtime, key: session-token, optional: true}}
            - name: S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: lumi-oss-runtime, key: access-key-id}}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: lumi-oss-runtime, key: secret-access-key}}
            - name: S3_SESSION_TOKEN
              valueFrom: {secretKeyRef: {name: lumi-oss-runtime, key: session-token, optional: true}}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
