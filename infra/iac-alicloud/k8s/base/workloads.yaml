apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-media
  labels: {app.kubernetes.io/name: worker-media, app.kubernetes.io/part-of: lumi}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: worker-media}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-media
        app.kubernetes.io/part-of: lumi
        lumi.dev/internet-egress: allowed
    spec:
      serviceAccountName: lumi-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker-media
          image: lumi-worker-media
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: lumi-runtime-config}}]
          env:
            - {name: LUMI_ROLE, value: worker-media}
            - name: LUMI_DATABASE_URL
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_DATABASE_URL}}
            - name: LUMI_REDIS_URL
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_REDIS_URL}}
            - name: LUMI_RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_RABBITMQ_URL}}
            - name: LUMI_MODEL_GATEWAY_AUTH_SECRET
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_MODEL_GATEWAY_AUTH_SECRET}}
            - name: LUMI_SANDBOX_RUNTIME_AUTH_SECRET
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_SANDBOX_RUNTIME_AUTH_SECRET}}
            - name: LUMI_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: lumi-oss-runtime, key: access-key-id}}
            - name: LUMI_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: lumi-oss-runtime, key: secret-access-key}}
            - name: LUMI_S3_SESSION_TOKEN
              valueFrom: {secretKeyRef: {name: lumi-oss-runtime, key: session-token, optional: true}}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          startupProbe: {exec: {command: ["sh", "-c", "kill -0 1"]}, periodSeconds: 5, failureThreshold: 24}
          livenessProbe: {exec: {command: ["sh", "-c", "kill -0 1"]}, periodSeconds: 30, timeoutSeconds: 3}
          readinessProbe: {exec: {command: ["sh", "-c", "kill -0 1"]}, periodSeconds: 10, timeoutSeconds: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 4Gi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-dispatcher
  labels: {app.kubernetes.io/name: outbox-dispatcher, app.kubernetes.io/part-of: lumi}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: outbox-dispatcher}
  template:
    metadata:
      labels: {app.kubernetes.io/name: outbox-dispatcher, app.kubernetes.io/part-of: lumi}
    spec:
      serviceAccountName: lumi-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: outbox-dispatcher
          image: lumi-worker-media
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "lumi_worker_media.cli", "dispatch-outbox", "--watch", "--interval", "1"]
          envFrom: [{configMapRef: {name: lumi-runtime-config}}]
          env:
            - {name: LUMI_ROLE, value: outbox-dispatcher}
            - name: LUMI_DATABASE_URL
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_DATABASE_URL}}
            - name: LUMI_RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: lumi-runtime-secrets, key: LUMI_RABBITMQ_URL}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
          startupProbe: {exec: {command: ["sh", "-c", "kill -0 1"]}, periodSeconds: 5, failureThreshold: 24}
          livenessProbe: {exec: {command: ["sh", "-c", "kill -0 1"]}, periodSeconds: 30, timeoutSeconds: 3}
          readinessProbe: {exec: {command: ["sh", "-c", "kill -0 1"]}, periodSeconds: 10, timeoutSeconds: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
---
