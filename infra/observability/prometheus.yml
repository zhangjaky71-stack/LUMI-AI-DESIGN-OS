global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/lumi-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: lumi-otel-exporter
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: lumi-api-local
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
